<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>חשבון לילדים</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .tab-btn {
      padding: 10px 28px;
      border-radius: 50px;
      border: 2px solid rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
      white-space: nowrap;
    }

    .tab-btn.active, .tab-btn:hover {
      background: rgba(255,255,255,0.35);
      border-color: #fff;
    }

    @media (max-width: 440px) {
      .tabs { gap: 6px; }
      .tab-btn { padding: 8px 10px; font-size: 0.82rem; }
    }

    h1 {
      color: #fff;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      margin-bottom: 30px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
      letter-spacing: 2px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 32px 28px 28px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .score {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 20px;
    }

    .equation {
      font-size: clamp(2.8rem, 12vw, 4.5rem);
      font-weight: 900;
      color: #333;
      margin: 10px 0 16px;
      letter-spacing: 4px;
      line-height: 1.1;
      direction: ltr;
      unicode-bidi: embed;
    }

    .question-mark {
      color: #f7971e;
      cursor: pointer;
      border-bottom: 3px dotted #f7971e;
      transition: transform 0.2s;
      display: inline-block;
    }

    .question-mark:hover {
      transform: scale(1.2);
    }

    .hint-box {
      display: none;
      margin: 0 0 20px;
      padding: 14px 18px;
      background: #fffbe6;
      border: 2px dashed #f7971e;
      border-radius: 16px;
      animation: fadeIn 0.25s ease;
    }

    .hint-box.show { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hint-label {
      font-size: 0.75rem;
      color: #aaa;
      margin-bottom: 10px;
      text-align: center;
    }

    .hint-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .ball-group {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      max-width: 200px;
    }

    .ball {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      flex-shrink: 0;
    }

    .ball-a { background: radial-gradient(circle at 35% 35%, #90caf9, #1565c0); }
    .ball-b { background: radial-gradient(circle at 35% 35%, #ef9a9a, #c62828); }

    .ball-count {
      font-size: 0.72rem;
      font-weight: 800;
      margin-top: 2px;
    }

    .ball-count.a { color: #1565c0; }
    .ball-count.b { color: #c62828; }

    .hint-plus {
      font-size: 1.6rem;
      font-weight: 900;
      color: #ccc;
      line-height: 1;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .option-btn {
      padding: 20px 10px;
      border: 3px solid #e0e0e0;
      border-radius: 16px;
      background: #fafafa;
      font-size: clamp(1.6rem, 6vw, 2.2rem);
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.2s, background 0.2s;
      color: #333;
    }

    .option-btn:hover:not(:disabled) {
      transform: translateY(-3px);
      border-color: #f7971e;
      background: #fff8e1;
    }

    .option-btn:disabled { cursor: default; }

    .option-btn.correct {
      background: #d4f8d4;
      border-color: #4caf50;
      animation: bounce 0.4s ease;
    }

    .option-btn.wrong {
      background: #fde8e8;
      border-color: #f44336;
      animation: shake 0.4s ease;
    }

    @keyframes bounce {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.12); }
      70%  { transform: scale(0.95); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%   { transform: translateX(0); }
      25%  { transform: translateX(-8px); }
      50%  { transform: translateX(8px); }
      75%  { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }

    .feedback {
      margin-top: 22px;
      font-size: 1.25rem;
      font-weight: 700;
      min-height: 2rem;
      transition: opacity 0.3s;
    }

    .feedback.correct { color: #4caf50; }
    .feedback.wrong   { color: #f44336; }
    .feedback.hidden  { opacity: 0; }

    .success-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.97);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .success-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .success-img {
      width: 128px;
      height: 128px;
      image-rendering: pixelated;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .success-emoji {
      font-size: 5rem;
      line-height: 1;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: none;
    }

    .success-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #444;
    }

    .success-en {
      font-size: 0.85rem;
      font-weight: 500;
      color: #aaa;
      margin-top: -6px;
    }

    @keyframes popIn {
      0%   { transform: scale(0) rotate(-10deg); }
      70%  { transform: scale(1.2) rotate(3deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .success-msg {
      font-size: 1.6rem;
      font-weight: 900;
      color: #4caf50;
    }

    .next-btn {
      margin-top: 10px;
      padding: 14px 40px;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 16px rgba(247,151,30,0.4);
    }

    .next-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(247,151,30,0.5); }

    .next-btn-inline {
      margin-top: 20px;
      padding: 14px 40px;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      display: none;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 16px rgba(247,151,30,0.4);
    }

    .next-btn-inline:hover { transform: translateY(-2px); }
    .next-btn-inline.visible { display: inline-block; }

    .progress-bar-wrap {
      width: 100%;
      height: 8px;
      background: #eee;
      border-radius: 8px;
      margin-bottom: 18px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #f7971e, #ffd200);
      border-radius: 8px;
      transition: width 0.4s ease;
    }

    .hint-tip {
      font-size: 0.72rem;
      color: #bbb;
      margin-bottom: 14px;
      direction: rtl;
    }
  </style>
</head>
<body>
  <nav class="tabs">
    <a class="tab-btn" href="index.html">🎨 צבעים</a>
    <a class="tab-btn active" href="math.html">➕ חשבון</a>
    <a class="tab-btn" href="words.html">📖 מילים</a>
    <a class="tab-btn" href="alef-bet.html">א-ב</a>
      <a class="tab-btn" href="pokemon.html">⚡ פוקימון</a>
      <a class="tab-btn" href="maze.html">🧩 מבוך</a>
  </nav>
  <h1>➕ ללמוד חשבון!</h1>

  <div class="card">
    <div class="score" id="score">שאלה 1</div>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>

    <div class="equation" id="equation"></div>
    <div class="hint-tip">לחץ על <strong style="color:#f7971e">?</strong> לרמז</div>
    <div class="hint-box" id="hintBox"></div>

    <div class="options" id="options"></div>
    <div class="feedback hidden" id="feedback"></div>
    <button class="next-btn-inline" id="nextBtn" onclick="nextRound()">הבא ←</button>

    <div class="success-overlay" id="successOverlay">
      <img class="success-img" id="successImg" src="" alt="" />
      <div class="success-emoji" id="successEmoji"></div>
      <div class="success-name" id="successName"></div>
      <div class="success-en" id="successEn"></div>
      <div class="success-msg" id="successMsg"></div>
      <button class="next-btn" onclick="nextRound()">הבא ←</button>
    </div>
  </div>

  <script>
    const BASE = 'https://resource.pokemon-home.com/battledata/img/pokei128/icon';
    const CREATURES = [
      { num: '0001', name: 'בולבסאור',   en: 'Bulbasaur'  },
      { num: '0004', name: 'שרמנדר',     en: 'Charmander' },
      { num: '0007', name: 'סקווירטל',   en: 'Squirtle'   },
      { num: '0025', name: 'פיקאצ׳ו',    en: 'Pikachu'    },
      { num: '0035', name: 'קלפיירי',    en: 'Clefairy'   },
      { num: '0039', name: 'ג׳יגלי פאף', en: 'Jigglypuff' },
      { num: '0052', name: 'מיאות׳',     en: 'Meowth'     },
      { num: '0054', name: 'סייידאק',    en: 'Psyduck'    },
      { num: '0094', name: 'גנגאר',      en: 'Gengar'     },
      { num: '0129', name: 'מאגיקרפ',    en: 'Magikarp'   },
      { num: '0131', name: 'לפראס',      en: 'Lapras'     },
      { num: '0133', name: 'איווי',      en: 'Eevee'      },
      { num: '0143', name: 'סנורלקס',    en: 'Snorlax'    },
      { num: '0149', name: 'דרגוניט',    en: 'Dragonite'  },
      { num: '0150', name: 'מיוטו',      en: 'Mewtwo'     },
      { num: '0151', name: 'מיו',        en: 'Mew'        },
      { num: '0155', name: 'סינדאקוויל', en: 'Cyndaquil'  },
      { num: '0175', name: 'טוגפי',      en: 'Togepi'     },
      { num: '0196', name: 'אספאון',     en: 'Espeon'     },
      { num: '0197', name: 'אמברון',     en: 'Umbreon'    },
      { num: '0249', name: 'לוג׳יה',     en: 'Lugia'      },
      { num: '0250', name: 'הו-אוה',     en: 'Ho-Oh'      },
      { num: '0255', name: 'טורצ׳יק',    en: 'Torchic'    },
      { num: '0258', name: 'מאדקיפ',     en: 'Mudkip'     },
      { num: '0385', name: 'ג׳יראצ׳י',   en: 'Jirachi'    },
      { num: '0448', name: 'לוקריו',     en: 'Lucario'    },
      { num: '0658', name: 'גרנינג׳ה',   en: 'Greninja'   },
      { num: '0700', name: 'סילווייאון', en: 'Sylveon'    },
      { num: '0813', name: 'סקורבאני',   en: 'Scorbunny'  },
      { num: '0909', name: 'פואקוקו',    en: 'Fuecoco'    },
    ];

    const SUCCESS_MSGS = ['!כל הכבוד','!מדהים','!מצוין','!וואו','!נהדר','!אלוף'];

    let score = 0;
    let total = 0;
    let correct = null;
    let currentA = 0;
    let currentB = 0;
    let answered = false;
    let hintVisible = false;
    let firstTry = true;

    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function uniqueOptions(answer) {
      const set = new Set([answer]);
      while (set.size < 4) {
        const delta = rand(-4, 4);
        const v = answer + delta;
        if (v >= 0 && v !== answer) set.add(v);
      }
      return shuffle([...set]);
    }

    function shuffle(arr) {
      return [...arr].sort(() => Math.random() - 0.5);
    }

    function buildBalls(n, cls) {
      return Array(n).fill(null).map(() =>
        `<div class="ball ${cls}"></div>`
      ).join('');
    }

    let audioCtx = null;
    function getCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function playSuccess() {
      const ctx = getCtx();
      [523, 659, 784].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = freq;
        const t = ctx.currentTime + i * 0.13;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.18, t + 0.04);
        gain.gain.linearRampToValueAtTime(0, t + 0.28);
        osc.start(t); osc.stop(t + 0.3);
      });
    }

    function playError() {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(280, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(180, ctx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.32);
    }

    function toggleHint() {
      if (answered) return;
      const box = document.getElementById('hintBox');
      hintVisible = !hintVisible;
      if (hintVisible) {
        box.innerHTML = `
          <div class="hint-label">ספור את הכדורים!</div>
          <div class="hint-col">
            <div class="ball-group">${buildBalls(currentA, 'ball-a')}</div>
            <div class="ball-count a">${currentA}</div>
            <div class="hint-plus">+</div>
            <div class="ball-group">${buildBalls(currentB, 'ball-b')}</div>
            <div class="ball-count b">${currentB}</div>
          </div>`;
        box.classList.add('show');
      } else {
        box.classList.remove('show');
      }
    }

    function nextRound() {
      document.getElementById('successOverlay').classList.remove('show');
      answered = false;
      hintVisible = false;
      firstTry = true;
      document.getElementById('feedback').className = 'feedback hidden';
      document.getElementById('feedback').textContent = '';
      document.getElementById('nextBtn').classList.remove('visible');
      document.getElementById('hintBox').classList.remove('show');
      document.getElementById('hintBox').innerHTML = '';

      total++;
      const max = total <= 5 ? 4 : 9;
      currentA = rand(1, max);
      currentB = rand(1, max);
      correct = currentA + currentB;

      document.getElementById('score').textContent = `שאלה ${total}  |  ✅ ${score}`;
      document.getElementById('progressBar').style.width = Math.min((score / 10) * 100, 100) + '%';

      document.getElementById('equation').innerHTML =
        `${currentA} + ${currentB} = <span class="question-mark" onclick="toggleHint()">?</span>`;

      const container = document.getElementById('options');
      container.innerHTML = '';

      uniqueOptions(correct).forEach(val => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = val;
        btn.onclick = () => pick(btn, val);
        container.appendChild(btn);
      });
    }

    function pick(btn, val) {
      if (answered || btn.disabled) return;

      if (val === correct) {
        answered = true;
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
        btn.classList.add('correct');
        score++;
        document.getElementById('score').textContent = `שאלה ${total}  |  ✅ ${score}`;
        document.getElementById('progressBar').style.width = Math.min((score / 10) * 100, 100) + '%';
        document.getElementById('feedback').className = 'feedback hidden';
        setTimeout(() => {
          if (firstTry) {
            const creature = CREATURES[Math.floor(Math.random() * CREATURES.length)];
            const msg = SUCCESS_MSGS[Math.floor(Math.random() * SUCCESS_MSGS.length)];
            document.getElementById('successImg').src = BASE + creature.num + '_f00_s0.png';
            document.getElementById('successImg').alt = creature.en;
            document.getElementById('successImg').style.display = '';
            document.getElementById('successEmoji').style.display = 'none';
            document.getElementById('successName').textContent = creature.name;
            document.getElementById('successEn').textContent = creature.en;
            document.getElementById('successMsg').textContent = msg;
          } else {
            document.getElementById('successImg').style.display = 'none';
            document.getElementById('successEmoji').style.display = 'block';
            document.getElementById('successEmoji').textContent = '👍';
            document.getElementById('successName').textContent = '';
            document.getElementById('successEn').textContent = '';
            document.getElementById('successMsg').textContent = 'נכון!';
          }
          document.getElementById('successOverlay').classList.add('show');
          playSuccess();
        }, 350);
      } else {
        firstTry = false;
        btn.classList.add('wrong');
        btn.disabled = true;
        playError();
        const feedback = document.getElementById('feedback');
        feedback.textContent = '!נסה שוב 💪';
        feedback.className = 'feedback wrong';
      }
    }

    nextRound();
  </script>
</body>
</html>
