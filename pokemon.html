<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>פוקימון - מי זה?</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #f5a623 0%, #e8372b 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.3);
      display: flex;
      gap: 5px;
      padding: 6px 10px;
      z-index: 10;
      justify-content: center;
      flex-wrap: nowrap;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 4px 9px;
      border-radius: 20px;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.25);
      transition: background 0.2s;
      white-space: nowrap;
    }

    nav a:hover { background: rgba(255,255,255,0.3); }
    nav a.active { background: rgba(255,255,255,0.35); border-color: #fff; }

    h1 {
      color: #fff;
      font-size: clamp(1rem, 3.5vw, 1.4rem);
      margin: 50px 0 8px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.3);
      text-align: center;
    }

    /* Floating points counter */
    .points-banner {
      position: fixed;
      top: 46px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: #ffd700;
      font-weight: 900;
      font-size: 1.1rem;
      padding: 4px 18px;
      border-radius: 20px;
      z-index: 9;
      display: none;
      white-space: nowrap;
      letter-spacing: 1px;
    }

    .points-banner.visible { display: block; }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 12px 14px 14px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 16px 50px rgba(0,0,0,0.25);
      text-align: center;
      position: relative;
    }

    /* Timer toggle button */
    .timer-toggle {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid #ddd;
      background: #f9f9f9;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .timer-toggle.active {
      background: #f5a623;
      border-color: #e8372b;
      box-shadow: 0 0 0 3px rgba(245,166,35,0.3);
    }

    .score {
      font-size: 0.82rem;
      color: #999;
      margin-bottom: 8px;
    }

    /* Silhouette with reveal cover */
    .silhouette-wrap {
      border-radius: 14px;
      border: 3px solid #ddd;
      padding: 8px;
      display: inline-block;
      margin-bottom: 8px;
      position: relative;
      overflow: hidden;
    }

    .pokemon-img {
      height: 116px;
      width: 116px;
      object-fit: contain;
      image-rendering: pixelated;
      display: block;
      transition: filter 0.7s ease;
    }

    .pokemon-img.silhouette { filter: brightness(0); }
    .pokemon-img.revealed   { filter: none; animation: popIn 0.5s ease; }

    /* White cover that slides right to reveal the Pokémon from left to right */
    .reveal-cover {
      position: absolute;
      top: 0; bottom: 0;
      left: 0%; right: 0;
      background: #fff;
      pointer-events: none;
      transition: none;
    }

    /* Progress bar under silhouette in timer mode */
    .timer-bar-wrap {
      height: 5px;
      background: #eee;
      border-radius: 3px;
      margin: 4px 0 6px;
      overflow: hidden;
      display: none;
    }

    .timer-bar-wrap.visible { display: block; }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #4caf50, #f5a623, #e8372b);
      transform-origin: left;
      transition: none;
    }

    @keyframes popIn {
      0%   { transform: scale(0.7); opacity: 0.3; }
      60%  { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    .question {
      font-size: clamp(0.9rem, 3vw, 1.05rem);
      font-weight: 700;
      color: #444;
      margin: 4px 0 10px;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .option-btn {
      border: 3px solid #e0e0e0;
      border-radius: 12px;
      background: #fafafa;
      cursor: pointer;
      padding: 7px 5px;
      transition: transform 0.15s, border-color 0.2s, background 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .option-btn img {
      width: 77px;
      height: 77px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .option-btn .poke-name {
      font-size: 0.72rem;
      font-weight: 700;
      color: #555;
    }

    .option-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: #aaa;
      background: #f0f0f0;
    }

    .option-btn:disabled { cursor: default; }

    .option-btn.wrong {
      background: #fde8e8;
      border-color: #f44336;
      animation: shake 0.4s ease;
    }

    .option-btn.correct {
      background: #d4f8d4;
      border-color: #4caf50;
      animation: bounce 0.4s ease;
    }

    @keyframes bounce {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.08); }
      70%  { transform: scale(0.97); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%   { transform: translateX(0); }
      25%  { transform: translateX(-6px); }
      50%  { transform: translateX(6px); }
      75%  { transform: translateX(-4px); }
      100% { transform: translateX(0); }
    }

    .feedback {
      margin-top: 8px;
      font-size: 1rem;
      font-weight: 700;
      min-height: 1.4rem;
      color: #f44336;
    }

    /* Success popup */
    .success-popup {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.96);
      border-radius: 20px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      z-index: 5;
      animation: fadeIn 0.3s ease;
    }

    .success-popup.show { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to   { opacity: 1; transform: scale(1); }
    }

    .success-popup img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      image-rendering: pixelated;
      animation: popIn 0.5s ease;
    }

    .success-popup .success-msg {
      font-size: 1.3rem;
      font-weight: 900;
      color: #4caf50;
    }

    .success-popup .reward-emoji { font-size: 1.8rem; }

    .success-popup .poke-label {
      font-size: 1.4rem;
      font-weight: 900;
      color: #e8372b;
      letter-spacing: 1px;
    }

    .success-popup .poke-sublabel {
      font-size: 0.78rem;
      color: #aaa;
      font-weight: 600;
      margin-top: -4px;
    }

    .success-popup .time-points {
      font-size: 0.88rem;
      color: #888;
      font-weight: 600;
    }

    .success-popup .earned-points {
      font-size: 1.5rem;
      font-weight: 900;
      color: #f5a623;
    }

    .success-popup .total-pts {
      font-size: 0.8rem;
      color: #aaa;
    }

    .next-btn {
      margin-top: 4px;
      padding: 11px 34px;
      background: linear-gradient(135deg, #f5a623, #e8372b);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(232,55,43,0.4);
      transition: transform 0.15s;
    }

    .next-btn:hover { transform: translateY(-2px); }

    .loading {
      color: #aaa;
      font-size: 0.95rem;
      padding: 20px 0;
      grid-column: span 2;
    }

    .pokeball-spin {
      display: inline-block;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">🎨 צבעים</a>
    <a href="math.html">➕ חשבון</a>
    <a href="words.html">📖 מילים</a>
    <a href="alef-bet.html">א-ב</a>
    <a href="pokemon.html" class="active">⚡ פוקימון</a>
  </nav>

  <!-- Floating points available countdown (timer mode only) -->
  <div class="points-banner" id="pointsBanner">⭐ <span id="ptCountdown">30</span> נקודות</div>

  <h1>⚡ מי הפוקימון הזה?</h1>

  <div class="card">
    <!-- Timer mode toggle -->
    <button class="timer-toggle" id="timerToggle" title="מצב טיימר" onclick="toggleTimerMode()">⏱</button>

    <div class="score" id="score">שאלה 1 | ✅ 0 | 🏅 0</div>

    <div class="silhouette-wrap" id="silhouetteWrap">
      <img class="pokemon-img silhouette" id="pokemonImg" src="" alt="צללית" />
      <div class="reveal-cover" id="revealCover" style="display:none"></div>
    </div>

    <div class="timer-bar-wrap" id="timerBarWrap">
      <div class="timer-bar" id="timerBar"></div>
    </div>

    <div class="question">התאם את הצל לפוקימון הנכון!</div>

    <div class="options" id="options">
      <div class="loading"><span class="pokeball-spin">⚪</span> טוען...</div>
    </div>

    <div class="feedback" id="feedback"></div>

    <!-- Success popup -->
    <div class="success-popup" id="successPopup">
      <img id="successImg" src="" alt="" />
      <div class="success-msg">!כל הכבוד 🎉</div>
      <div class="reward-emoji" id="rewardEmoji"></div>
      <div class="poke-sublabel">:זה היה</div>
      <div class="poke-label" id="successLabel"></div>
      <div class="time-points" id="timeInfo" style="display:none"></div>
      <div class="earned-points" id="earnedPoints" style="display:none"></div>
      <div class="total-pts" id="totalPts" style="display:none"></div>
      <button class="next-btn" onclick="nextRound()">הבא ←</button>
    </div>
  </div>

  <script>
    const TOTAL = 151;
    let score = 0;
    let total = 0;
    let totalPoints = 0;
    let correctPokemon = null;
    let firstTry = true;

    // Timer mode state
    let timerMode = false;
    let timerStart = null;
    let timerRAF = null;
    const TIMER_DURATION = 30000; // 30 seconds in ms

    const HE_NAMES = {
      1:'בולבסאור',2:'איוויזאור',3:'ונוזאור',4:'שרמנדר',5:'שרמליאון',6:'שרמיזון',
      7:'סקווירטל',8:'וורטורטל',9:'בלסטויז',10:'קטרפי',11:'מטאפוד',12:'באטרפרי',
      13:'ווידל',14:'קוקון',15:'בידריל',16:'פידג׳י',17:'פידג׳ייאוטו',18:'פידג׳ייאוט',
      19:'ראטאטה',20:'ראטיקייט',21:'ספירו',22:'פירות',23:'אקארס',24:'אריאוקס',
      25:'פיקאצ׳ו',26:'ריצ׳ו',27:'סנדשרו',28:'סנדסלאש',29:'נידורן ♀',30:'נידורינה',
      31:'נידוקווין',32:'נידורן ♂',33:'נידורינו',34:'נידוקינג',35:'קלפיירי',36:'קלפאבל',
      37:'וולפיקס',38:'ניינטייל',39:'ג׳יגלי פאף',40:'ווויגלי טאף',41:'זובאט',42:'גולבאט',
      43:'אוד',44:'גלום',45:'וילפלאום',46:'פאראס',47:'פאראסקט',48:'ווואדל',49:'ווואסקאוט',
      50:'דיגלט',51:'דוגטריו',52:'מיאות׳',53:'פרסיאן',54:'סייידאק',55:'גולדאק',
      56:'מנקי',57:'פריימייפ',58:'גרואוליית׳',59:'ארקנין',60:'פוליווג',61:'פוליוווירל',
      62:'פוליווארת׳',63:'אברה',64:'קאדאברה',65:'אלאקאזאם',66:'מאצ׳אופ',67:'מאצ׳וק',
      68:'מאצ׳אמפ',69:'בלבסאור',70:'ויקטריבל',71:'ויקטריבל',72:'טנטקול',73:'טנטקראל',
      74:'ג׳ייאודוס',75:'גראווללר',76:'גולם',77:'פוניטה',78:'ראפידאש',79:'סלואופוק',
      80:'סלואוברו',81:'מגנמייט',82:'מגנטון',83:'פארפץ׳ד',84:'דודו',85:'דודריו',
      86:'סיל',87:'דיוגונג',88:'גריימר',89:'מאק',90:'שלדר',91:'קלוסטר',
      92:'גאסטלי',93:'האונטר',94:'גנגאר',95:'אונייקס',96:'דראוזי',97:'היפנו',
      98:'קראב',99:'קינגלר',100:'וולטורב',101:'אלקטרוד',102:'אגזקוט',103:'אגזגוטור',
      104:'קיופוני',105:'מארואוק',106:'היטמונלי',107:'היטמונצ׳אן',108:'ליקיטונג',
      109:'קופינג',110:'ווויזינג',111:'ריהורן',112:'ריידון',113:'צ׳אנסי',114:'טנגלה',
      115:'קנגסקאן',116:'הורסיה',117:'סיידרה',118:'גולדין',119:'סיראקינג',
      120:'סטארו',121:'סטאריו',122:'מר. מייים',123:'סקייתר',124:'ג׳ינקס',
      125:'אלקטאבאז',126:'מאגמאר',127:'פינסיר',128:'טאורוס',129:'מאגיקרפ',
      130:'גיאראדוס',131:'לפראס',132:'דיטו',133:'איווי',134:'ווייפורין',
      135:'ג׳ולטיאון',136:'פלריאון',137:'פורטה',138:'אומאניט',139:'אומאסטאר',
      140:'קאבוטו',141:'קאבוטופס',142:'אירודקטיל',143:'סנורלקס',144:'ארטיקונו',
      145:'זאפדוס',146:'מולטרס',147:'דרטיני',148:'דרגונאיר',149:'דרגוניט',
      150:'מיוטו',151:'מיו'
    };

    function heName(id, engName) { return HE_NAMES[id] || engName; }

    // ── Audio ──────────────────────────────────────────────
    let audioCtx = null;
    function getCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function speakName(englishName) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(englishName);
      utt.lang = 'en-US';
      utt.rate = 0.85;
      utt.pitch = 1.1;
      window.speechSynthesis.speak(utt);
    }

    function playSuccess() {
      const ctx = getCtx();
      [523, 659, 784, 1047].forEach((freq, i) => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine'; osc.frequency.value = freq;
        const t = ctx.currentTime + i * 0.12;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.2, t + 0.04);
        gain.gain.linearRampToValueAtTime(0, t + 0.25);
        osc.start(t); osc.stop(t + 0.28);
      });
    }

    function playError() {
      const ctx = getCtx();
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(300, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(150, ctx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.35);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.38);
    }

    // ── Timer mode ─────────────────────────────────────────
    function toggleTimerMode() {
      timerMode = !timerMode;
      const btn = document.getElementById('timerToggle');
      btn.classList.toggle('active', timerMode);
      if (!timerMode) stopTimer();
      nextRound();
    }

    function startTimer() {
      stopTimer();
      timerStart = performance.now();
      document.getElementById('revealCover').style.display = 'block';
      document.getElementById('revealCover').style.left = '0%';
      document.getElementById('timerBarWrap').classList.add('visible');
      document.getElementById('timerBar').style.transform = 'scaleX(1)';
      document.getElementById('pointsBanner').classList.add('visible');
      document.getElementById('ptCountdown').textContent = '30';

      function tick(now) {
        const elapsed = now - timerStart;
        const progress = Math.min(elapsed / TIMER_DURATION, 1);
        const secsLeft = Math.max(0, 30 - Math.floor(elapsed / 1000));

        // Reveal cover: left goes from 0% → 100% (reveals left to right)
        document.getElementById('revealCover').style.left = (progress * 100) + '%';

        // Bar shrinks right to left as time runs out
        document.getElementById('timerBar').style.transform = `scaleX(${1 - progress})`;

        // Points countdown
        document.getElementById('ptCountdown').textContent = secsLeft;

        if (progress < 1) {
          timerRAF = requestAnimationFrame(tick);
        } else {
          // Time up — fully revealed silhouette, cover gone
          document.getElementById('revealCover').style.display = 'none';
        }
      }

      timerRAF = requestAnimationFrame(tick);
    }

    function stopTimer() {
      if (timerRAF) { cancelAnimationFrame(timerRAF); timerRAF = null; }
      document.getElementById('revealCover').style.display = 'none';
      document.getElementById('timerBarWrap').classList.remove('visible');
      document.getElementById('pointsBanner').classList.remove('visible');
    }

    function getElapsedSeconds() {
      if (!timerStart) return 0;
      return Math.min(30, (performance.now() - timerStart) / 1000);
    }

    function pointsForTime(elapsedSec) {
      return Math.max(0, 30 - Math.floor(elapsedSec));
    }

    // ── Helpers ────────────────────────────────────────────
    function randId() { return Math.floor(Math.random() * TOTAL) + 1; }

    function uniqueIds(count) {
      const ids = new Set();
      while (ids.size < count) ids.add(randId());
      return [...ids];
    }

    function spriteUrl(id) {
      return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
    }

    async function fetchPokemon(id) {
      const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
      const data = await res.json();
      return { id, name: data.name, heName: heName(id, data.name), sprite: spriteUrl(id) };
    }

    // ── Game rounds ────────────────────────────────────────
    async function nextRound() {
      stopTimer();
      firstTry = true;
      document.getElementById('feedback').textContent = '';
      document.getElementById('successPopup').classList.remove('show');
      document.getElementById('options').innerHTML = '<div class="loading"><span class="pokeball-spin">⚪</span> טוען...</div>';

      const img = document.getElementById('pokemonImg');
      img.src = ''; img.className = 'pokemon-img silhouette';

      total++;
      updateScore();

      const ids = uniqueIds(4);
      const pokemons = await Promise.all(ids.map(fetchPokemon));
      correctPokemon = pokemons[Math.floor(Math.random() * pokemons.length)];
      img.src = correctPokemon.sprite;

      const container = document.getElementById('options');
      container.innerHTML = '';
      const shuffled = [...pokemons].sort(() => Math.random() - 0.5);
      shuffled.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.dataset.name = p.name;
        btn.innerHTML = `<img src="${p.sprite}" alt="${p.heName}" loading="lazy" /><span class="poke-name">${p.heName}</span>`;
        btn.onclick = () => pick(btn, p);
        container.appendChild(btn);
      });

      // Wait for image to load then start timer
      if (timerMode) {
        img.onload = () => startTimer();
        if (img.complete) startTimer();
      }
    }

    function pick(btn, pokemon) {
      if (btn.disabled) return;

      if (pokemon.name === correctPokemon.name) {
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
        btn.classList.add('correct');
        stopTimer();

        const elapsedSec = getElapsedSeconds();
        const earned = timerMode ? pointsForTime(elapsedSec) : 0;

        if (firstTry) { score++; totalPoints += earned; }
        updateScore();
        playSuccess();

        // Populate popup
        document.getElementById('successImg').src = correctPokemon.sprite;
        document.getElementById('successLabel').textContent = correctPokemon.heName;
        document.getElementById('rewardEmoji').textContent = firstTry ? randomReward() : '👍';

        if (timerMode && firstTry) {
          const secs = elapsedSec.toFixed(1);
          document.getElementById('timeInfo').textContent = `⏱ זמן: ${secs} שניות`;
          document.getElementById('timeInfo').style.display = 'block';
          document.getElementById('earnedPoints').textContent = `+${earned} נקודות`;
          document.getElementById('earnedPoints').style.display = 'block';
          document.getElementById('totalPts').textContent = `סה״כ: ${totalPoints} נקודות`;
          document.getElementById('totalPts').style.display = 'block';
        } else {
          document.getElementById('timeInfo').style.display = 'none';
          document.getElementById('earnedPoints').style.display = 'none';
          document.getElementById('totalPts').style.display = 'none';
        }

        setTimeout(() => {
          document.getElementById('successPopup').classList.add('show');
          speakName(correctPokemon.name);
        }, 300);

      } else {
        btn.classList.add('wrong');
        btn.disabled = true;
        firstTry = false;
        playError();
        document.getElementById('feedback').textContent = '!נסה שוב 💪';
        setTimeout(() => {
          btn.classList.remove('wrong');
          document.getElementById('feedback').textContent = '';
        }, 800);
      }
    }

    function updateScore() {
      const pts = timerMode ? ` | 🏅 ${totalPoints}` : '';
      document.getElementById('score').textContent = `שאלה ${total} | ✅ ${score}${pts}`;
    }

    function randomReward() {
      const r = ['🏆', '⭐⭐⭐', '🎖️', '🌟🌟', '👑', '💫💫💫', '🥇'];
      return r[Math.floor(Math.random() * r.length)];
    }

    nextRound();
  </script>
</body>
</html>
