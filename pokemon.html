<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Who's That Pokémon?</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #f5a623 0%, #e8372b 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.3);
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      z-index: 10;
      flex-wrap: wrap;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.3);
      transition: background 0.2s;
      white-space: nowrap;
    }

    nav a:hover { background: rgba(255,255,255,0.3); }
    nav a.active { background: rgba(255,255,255,0.35); border-color: #fff; }

    h1 {
      color: #fff;
      font-size: clamp(1.2rem, 4vw, 1.7rem);
      margin: 58px 0 12px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
      text-align: center;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 16px 16px 16px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      text-align: center;
    }

    .score {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 14px;
    }

    .silhouette-wrap {
      background: #1a1a2e;
      border-radius: 16px;
      padding: 10px;
      display: inline-block;
      margin-bottom: 10px;
    }

    .pokemon-img {
      height: 100px;
      width: 100px;
      object-fit: contain;
      image-rendering: pixelated;
      display: block;
      transition: filter 0.7s ease;
    }

    .pokemon-img.silhouette { filter: brightness(0) invert(0); }
    .pokemon-img.revealed   { filter: none; animation: popIn 0.5s ease; }

    @keyframes popIn {
      0%   { transform: scale(0.7); opacity: 0.3; }
      60%  { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    .question {
      font-size: clamp(1rem, 4vw, 1.3rem);
      font-weight: 700;
      color: #333;
      margin: 10px 0 18px;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .option-btn {
      border: 3px solid #e0e0e0;
      border-radius: 14px;
      background: #fafafa;
      cursor: pointer;
      padding: 8px 6px;
      transition: transform 0.15s, border-color 0.2s, background 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .option-btn img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .option-btn .poke-name {
      font-size: 0.78rem;
      font-weight: 700;
      color: #555;
      text-transform: capitalize;
    }

    .option-btn:hover:not(:disabled) {
      transform: translateY(-3px);
      border-color: #aaa;
      background: #f0f0f0;
    }

    .option-btn:disabled { cursor: default; }

    .option-btn.correct {
      background: #d4f8d4;
      border-color: #4caf50;
      animation: bounce 0.4s ease;
    }

    .option-btn.wrong {
      background: #fde8e8;
      border-color: #f44336;
      animation: shake 0.4s ease;
    }

    @keyframes bounce {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.08); }
      70%  { transform: scale(0.97); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%   { transform: translateX(0); }
      25%  { transform: translateX(-6px); }
      50%  { transform: translateX(6px); }
      75%  { transform: translateX(-4px); }
      100% { transform: translateX(0); }
    }

    .feedback {
      margin-top: 16px;
      font-size: 1.15rem;
      font-weight: 700;
      min-height: 1.6rem;
      text-transform: capitalize;
    }

    .feedback.correct { color: #4caf50; }
    .feedback.wrong   { color: #f44336; }
    .feedback.hidden  { opacity: 0; }

    .reward {
      font-size: 1.8rem;
      margin-top: 4px;
      min-height: 2rem;
    }

    .next-btn {
      margin-top: 16px;
      padding: 12px 36px;
      background: linear-gradient(135deg, #f5a623, #e8372b);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: none;
      box-shadow: 0 4px 16px rgba(232,55,43,0.4);
      transition: transform 0.15s;
    }

    .next-btn:hover { transform: translateY(-2px); }
    .next-btn.visible { display: inline-block; }

    .loading {
      color: #aaa;
      font-size: 1rem;
      padding: 30px 0;
      grid-column: span 2;
    }

    .pokeball-spin {
      display: inline-block;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">🎨 צבעים</a>
    <a href="math.html">➕ חשבון</a>
    <a href="words.html">📖 מילים</a>
    <a href="alef-bet.html">א-ב</a>
    <a href="pokemon.html" class="active">⚡ פוקימון</a>
  </nav>

  <h1>⚡ Who's That Pokémon?</h1>

  <div class="card">
    <div class="score" id="score">Question 1 | ✅ 0</div>

    <div class="silhouette-wrap">
      <img class="pokemon-img silhouette" id="pokemonImg" src="" alt="silhouette" />
    </div>

    <div class="question">Match the shadow to the right Pokémon!</div>

    <div class="options" id="options">
      <div class="loading"><span class="pokeball-spin">⚪</span> Loading...</div>
    </div>

    <div class="feedback hidden" id="feedback"></div>
    <div class="reward" id="reward"></div>
    <button class="next-btn" id="nextBtn" onclick="nextRound()">Next →</button>
  </div>

  <script>
    const TOTAL = 151;
    let score = 0;
    let total = 0;
    let correctPokemon = null;
    let answered = false;

    function randId() {
      return Math.floor(Math.random() * TOTAL) + 1;
    }

    function uniqueIds(count) {
      const ids = new Set();
      while (ids.size < count) ids.add(randId());
      return [...ids];
    }

    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function spriteUrl(id) {
      return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
    }

    async function fetchPokemon(id) {
      const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
      const data = await res.json();
      return { id, name: data.name, sprite: spriteUrl(id) };
    }

    async function nextRound() {
      answered = false;
      document.getElementById('feedback').className = 'feedback hidden';
      document.getElementById('feedback').textContent = '';
      document.getElementById('reward').textContent = '';
      document.getElementById('nextBtn').classList.remove('visible');
      document.getElementById('options').innerHTML = '<div class="loading"><span class="pokeball-spin">⚪</span> Loading...</div>';

      const img = document.getElementById('pokemonImg');
      img.src = '';
      img.className = 'pokemon-img silhouette';

      total++;
      document.getElementById('score').textContent = `Question ${total} | ✅ ${score}`;

      const ids = uniqueIds(4);
      const pokemons = await Promise.all(ids.map(fetchPokemon));
      correctPokemon = pokemons[Math.floor(Math.random() * pokemons.length)];

      img.src = correctPokemon.sprite;

      const container = document.getElementById('options');
      container.innerHTML = '';

      const shuffled = [...pokemons].sort(() => Math.random() - 0.5);
      shuffled.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.dataset.name = p.name;
        btn.innerHTML = `
          <img src="${p.sprite}" alt="${p.name}" loading="lazy" />
          <span class="poke-name">${capitalize(p.name)}</span>
        `;
        btn.onclick = () => pick(btn, p);
        container.appendChild(btn);
      });
    }

    function pick(btn, pokemon) {
      if (answered) return;
      answered = true;

      document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

      const img = document.getElementById('pokemonImg');
      img.className = 'pokemon-img revealed';

      const feedback = document.getElementById('feedback');
      const reward = document.getElementById('reward');

      if (pokemon.name === correctPokemon.name) {
        score++;
        btn.classList.add('correct');
        feedback.textContent = `Yes! It's ${capitalize(correctPokemon.name)}! 🎉`;
        feedback.className = 'feedback correct';
        reward.textContent = randomReward();
        document.getElementById('score').textContent = `Question ${total} | ✅ ${score}`;
      } else {
        btn.classList.add('wrong');
        document.querySelectorAll('.option-btn').forEach(b => {
          if (b.dataset.name === correctPokemon.name) b.classList.add('correct');
        });
        feedback.textContent = `It was ${capitalize(correctPokemon.name)}! 😢`;
        feedback.className = 'feedback wrong';
      }

      document.getElementById('nextBtn').classList.add('visible');
    }

    function randomReward() {
      const r = ['🏆', '⭐⭐⭐', '🎖️', '🌟🌟', '👑', '💫💫💫', '🥇'];
      return r[Math.floor(Math.random() * r.length)];
    }

    nextRound();
  </script>
</body>
</html>
