<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>פוקימון - מי זה?</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #f5a623 0%, #e8372b 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.3);
      display: flex;
      gap: 5px;
      padding: 6px 10px;
      z-index: 10;
      justify-content: center;
      flex-wrap: nowrap;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 4px 9px;
      border-radius: 20px;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.25);
      transition: background 0.2s;
      white-space: nowrap;
    }

    nav a:hover { background: rgba(255,255,255,0.3); }
    nav a.active { background: rgba(255,255,255,0.35); border-color: #fff; }

    h1 {
      color: #fff;
      font-size: clamp(1rem, 3.5vw, 1.4rem);
      margin: 50px 0 8px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.3);
      text-align: center;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 12px 14px 14px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 16px 50px rgba(0,0,0,0.25);
      text-align: center;
      position: relative;
    }

    .score {
      font-size: 0.82rem;
      color: #999;
      margin-bottom: 8px;
    }

    .silhouette-wrap {
      background: #1a1a2e;
      border-radius: 14px;
      padding: 8px;
      display: inline-block;
      margin-bottom: 8px;
    }

    .pokemon-img {
      height: 90px;
      width: 90px;
      object-fit: contain;
      image-rendering: pixelated;
      display: block;
      transition: filter 0.7s ease;
    }

    .pokemon-img.silhouette { filter: brightness(0); }
    .pokemon-img.revealed   { filter: none; animation: popIn 0.5s ease; }

    @keyframes popIn {
      0%   { transform: scale(0.7); opacity: 0.3; }
      60%  { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    .question {
      font-size: clamp(0.9rem, 3vw, 1.05rem);
      font-weight: 700;
      color: #444;
      margin: 4px 0 10px;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .option-btn {
      border: 3px solid #e0e0e0;
      border-radius: 12px;
      background: #fafafa;
      cursor: pointer;
      padding: 7px 5px;
      transition: transform 0.15s, border-color 0.2s, background 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .option-btn img {
      width: 55px;
      height: 55px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .option-btn .poke-name {
      font-size: 0.72rem;
      font-weight: 700;
      color: #555;
      text-transform: capitalize;
    }

    .option-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: #aaa;
      background: #f0f0f0;
    }

    .option-btn:disabled { cursor: default; }

    .option-btn.wrong {
      background: #fde8e8;
      border-color: #f44336;
      animation: shake 0.4s ease;
    }

    .option-btn.correct {
      background: #d4f8d4;
      border-color: #4caf50;
      animation: bounce 0.4s ease;
    }

    @keyframes bounce {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.08); }
      70%  { transform: scale(0.97); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%   { transform: translateX(0); }
      25%  { transform: translateX(-6px); }
      50%  { transform: translateX(6px); }
      75%  { transform: translateX(-4px); }
      100% { transform: translateX(0); }
    }

    .feedback {
      margin-top: 8px;
      font-size: 1rem;
      font-weight: 700;
      min-height: 1.4rem;
      color: #f44336;
    }

    /* Success popup overlay */
    .success-popup {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.96);
      border-radius: 20px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      z-index: 5;
      animation: fadeIn 0.3s ease;
    }

    .success-popup.show { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to   { opacity: 1; transform: scale(1); }
    }

    .success-popup img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      image-rendering: pixelated;
      animation: popIn 0.5s ease;
    }

    .success-popup .success-msg {
      font-size: 1.4rem;
      font-weight: 900;
      color: #4caf50;
    }

    .success-popup .reward-emoji {
      font-size: 2rem;
    }

    .success-popup .poke-label {
      font-size: 0.95rem;
      font-weight: 700;
      color: #555;
      text-transform: capitalize;
    }

    .next-btn {
      padding: 11px 34px;
      background: linear-gradient(135deg, #f5a623, #e8372b);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(232,55,43,0.4);
      transition: transform 0.15s;
    }

    .next-btn:hover { transform: translateY(-2px); }

    .loading {
      color: #aaa;
      font-size: 0.95rem;
      padding: 20px 0;
      grid-column: span 2;
    }

    .pokeball-spin {
      display: inline-block;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">🎨 צבעים</a>
    <a href="math.html">➕ חשבון</a>
    <a href="words.html">📖 מילים</a>
    <a href="alef-bet.html">א-ב</a>
    <a href="pokemon.html" class="active">⚡ פוקימון</a>
  </nav>

  <h1>⚡ מי הפוקימון הזה?</h1>

  <div class="card">
    <div class="score" id="score">שאלה 1 | ✅ 0</div>

    <div class="silhouette-wrap">
      <img class="pokemon-img silhouette" id="pokemonImg" src="" alt="צללית" />
    </div>

    <div class="question">התאם את הצל לפוקימון הנכון!</div>

    <div class="options" id="options">
      <div class="loading"><span class="pokeball-spin">⚪</span> טוען...</div>
    </div>

    <div class="feedback" id="feedback"></div>

    <!-- Success popup shown on correct answer -->
    <div class="success-popup" id="successPopup">
      <img id="successImg" src="" alt="" />
      <div class="success-msg">!כל הכבוד 🎉</div>
      <div class="reward-emoji" id="rewardEmoji"></div>
      <div class="poke-label" id="successLabel"></div>
      <button class="next-btn" onclick="nextRound()">הבא ←</button>
    </div>
  </div>

  <script>
    const TOTAL = 151;
    let score = 0;
    let total = 0;
    let correctPokemon = null;
    let firstTry = true;

    function randId() {
      return Math.floor(Math.random() * TOTAL) + 1;
    }

    function uniqueIds(count) {
      const ids = new Set();
      while (ids.size < count) ids.add(randId());
      return [...ids];
    }

    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function spriteUrl(id) {
      return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
    }

    async function fetchPokemon(id) {
      const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
      const data = await res.json();
      return { id, name: data.name, sprite: spriteUrl(id) };
    }

    async function nextRound() {
      firstTry = true;
      document.getElementById('feedback').textContent = '';
      document.getElementById('successPopup').classList.remove('show');
      document.getElementById('options').innerHTML = '<div class="loading"><span class="pokeball-spin">⚪</span> טוען...</div>';

      const img = document.getElementById('pokemonImg');
      img.src = '';
      img.className = 'pokemon-img silhouette';

      total++;
      document.getElementById('score').textContent = `שאלה ${total} | ✅ ${score}`;

      const ids = uniqueIds(4);
      const pokemons = await Promise.all(ids.map(fetchPokemon));
      correctPokemon = pokemons[Math.floor(Math.random() * pokemons.length)];

      img.src = correctPokemon.sprite;

      const container = document.getElementById('options');
      container.innerHTML = '';

      const shuffled = [...pokemons].sort(() => Math.random() - 0.5);
      shuffled.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.dataset.name = p.name;
        btn.innerHTML = `
          <img src="${p.sprite}" alt="${p.name}" loading="lazy" />
          <span class="poke-name">${capitalize(p.name)}</span>
        `;
        btn.onclick = () => pick(btn, p);
        container.appendChild(btn);
      });
    }

    function pick(btn, pokemon) {
      if (btn.disabled) return;

      if (pokemon.name === correctPokemon.name) {
        // Correct!
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
        btn.classList.add('correct');

        if (firstTry) score++;
        document.getElementById('score').textContent = `שאלה ${total} | ✅ ${score}`;

        // Show success popup
        document.getElementById('successImg').src = correctPokemon.sprite;
        document.getElementById('successLabel').textContent = capitalize(correctPokemon.name);
        document.getElementById('rewardEmoji').textContent = firstTry ? randomReward() : '👍';
        setTimeout(() => {
          document.getElementById('successPopup').classList.add('show');
        }, 300);

      } else {
        // Wrong — shake, disable this button, allow retry
        btn.classList.add('wrong');
        btn.disabled = true;
        firstTry = false;
        document.getElementById('feedback').textContent = '!נסה שוב 💪';
        setTimeout(() => {
          btn.classList.remove('wrong');
          document.getElementById('feedback').textContent = '';
        }, 800);
      }
    }

    function randomReward() {
      const r = ['🏆', '⭐⭐⭐', '🎖️', '🌟🌟', '👑', '💫💫💫', '🥇'];
      return r[Math.floor(Math.random() * r.length)];
    }

    nextRound();
  </script>
</body>
</html>
