<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>מרוץ מכוניות</title>
  <style>
    html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
    button { touch-action: manipulation; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --ink: #1f2937; --soft: #6b7280; --btn: #f03e3e; --btn-dark: #b02525; }

    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      position: fixed; inset: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', Tahoma, Arial, sans-serif;
      background: linear-gradient(160deg, #343a40 0%, #212529 100%);
      color: var(--ink);
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    .app {
      position: absolute; top: 44px; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 8px 4px 8px; overflow: hidden;
    }
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.25);
      display: flex; gap: 5px; padding: 6px 10px; z-index: 50;
    }
    nav a.home-link { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; font-size: 0.9rem; font-weight: 800;
      padding: 4px 16px; border-radius: 999px; background: #fff; color: #5a3fd1;
      box-shadow: 0 3px 0 rgba(0,0,0,0.18); text-decoration: none; white-space: nowrap; }
    nav a.home-link:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.18); }

    .board-wrap {
      position: relative; flex: 1 1 auto; min-height: 260px;
      width: min(calc(100vw - 8px), 760px);
      display: flex; align-items: center; justify-content: center;
    }
    canvas#game {
      display: block; border-radius: 16px; touch-action: none;
      box-shadow: 0 0 0 4px #495057, 0 10px 0 4px rgba(0,0,0,0.25), 0 18px 30px rgba(0,0,0,0.4);
    }
    .overlay {
      position: absolute; inset: 0; margin: auto;
      border-radius: 16px; background: rgba(255,255,255,0.96);
      display: flex; flex-direction: column; align-items: center; justify-content: safe center;
      text-align: center; padding: 10px; gap: 7px; overflow-y: auto; z-index: 5;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: clamp(1.15rem, 5.2vw, 1.8rem); }
    .overlay p { color: var(--soft); font-size: clamp(0.78rem, 3.3vw, 1rem); max-width: 380px; }
    .big { font-size: clamp(2.2rem, 10vw, 3.6rem); animation: hop 1.2s infinite; }
    @keyframes hop { 50% { transform: translateY(-6px) rotate(-6deg); } }
    .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
    .play-btn {
      border: none; background: var(--btn); color: #fff; font: inherit; font-size: 1.15rem; font-weight: bold;
      padding: 8px 26px; border-radius: 999px; cursor: pointer; box-shadow: 0 5px 0 var(--btn-dark);
    }
    .play-btn.alt { background: #7c5cff; box-shadow: 0 5px 0 #5a3fd1; }
    .play-btn.green { background: #2f9e44; box-shadow: 0 5px 0 #1e6e2e; }
    .play-btn.gray { background: #adb5bd; box-shadow: 0 5px 0 #868e96; }
    .play-btn:active { transform: translateY(3px); }
    .bank { font-size: 1.1rem; font-weight: bold; background: #fff3bf; border-radius: 999px; padding: 3px 14px; }
    .tabs { display: flex; gap: 6px; }
    .tabs button {
      border: 3px solid transparent; background: #f1f3f5; border-radius: 999px; padding: 4px 14px;
      font: inherit; font-weight: bold; font-size: 0.95rem; cursor: pointer; color: var(--ink);
    }
    .tabs button.on { border-color: var(--btn); background: #fff; }
    .pane.hidden { display: none; }
    .carpick { display: flex; align-items: center; gap: 8px; direction: ltr; }
    .arrow { border: none; background: #e9ecef; width: 44px; height: 44px; border-radius: 50%; font-size: 1.3rem; cursor: pointer; }
    .arrow:active { transform: scale(0.92); }
    #carPrev { width: 116px; height: 190px; }
    .car-name { font-size: 1.15rem; font-weight: bold; }
    .car-special { font-size: 0.85rem; color: var(--soft); min-height: 1.1em; }
    .dots { display: flex; gap: 5px; justify-content: center; direction: ltr; }
    .dots span { width: 8px; height: 8px; border-radius: 50%; background: #dee2e6; }
    .dots span.on { background: var(--btn); }
    .dots span.own { box-shadow: 0 0 0 2px #2f9e44; }
    .ups { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 330px; }
    .up {
      display: flex; align-items: center; gap: 8px; background: #f8f9fa; border-radius: 12px; padding: 5px 8px;
      text-align: right;
    }
    .up .ic { font-size: 1.6rem; }
    .up .txt { flex: 1; font-size: 0.8rem; line-height: 1.2; }
    .up .txt b { font-size: 0.95rem; }
    .up .lv { letter-spacing: 1px; font-size: 0.8rem; }
    .up button {
      border: none; border-radius: 10px; background: #2f9e44; color: #fff; font: inherit; font-weight: bold;
      padding: 6px 8px; min-width: 70px; cursor: pointer; box-shadow: 0 3px 0 #1e6e2e; font-size: 0.85rem;
    }
    .up button:disabled { background: #ced4da; box-shadow: 0 3px 0 #adb5bd; cursor: default; }
    .best { font-size: 0.85rem; color: #ffd43b; font-weight: bold; }
    .best:empty { display: none; }
    /* the garage: a dark showroom, little text */
    .garage { background: radial-gradient(circle at 50% 40%, #3d4454 0%, #1a1d24 75%); color: #fff; gap: 10px; }
    .g-top { display: flex; align-items: center; gap: 10px; }
    .garage h2 { font-size: clamp(1.1rem, 5vw, 1.5rem); }
    .garage .bank { background: rgba(255,212,59,0.18); color: #ffd43b; }
    .garage .tabs button { background: rgba(255,255,255,0.1); color: #fff; border-color: transparent; }
    .garage .tabs button.on { background: #fff; color: var(--ink); border-color: #fff; }
    .garage .pane { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .garage .pane.hidden { display: none; }
    .garage .arrow { background: rgba(255,255,255,0.14); color: #fff; }
    .garage #carPrev { background: transparent; }
    .garage .car-special { color: #fff; background: rgba(255,255,255,0.12); border-radius: 999px; padding: 3px 12px; font-size: 0.85rem; }
    .garage .car-special:empty { display: none; }
    .garage .dots span { background: rgba(255,255,255,0.25); }
    .garage .up { background: rgba(255,255,255,0.1); color: #fff; padding: 8px 10px; }
    .garage .up .txt b { font-size: 1rem; }
    body:not(.racing) .panel { visibility: hidden; }
    .stat { font-size: clamp(0.95rem, 4vw, 1.2rem); }

    .panel { width: min(calc(100vw - 8px), 560px); display: grid; grid-template-columns: 1fr 1.1fr 1fr; gap: 8px; flex: none; direction: ltr; }
    .panel button {
      border: none; border-radius: 16px; background: #fff; color: var(--ink); font: inherit; font-size: 0.8rem;
      height: 62px; box-shadow: 0 5px 0 rgba(0,0,0,0.35); cursor: pointer; line-height: 1.1;
    }
    .panel button b { display: block; font-size: 1.7rem; }
    .panel button:active, .panel button.down { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.35); }
    .panel #laserBtn { background: linear-gradient(180deg, #ff6b6b, #c92a2a); color: #fff; }
    .panel #laserBtn.empty { background: #868e96; }
    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
  </style>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="משחקים" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#7c5cff" />
  <script src="app.js" defer></script>
</head>
<body>
  <nav dir="rtl">
    <a class="home-link" href="index.html">🏠 כל המשחקים</a>
  </nav>

  <div class="app">
    <div class="board-wrap" id="wrap">
      <canvas id="game"></canvas>

      <!-- garage: choose a car, buy upgrades -->
      <div dir="rtl" class="overlay garage" id="garage">
        <div class="g-top"><h2>🏎️ מרוץ מכוניות</h2><div class="bank">🪙 <span id="bank">0</span></div></div>
        <div class="tabs">
          <button id="tabCars" class="on">🚗 מכוניות</button>
          <button id="tabUps">🔧 שדרוגים</button>
        </div>
        <div class="pane" id="carsPane">
          <div class="carpick">
            <button class="arrow" id="prevCar">◀</button>
            <canvas id="carPrev" width="208" height="340"></canvas>
            <button class="arrow" id="nextCar">▶</button>
          </div>
          <div class="car-name" id="carName"></div>
          <div class="car-special" id="carSpecial"></div>
          <div class="dots" id="dots"></div>
        </div>
        <div class="pane hidden" id="upsPane"><div class="ups" id="ups"></div></div>
        <div class="row">
          <button class="play-btn" id="playBtn">▶ סעו!</button>
        </div>
        <div class="best" id="bestTxt"></div>
      </div>

      <div dir="rtl" class="overlay hidden" id="overScreen">
        <div class="big" id="overIcon">💥</div>
        <h2 id="overTitle">אוי! התנגשות</h2>
        <div class="stat" id="overStats"></div>
        <p id="overText"></p>
        <div class="row">
          <button class="play-btn" id="againBtn">🔁 עוד מרוץ</button>
          <button class="play-btn alt" id="garageBtn">🔧 למוסך</button>
        </div>
      </div>

      <div dir="rtl" class="overlay hidden" id="pauseScreen">
        <div class="big">⏸️</div>
        <h2>הפסקה</h2>
        <div class="row">
          <button class="play-btn green" id="resumeBtn">▶ המשך</button>
          <button class="play-btn alt" id="pauseGarageBtn">🔧 למוסך</button>
        </div>
        <button class="play-btn gray" id="soundBtn">🔊 צליל</button>
      </div>
    </div>

    <div class="panel">
      <button id="leftBtn"><b>⬅️</b>שמאלה</button>
      <button id="laserBtn"><b>🔫</b><span id="laserTxt">לייזר</span></button>
      <button id="rightBtn"><b>➡️</b>ימינה</button>
    </div>
  </div>

  <canvas id="confetti"></canvas>

  <script>
    // ---------- World ----------
    const W = 360, H = 600, TAU = Math.PI * 2;
    const ROAD_X = 60, ROAD_W = 240, LANES = 3, LANE_W = ROAD_W / LANES;
    const laneX = i => ROAD_X + LANE_W * (i + 0.5);
    const PLAYER_Y = 480;
    const DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    const $ = id => document.getElementById(id);
    const rnd = (a, b) => a + Math.random() * (b - a);
    const pick = a => a[Math.floor(Math.random() * a.length)];

    // the cars you can drive
    const CARS = [
      { id: 'sport', name: 'ספורט אדומה', kind: 'sport', color: '#e03131', price: 0, special: '' },
      { id: 'taxi', name: 'מונית צהובה', kind: 'taxi', color: '#fcc419', price: 80, special: '❤️ לב נוסף' },
      { id: 'jeep', name: "ג'יפ שטח ירוק", kind: 'jeep', color: '#2f9e44', price: 160, special: '⛽ חוסך דלק' },
      { id: 'police', name: 'ניידת משטרה', kind: 'police', color: '#f8f9fa', price: 260, special: '🔫 +2 לייזר 🚨' },
      { id: 'race', name: 'מכונית מירוץ', kind: 'race', color: '#1971c2', price: 400, special: '🪙 מטבע כפול' },
      { id: 'future', name: 'מכונית העתיד', kind: 'future', color: '#7048e8', price: 600, special: '🧲 מגנט קבוע' }
    ];
    const UPGRADES = [
      { id: 'fuel', icon: '⛽', name: 'מיכל דלק גדול', desc: 'הדלק מחזיק יותר זמן' },
      { id: 'laser', icon: '🔫', name: 'לייזר חזק', desc: 'עוד ירייה אחת בתחילת כל מרוץ' },
      { id: 'magnet', icon: '🧲', name: 'מגנט חזק', desc: 'המגנט עובד יותר זמן' },
      { id: 'shield', icon: '🛡️', name: 'מגן', desc: 'מגן ששומר מהתנגשות אחת' }
    ];
    const UP_COST = [40, 90, 160];
    const TRAFFIC_COLORS = ['#f8f9fa', '#212529', '#868e96', '#c92a2a', '#1864ab', '#e67700', '#5c940d', '#ae3ec9', '#d6336c', '#0b7285', '#ced4da'];

    // ---------- Saved progress ----------
    function load(key, def) { try { const v = localStorage.getItem(key); return v === null ? def : JSON.parse(v); } catch { return def; } }
    function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch {} }
    let prog = load('race-progress', null);
    if (!prog || typeof prog !== 'object') prog = {};
    prog = { bank: prog.bank || 0, owned: prog.owned || ['sport'], car: prog.car || 'sport', ups: prog.ups || {}, best: prog.best || 0 };
    let soundOn = load('race-sound', true);
    const saveProg = () => save('race-progress', prog);
    const upLv = id => prog.ups[id] || 0;

    // ---------- Sound ----------
    let audio = null, engine = null;
    function ac() {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      return audio;
    }
    function tone(freq, dur = 0.1, type = 'sine', when = 0, vol = 0.12, slide = 0) {
      if (!soundOn) return;
      try {
        const a = ac(), t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
      } catch {}
    }
    function noise(dur = 0.4, vol = 0.25, freq = 800) {
      if (!soundOn) return;
      try {
        const a = ac(), n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) ** 2;
        const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
        f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
        s.buffer = buf; s.connect(f).connect(g).connect(a.destination); s.start();
      } catch {}
    }
    // a soft engine hum that rises with speed
    function engineOn() {
      if (!soundOn || engine) return;
      try {
        const a = ac(), o1 = a.createOscillator(), o2 = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
        o1.type = 'sawtooth'; o2.type = 'square'; f.type = 'lowpass'; f.frequency.value = 420; g.gain.value = 0.035;
        o1.connect(f); o2.connect(f); f.connect(g).connect(a.destination); o1.start(); o2.start();
        engine = { o1, o2, g };
      } catch {}
    }
    function engineOff() { if (!engine) return; try { engine.o1.stop(); engine.o2.stop(); } catch {} engine = null; }
    function engineSet(speed) {
      if (!engine) return;
      const t = audio.currentTime, f = 45 + speed * 0.13;
      engine.o1.frequency.setTargetAtTime(f, t, 0.1); engine.o2.frequency.setTargetAtTime(f * 0.5, t, 0.1);
    }
    const sfx = {
      coin()  { tone(1318, .06, 'square', 0, .05); tone(1760, .1, 'square', .05, .05); },
      fuel()  { [392, 523, 659].forEach((f, i) => tone(f, .1, 'triangle', i * .06, .1)); },
      power() { [523, 784, 1047, 1568].forEach((f, i) => tone(f, .08, 'triangle', i * .05, .09)); },
      lane()  { tone(220, .05, 'triangle', 0, .04); },
      laser() { tone(1800, .25, 'sawtooth', 0, .07, .15); tone(900, .2, 'square', 0, .04, .3); },
      boom()  { noise(.6, .35, 700); tone(90, .4, 'sine', 0, .2, .4); },
      crash() { noise(.5, .4, 1500); tone(140, .3, 'square', 0, .1, .5); },
      shield(){ tone(600, .3, 'sine', 0, .12, 2); },
      horn()  { tone(392, .25, 'square', 0, .06); tone(494, .25, 'square', 0, .06); },
      lose()  { [392, 330, 262].forEach((f, i) => tone(f, .25, 'triangle', i * .18, .12)); },
      record(){ [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .18, 'triangle', i * .12, .13)); }
    };
    function say(text) {
      if (!soundOn || !('speechSynthesis' in window)) return;
      try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'he-IL'; u.pitch = 1.3; u.rate = 1.05; speechSynthesis.speak(u); } catch {}
    }

    // ---------- Colors ----------
    function shade(hex, amt) {        // amt -1..1: darker..lighter
      const n = parseInt(hex.slice(1), 16);
      let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
      const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
      r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
      return `rgb(${r},${g},${b})`;
    }
    function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

    // ---------- Realistic top-down cars ----------
    // a car body outline, front pointing up; nose = how round the front corners are
    function bodyPath(c, w, h, nose, tail) {
      const hw = w / 2, hh = h / 2;
      c.beginPath();
      c.moveTo(-hw + nose, -hh);
      c.quadraticCurveTo(0, -hh - 3, hw - nose, -hh);
      c.quadraticCurveTo(hw, -hh, hw, -hh + nose * 1.6);
      c.lineTo(hw, hh - tail * 1.4);
      c.quadraticCurveTo(hw, hh, hw - tail, hh);
      c.quadraticCurveTo(0, hh + 2, -hw + tail, hh);
      c.quadraticCurveTo(-hw, hh, -hw, hh - tail * 1.4);
      c.lineTo(-hw, -hh + nose * 1.6);
      c.quadraticCurveTo(-hw, -hh, -hw + nose, -hh);
      c.closePath();
    }
    function paintBody(c, w, h, color, nose, tail) {
      const g = c.createLinearGradient(-w / 2, 0, w / 2, 0);
      g.addColorStop(0, shade(color, -0.45)); g.addColorStop(0.16, shade(color, -0.1)); g.addColorStop(0.4, shade(color, 0.28));
      g.addColorStop(0.55, color); g.addColorStop(0.85, shade(color, -0.18)); g.addColorStop(1, shade(color, -0.5));
      bodyPath(c, w, h, nose, tail); c.fillStyle = g; c.fill();
      c.lineWidth = 1; c.strokeStyle = 'rgba(0,0,0,0.45)'; c.stroke();
    }
    function glass(c, pts, light) {
      c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath();
      const ys = pts.map(p => p[1]), g = c.createLinearGradient(0, Math.min(...ys), 0, Math.max(...ys));
      g.addColorStop(0, light ? '#4a6378' : '#1b2633'); g.addColorStop(1, light ? '#20303f' : '#3c536a');
      c.fillStyle = g; c.fill();
      // sky reflection streak
      c.save(); c.clip();
      c.fillStyle = 'rgba(255,255,255,0.22)';
      const x0 = Math.min(...pts.map(p => p[0])), y0 = Math.min(...ys), y1 = Math.max(...ys);
      c.beginPath(); c.moveTo(x0 + 4, y1); c.lineTo(x0 + 12, y0); c.lineTo(x0 + 18, y0); c.lineTo(x0 + 10, y1); c.closePath(); c.fill();
      c.restore();
    }
    function wheels(c, w, h, ww = 6, wh = 14, front = 0.62, rear = 0.62, out = 1) {
      c.fillStyle = '#111';
      for (const sx of [-1, 1]) for (const fy of [-front, rear]) { rr(c, sx * (w / 2 + out) - ww / 2, fy * h / 2 - wh / 2, ww, wh, 2); c.fill(); }
    }
    function lights(c, w, h, o) {
      const hw = w / 2, hh = h / 2;
      // headlights
      for (const sx of [-1, 1]) {
        c.fillStyle = '#fff9db'; c.strokeStyle = 'rgba(0,0,0,0.4)'; c.lineWidth = 0.8;
        c.beginPath(); c.ellipse(sx * (hw - 7), -hh + 3.5, 5, 2.4, sx * 0.15, 0, TAU); c.fill(); c.stroke();
      }
      // tail lights, brighter while braking
      for (const sx of [-1, 1]) {
        if (o.brake) { c.save(); c.shadowColor = '#ff2020'; c.shadowBlur = 10; }
        c.fillStyle = o.brake ? '#ff4040' : '#b3191c';
        rr(c, sx * (hw - 6) - 5, hh - 4, 10, 3, 1.4); c.fill();
        if (o.brake) c.restore();
      }
      // blinkers
      if (o.blink && Math.floor(o.t * 6) % 2 === 0) {
        c.save(); c.shadowColor = '#ffa94d'; c.shadowBlur = 10; c.fillStyle = '#ffa94d';

    // ---------- Controls ----------

    function steerBy(dx) {

      for (const ev of evs.length ? evs : [e]) {

        touch0.last = p.x; touch0.moved += Math.abs(dx);

    const endTouch = e => {
      if (!touch0 || e.pointerId !== touch0.id) return;
      // a quick tap on your own car honks
      if (touch0.moved < 6 && state === 'play' && Math.abs(touch0.x0 - G.x) < 24 && Math.abs(touch0.y0 - PLAYER_Y) < 46) sfx.horn();
      touch0 = null;
    };
    canvas.addEventListener('pointerup', endTouch); canvas.addEventListener('pointercancel', endTouch);

    function togglePause() {
      if (state === 'play') { state = 'pause'; $('pauseScreen').classList.remove('hidden'); engineOff(); }
      else if (state === 'pause') { state = 'play'; $('pauseScreen').classList.add('hidden'); engineOn(); }
    }

    // ---------- Update ----------
    function hitBox(c, pad = 5) { return { x0: c.x - c.w / 2 + pad, x1: c.x + c.w / 2 - pad, y0: c.y - c.h / 2 + pad, y1: c.y + c.h / 2 - pad }; }
    function overlap(a, b) { return a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0; }
    function crash(c) {
      if (G.inv > 0) return;
      // bump the other car out of the way
      c.spin = (c.x < G.x ? -1 : 1) * rnd(3, 6); c.kick = c.x < G.x ? -160 : 160; c.dead = true; c.wreck = 1.2;
      for (let k = 0; k < 20; k++) { const a = rnd(-Math.PI, 0), s = rnd(80, 240); G.parts.push({ x: (G.x + c.x) / 2, y: c.y + c.h / 2, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.3, 0.6), r: rnd(1.5, 3), c: pick(['#ffe066', '#fff', '#ffa94d']) }); }

      G.hearts--; G.slow = 0.45; sfx.crash();
      for (let k = 0; k < 10; k++) G.parts.push({ x: G.x + rnd(-10, 10), y: PLAYER_Y + rnd(-20, 20), vx: rnd(-20, 20), vy: rnd(-30, 20), life: rnd(0.8, 1.4), r: rnd(5, 10), smoke: true });
      if (navigator.vibrate) try { navigator.vibrate(120); } catch {}

    }
    function gameOver(why) {
      if (G.over) return;
      G.over = true; state = 'over'; engineOff(); document.body.classList.remove('racing');
      const meters = Math.floor(G.dist / 8), record = meters > prog.best;
      if (record) prog.best = meters;
      saveProg();
      setTimeout(() => {
        $('overIcon').textContent = why === 'fuel' ? '⛽' : record ? '🏆' : '💥';
        $('overTitle').textContent = record ? 'שיא חדש!' : why === 'fuel' ? 'נגמר הדלק!' : 'אוי! התנגשות';
        $('overStats').innerHTML = `🛣️ נסעתם <b>${meters}</b> מטר<br>🪙 אספתם <b>${G.coins}</b> מטבעות`;
        $('overText').textContent = why === 'fuel' ? 'בפעם הבאה אספו ⛽ בדרך' : `🏆 שיא: ${prog.best} מטר`;
        $('overScreen').classList.remove('hidden');
        if (record) { sfx.record(); confetti(120); say('שיא חדש!'); } else sfx.lose();
      }, 900);
    }

    function update(dt) {
      time += dt;
      if (state !== 'play' && state !== 'over') return;
      const g = G;
      if (state === 'play') {
        g.t += dt;
        // speed grows with time; after a crash the car slows down for a moment
        g.slow = Math.min(1, g.slow + dt * 0.35);
        const fuelSlow = g.fuel <= 0 ? 0 : 1;
        g.speed = Math.min(820, 300 + g.t * 5.5) * g.slow * (fuelSlow ? 1 : 0.3);
        g.fuel = Math.max(0, g.fuel - g.fuelRate * dt);
        if (g.fuel <= 0) { g.emptyT = (g.emptyT || 0) + dt; if (g.emptyT > 1.5) gameOver('fuel'); }
        g.inv = Math.max(0, g.inv - dt);
        if (g.magnet < 9000) g.magnet = Math.max(0, g.magnet - dt);
        engineSet(g.speed);
      } else g.speed *= Math.pow(0.2, dt);
      const v = g.speed;
      g.dist += v * dt; g.scroll += v * dt;
      // steering: held arrows push the target, the car glides to it fast and leans into the turn
      if (g.hold && state === 'play') steerBy(g.hold * 300 * dt);
      const dx = g.tx - g.x, step = Math.sign(dx) * Math.min(Math.abs(dx), dt * 900);
      g.x += step;
      g.tilt += (Math.max(-0.2, Math.min(0.2, step / Math.max(dt, 1e-3) / 1800)) - g.tilt) * Math.min(1, dt * 14);
      g.lane = Math.max(0, Math.min(2, Math.floor((g.x - ROAD_X) / LANE_W)));
      g.hintT = Math.max(0, g.hintT - dt);

      // spawns
      if (state === 'play') {
        g.nextCar -= v * dt; if (g.nextCar <= 0) { spawnCar(); g.nextCar = rnd(150, 290) * (1 - Math.min(0.35, g.t / 400)); }
        g.nextCoins -= v * dt; if (g.nextCoins <= 0) { spawnCoins(); g.nextCoins = rnd(450, 800); }
        g.nextFuel -= dt; if (g.nextFuel <= 0) { if (spawnItem('fuel')) g.nextFuel = rnd(7, 9.5); else g.nextFuel = 0.4; }
        g.nextPower -= dt; if (g.nextPower <= 0) { if (spawnItem(pick(['laser', 'laser', 'magnet', 'shield', g.hearts < 3 ? 'heart' : 'laser']))) g.nextPower = rnd(10, 16); else g.nextPower = 0.5; }
      }
      // traffic: drives slower than us, so it comes down the screen; sometimes changes lane with a blinker
      const pl = playerLanes();
      for (const c of g.traffic) {
        c.t += dt;
        if (c.wreck) { c.wreck -= dt; c.x += c.kick * dt; c.kick *= Math.pow(0.1, dt); c.rot = (c.rot || 0) + c.spin * dt; c.y += (v - c.speed * 0.3) * dt; continue; }
        if (c.dead) continue;
        c.y += (v - c.speed) * dt;
        if (c.to === null && c.y > 20 && c.y < 300 && Math.random() < dt * 0.12) {
          const to = c.lane + pick([-1, 1]);
          if (to >= 0 && to < LANES && !pl.includes(to) && !laneBusy(to, c.y - c.h - 70, c.y + c.h + 70) && !g.traffic.some(o => o !== c && !o.dead && Math.abs(o.y - c.y) < 260)) { c.to = to; c.blink = to > c.lane ? 1 : -1; c.bt = 0; }
        }
        if (c.to !== null) {
          c.bt += dt;
          if (pl.includes(c.to) && c.bt <= 0.9 && c.y > PLAYER_Y - 300) { c.to = null; c.blink = 0; }
          else if (c.bt > 0.9) {
            const d = laneX(c.to) - c.x; c.x += Math.sign(d) * Math.min(Math.abs(d), dt * 70); c.rot = Math.sign(d) * 0.08;
            if (Math.abs(d) < 0.5) { c.lane = c.to; c.to = null; c.blink = 0; c.rot = 0; }

      }
      g.traffic = g.traffic.filter(c => c.y - c.h < H + 40 && !(c.dead && !c.wreck) && !(c.wreck !== undefined && c.wreck <= 0));
      // items
      for (const it of g.items) {

        it.y += v * dt;
        if (state !== 'play' || it.got) continue;
        if (it.k === 'coin' && g.magnet > 0) {
          const d = Math.hypot(g.x - it.x, PLAYER_Y - it.y);
          if (d < 170 + upLv('magnet') * 20) { it.x += (g.x - it.x) * Math.min(1, dt * 7); it.y += (PLAYER_Y - it.y) * Math.min(1, dt * 7); }
        }

      }
      g.items = g.items.filter(it => !it.got && it.y < H + 40);
      // scenery scrolls with the road
      for (const s of g.scenery) s.y += v * dt;
      g.scenery = g.scenery.filter(s => s.y < H + 90);
      g.sceneryAcc = (g.sceneryAcc || 0) + v * dt;
      while (g.sceneryAcc > 46) { g.sceneryAcc -= 46; addScenery(-90); }

      for (const p of g.parts) { p.life -= dt; p.x += p.vx * dt; p.y += (p.vy + (p.smoke ? v * 0.6 : v * 0.2)) * dt; if (p.smoke) { p.r += dt * 10; p.vx *= 0.98; } }

      g.beam = Math.max(0, g.beam - dt); g.shake = Math.max(0, g.shake - dt); g.flash = Math.max(0, g.flash - dt);
    }
    function collect(it) {
      const g = G; it.got = true;
      const burst = (c, n = 8) => { for (let k = 0; k < n; k++) { const a = Math.random() * TAU; g.parts.push({ x: it.x, y: it.y, vx: Math.cos(a) * 110, vy: Math.sin(a) * 110, life: 0.4, r: 2.5, c }); } };
      if (it.k === 'coin') { g.coins += g.coinMul; prog.bank += g.coinMul; sfx.coin(); burst('#ffd43b', 5); if (g.coins % 10 === 0) saveProg(); }
      else if (it.k === 'fuel') { g.fuel = Math.min(1, g.fuel + 0.5); g.emptyT = 0; sfx.fuel(); burst('#ff6b6b'); }
      else if (it.k === 'laser') { g.lasers++; updateLaserBtn(); sfx.power(); burst('#22e5ff'); }
      else if (it.k === 'magnet') { if (g.magnet < 9000) g.magnet = 7 + upLv('magnet') * 3; sfx.power(); burst('#e64980'); }
      else if (it.k === 'shield') { g.shield++; sfx.shield(); burst('#74c0fc'); }
      else if (it.k === 'heart') { g.hearts = Math.min(5, g.hearts + 1); sfx.power(); burst('#ff6b6b'); }
    }

    // ---------- Drawing ----------
    function darkness() {
      // a slow day -> sunset -> night -> sunrise cycle as you drive
      if (!G) return 0;
      const m = (G.dist / 8) % 2400;
      if (m < 900) return 0;
      if (m < 1200) return (m - 900) / 300;
      if (m < 1900) return 1;
      if (m < 2200) return 1 - (m - 1900) / 300;
      return 0;
    }
    function drawRoad(g) {
      const off = g.scroll % 300;
      // grass with mowing stripes
      ctx.fillStyle = '#69b545'; ctx.fillRect(0, 0, W, H);
      const so = g.scroll % 80;
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      for (let y = -80 + so; y < H; y += 80) { ctx.fillRect(0, y, ROAD_X - 8, 40); ctx.fillRect(ROAD_X + ROAD_W + 8, y, W, 40); }
      // sidewalk curbs
      ctx.fillStyle = '#ced4da'; ctx.fillRect(ROAD_X - 8, 0, 8, H); ctx.fillRect(ROAD_X + ROAD_W, 0, 8, H);
      ctx.fillStyle = 'rgba(0,0,0,0.12)'; for (let y = -20 + (g.scroll % 20); y < H; y += 20) { ctx.fillRect(ROAD_X - 8, y, 8, 1); ctx.fillRect(ROAD_X + ROAD_W, y, 8, 1); }
      // asphalt
      for (let y = -300 + off; y < H; y += 300) ctx.drawImage(asphalt, ROAD_X, y);
      // red-white rumble strips
      const ro = g.scroll % 28;
      for (let y = -28 + ro; y < H; y += 28) {
        ctx.fillStyle = '#e03131'; ctx.fillRect(ROAD_X, y, 5, 14); ctx.fillRect(ROAD_X + ROAD_W - 5, y, 5, 14);
        ctx.fillStyle = '#f8f9fa'; ctx.fillRect(ROAD_X, y + 14, 5, 14); ctx.fillRect(ROAD_X + ROAD_W - 5, y + 14, 5, 14);
      }
      // white edge lines and dashed lane lines
      ctx.fillStyle = '#f1f3f5'; ctx.fillRect(ROAD_X + 7, 0, 3, H); ctx.fillRect(ROAD_X + ROAD_W - 10, 0, 3, H);
      const dash = g.scroll % 60;
      for (let l = 1; l < LANES; l++) {
        const x = ROAD_X + l * LANE_W - 2;
        for (let y = -60 + dash; y < H; y += 60) { ctx.fillStyle = '#f1f3f5'; ctx.fillRect(x, y, 4, 30); }
      }
      // speed streaks when going fast
      if (g.speed > 520) {
        ctx.strokeStyle = `rgba(255,255,255,${Math.min(0.35, (g.speed - 520) / 900)})`; ctx.lineWidth = 1.5;
        for (let k = 0; k < 8; k++) { const x = ROAD_X + ((k * 97 + Math.floor(g.scroll / 40) * 31) % ROAD_W), y = (k * 151 + g.scroll * 1.5) % H; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 50); ctx.stroke(); }
      }
    }
    function drawScenery(g) {
      for (const s of g.scenery) {
        if (s.k === 'tree') {
          ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.arc(s.x + 6, s.y + 8, s.r, 0, TAU); ctx.fill();
          const gr = ctx.createRadialGradient(s.x - s.r * 0.35, s.y - s.r * 0.35, 2, s.x, s.y, s.r);
          gr.addColorStop(0, shade(s.hue, 0.35)); gr.addColorStop(1, shade(s.hue, -0.35));
          ctx.fillStyle = gr; ctx.beginPath();
          for (let k = 0; k < 7; k++) { const a = k / 7 * TAU; ctx.moveTo(s.x + Math.cos(a) * s.r * 0.55 + s.r * 0.45, s.y + Math.sin(a) * s.r * 0.55); ctx.arc(s.x + Math.cos(a) * s.r * 0.55, s.y + Math.sin(a) * s.r * 0.55, s.r * 0.45, 0, TAU); }
          ctx.arc(s.x, s.y, s.r * 0.6, 0, TAU); ctx.fill();
        } else if (s.k === 'bush') {
          ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.arc(s.x + 3, s.y + 4, s.r, 0, TAU); ctx.fill();
          ctx.fillStyle = s.hue; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.beginPath(); ctx.arc(s.x - 2, s.y - 2, s.r * 0.5, 0, TAU); ctx.fill();
        } else if (s.k === 'flower') {
          ctx.fillStyle = s.hue; for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(s.x + (k % 2) * 6 - 3, s.y + (k >> 1) * 6 - 3, 2, 0, TAU); ctx.fill(); }
        } else if (s.k === 'house') {
          const x = s.side < 0 ? -12 : W - s.w + 12, y = s.y;
          ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(x + 6, y + 7, s.w, s.h);
          // a gable roof seen from above: two slopes and a ridge
          ctx.fillStyle = s.roof; ctx.fillRect(x, y, s.w, s.h);
          ctx.fillStyle = shade(s.roof, 0.18); ctx.fillRect(x, y, s.w / 2, s.h);
          ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1;
          for (let k = 6; k < s.h; k += 6) { ctx.beginPath(); ctx.moveTo(x, y + k); ctx.lineTo(x + s.w, y + k); ctx.stroke(); }
          ctx.strokeStyle = shade(s.roof, -0.4); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + s.w / 2, y); ctx.lineTo(x + s.w / 2, y + s.h); ctx.stroke();
          ctx.fillStyle = '#868e96'; ctx.fillRect(x + s.w * 0.68, y + 6, 6, 6);  // chimney
        } else if (s.k === 'lamp') {
          const bx = s.side < 0 ? ROAD_X - 12 : ROAD_X + ROAD_W + 12, hx = s.side < 0 ? ROAD_X + 14 : ROAD_X + ROAD_W - 14;
          ctx.strokeStyle = '#495057'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(bx, s.y); ctx.lineTo(hx, s.y); ctx.stroke();
          ctx.fillStyle = '#343a40'; ctx.beginPath(); ctx.arc(bx, s.y, 4, 0, TAU); ctx.fill();
          ctx.fillStyle = darkness() > 0.3 ? '#fff3bf' : '#dee2e6'; rr(ctx, hx - 6, s.y - 3, 12, 6, 3); ctx.fill();
        }
      }
    }
    function drawItem(it) {
      const bob = Math.sin(time * 5 + it.y * 0.05) * 2;
      ctx.save(); ctx.translate(it.x, it.y + bob);
      if (it.k === 'coin') {
        const sx = Math.abs(Math.cos(time * 4 + it.y * 0.02));
        ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(3, 5, 10 * sx + 1, 10, 0, 0, TAU); ctx.fill();
        const gr = ctx.createLinearGradient(-10, -10, 10, 10); gr.addColorStop(0, '#fff3bf'); gr.addColorStop(0.5, '#fcc419'); gr.addColorStop(1, '#e67700');
        ctx.fillStyle = gr; ctx.beginPath(); ctx.ellipse(0, 0, 10 * sx + 1, 10, 0, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#d9480f'; ctx.lineWidth = 1.5; ctx.stroke();
        if (sx > 0.4) { ctx.fillStyle = '#e67700'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('₪', 0, 1); }
      } else if (it.k === 'fuel') {
        // a red jerry can
        ctx.fillStyle = 'rgba(0,0,0,0.25)'; rr(ctx, -9, -10, 22, 26, 4); ctx.fill();
        const gr = ctx.createLinearGradient(-12, 0, 12, 0); gr.addColorStop(0, '#a61e1e'); gr.addColorStop(0.4, '#ff6b6b'); gr.addColorStop(1, '#a61e1e');
        rr(ctx, -12, -13, 24, 27, 4); ctx.fillStyle = gr; ctx.fill(); ctx.strokeStyle = '#701414'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-7, -6); ctx.lineTo(7, 9); ctx.moveTo(7, -6); ctx.lineTo(-7, 9); ctx.stroke();
        ctx.fillStyle = '#fab005'; ctx.fillRect(4, -17, 6, 5); ctx.fillStyle = '#343a40'; ctx.fillRect(-9, -17, 9, 4);
      } else {
        const glow = { laser: '#22e5ff', magnet: '#f06595', shield: '#74c0fc', heart: '#ff6b6b' }[it.k];
        const icon = { laser: '⚡', magnet: '🧲', shield: '🛡️', heart: '❤️' }[it.k];
        ctx.shadowColor = glow; ctx.shadowBlur = 16; ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath(); ctx.arc(0, 0, 14, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
        ctx.strokeStyle = glow; ctx.lineWidth = 3; ctx.stroke();
        ctx.font = '17px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(icon, 0, 1);
      }
      ctx.restore();
    }
    function drawVehicle(kind, color, x, y, rot, o) {
      const [w, h] = carSize(kind);
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0);
      // soft shadow under the car
      ctx.fillStyle = 'rgba(0,0,0,0.32)'; rr(ctx, -w / 2 + 4, -h / 2 + 6, w, h, 10); ctx.fill();
      drawCar(ctx, kind, color, w, h, o);
      ctx.restore();
    }
    function drawLights(g, dark) {
      // the night: darken everything except headlight beams and street lamps
      const k = canvas.width / W;
      lctx.setTransform(1, 0, 0, 1, 0, 0);
      lctx.globalCompositeOperation = 'source-over';
      lctx.clearRect(0, 0, lightCv.width, lightCv.height);
      lctx.fillStyle = `rgba(8,12,40,${0.72 * dark})`; lctx.fillRect(0, 0, lightCv.width, lightCv.height);
      lctx.setTransform(k, 0, 0, k, 0, 0);
      lctx.globalCompositeOperation = 'destination-out';
      const beam = (x, y, len, spread, strength) => {
        const gr = lctx.createRadialGradient(x, y, 4, x, y - len * 0.3, len);
        gr.addColorStop(0, `rgba(0,0,0,${strength})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
        lctx.fillStyle = gr; lctx.beginPath(); lctx.moveTo(x - 10, y); lctx.lineTo(x - spread, y - len); lctx.lineTo(x + spread, y - len); lctx.lineTo(x + 10, y); lctx.closePath(); lctx.fill();
      };
      const glowAt = (x, y, r, s) => { const gr = lctx.createRadialGradient(x, y, 1, x, y, r); gr.addColorStop(0, `rgba(0,0,0,${s})`); gr.addColorStop(1, 'rgba(0,0,0,0)'); lctx.fillStyle = gr; lctx.beginPath(); lctx.arc(x, y, r, 0, TAU); lctx.fill(); };
      const [pw, ph] = carSize(g.car.kind);
      beam(g.x, PLAYER_Y - ph / 2, 230, 70, 0.95);
      glowAt(g.x, PLAYER_Y, 50, 0.5);
      for (const c of g.traffic) if (!c.dead || c.wreck) { beam(c.x, c.y - c.h / 2, 150, 45, 0.7); glowAt(c.x, c.y + c.h / 2, 18, 0.6); }
      for (const s of g.scenery) if (s.k === 'lamp') glowAt(s.side < 0 ? ROAD_X + 14 : ROAD_X + ROAD_W - 14, s.y, 60, 0.75);
      for (const it of g.items) glowAt(it.x, it.y, 20, 0.6);
      if (g.beam > 0) glowAt(g.x, (PLAYER_Y + g.beamTo) / 2, 120, 0.8);
      lctx.globalCompositeOperation = 'source-over';
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(lightCv, 0, 0);
      ctx.setTransform(k, 0, 0, k, 0, 0);
      // red tail lights and police lights still glow in the dark
      ctx.save(); ctx.globalAlpha = dark;
      for (const c of g.traffic) if (!c.dead) { ctx.shadowColor = '#ff2020'; ctx.shadowBlur = 12; ctx.fillStyle = 'rgba(255,60,60,0.9)'; for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(c.x + sx * (c.w / 2 - 6), c.y + c.h / 2 - 3, 2.5, 0, TAU); ctx.fill(); } }
      ctx.restore();
    }

    function render() {
      const k = canvas.width / W;
      ctx.setTransform(k, 0, 0, k, 0, 0);
      if (!G) { drawIdle(); return; }
      const g = G;
      ctx.save();
      if (g.shake > 0) ctx.translate(rnd(-4, 4) * g.shake * 2.5, rnd(-4, 4) * g.shake * 2.5);
      drawRoad(g);
      drawScenery(g);
      for (const it of g.items) drawItem(it);
      for (const c of g.traffic) if (!c.dead || c.wreck) drawVehicle(c.kind, c.color, c.x, c.y, c.rot, { t: c.t, blink: c.blink, brake: c.blink !== 0 || c.wreck });
      // laser beam
      if (g.beam > 0) {
        const [pw, ph] = carSize(g.car.kind), y0 = PLAYER_Y - ph / 2, a = g.beam / 0.3;
        ctx.save(); ctx.globalAlpha = a; ctx.shadowColor = '#ff2bd6'; ctx.shadowBlur = 20;
        ctx.strokeStyle = '#ff6bd6'; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(g.x, y0); ctx.lineTo(g.x, g.beamTo); ctx.stroke();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.restore();
      }
      // the player's car (blinks while protected after a crash)
      if (!(g.inv > 0 && Math.floor(time * 12) % 2 === 0 && g.shield === 0)) {
        drawVehicle(g.car.kind, g.car.color, g.x, PLAYER_Y, g.tilt, { t: time, brake: g.slow < 0.9 });
      }
      if (g.shield > 0 || (g.inv > 0 && g.slow >= 0.99)) {
        ctx.save(); ctx.strokeStyle = `rgba(116,192,252,${0.6 + Math.sin(time * 8) * 0.25})`; ctx.lineWidth = 3; ctx.shadowColor = '#74c0fc'; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.ellipse(g.x, PLAYER_Y, 34, 54, 0, 0, TAU); ctx.stroke(); ctx.restore();
      }
      if (g.magnet > 0) { ctx.save(); ctx.globalAlpha = 0.25 + Math.sin(time * 6) * 0.1; ctx.strokeStyle = '#f06595'; ctx.lineWidth = 2; ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.arc(g.x, PLAYER_Y, 60 + (time * 40) % 40, 0, TAU); ctx.stroke(); ctx.restore(); }
      // particles
      for (const p of g.parts) {
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5));
        if (p.smoke) { ctx.fillStyle = 'rgba(90,90,95,0.55)'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); }
        else { ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); }
      }
      ctx.globalAlpha = 1;
      const dark = darkness();
      if (dark > 0.01) drawLights(g, dark);
      if (g.flash > 0) { ctx.fillStyle = `rgba(255,240,200,${g.flash * 1.6})`; ctx.fillRect(0, 0, W, H); }
      ctx.restore();
      drawHUD(g);
      if (g.hintT > 0 && state === 'play') {
        const a = Math.min(1, g.hintT), fx = W / 2 + Math.sin(time * 4) * 50;
        ctx.globalAlpha = a; ctx.fillStyle = 'rgba(20,24,30,0.7)'; rr(ctx, 70, 300, 220, 64, 16); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 15px "Comic Sans MS", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('גררו את האצבע כדי לנהוג', W / 2, 318); ctx.font = '22px sans-serif'; ctx.fillText('👆', fx, 346);
        ctx.globalAlpha = 1;
      }
    }
    function drawHUD(g) {
      // top bar: hearts, coins, meters, pause
      ctx.fillStyle = 'rgba(20,24,30,0.72)'; rr(ctx, 6, 6, W - 12, 32, 12); ctx.fill();
      ctx.textBaseline = 'middle'; ctx.font = '15px sans-serif'; ctx.textAlign = 'left';
      let hx = 14; for (let k = 0; k < g.hearts; k++) { ctx.fillText('❤️', hx, 22); hx += 17; }
      for (let k = 0; k < g.shield; k++) { ctx.fillText('🛡️', hx, 22); hx += 17; }
      ctx.fillStyle = '#ffd43b'; ctx.font = 'bold 15px "Comic Sans MS", sans-serif';
      ctx.textAlign = 'center'; ctx.fillText(`🪙 ${g.coins}`, 190, 22);
      ctx.fillStyle = '#fff'; ctx.fillText(`${Math.floor(g.dist / 8)} מ'`, 270, 22);
      ctx.font = '18px sans-serif'; ctx.fillText('⏸️', W - 24, 22);
      // fuel gauge
      ctx.fillStyle = 'rgba(20,24,30,0.72)'; rr(ctx, 6, 42, 120, 18, 9); ctx.fill();
      ctx.font = '12px sans-serif'; ctx.textAlign = 'left'; ctx.fillText('⛽', 11, 51);
      ctx.fillStyle = '#495057'; rr(ctx, 30, 47, 90, 8, 4); ctx.fill();
      const low = g.fuel < 0.25 && Math.floor(time * 4) % 2 === 0;
      ctx.fillStyle = g.fuel < 0.25 ? (low ? '#ff8787' : '#f03e3e') : g.fuel < 0.5 ? '#fab005' : '#40c057';
      if (g.fuel > 0.01) { rr(ctx, 30, 47, Math.max(8, 90 * g.fuel), 8, 4); ctx.fill(); }
      if (g.fuel < 0.25 && state === 'play') { ctx.fillStyle = '#fff'; ctx.font = 'bold 13px "Comic Sans MS", sans-serif'; ctx.textAlign = 'center'; ctx.fillText('דלק נגמר! אספו ⛽', W / 2, 78); }
      if (g.magnet > 0 && g.magnet < 9000) { ctx.font = '14px sans-serif'; ctx.textAlign = 'left'; ctx.fillText('🧲 ' + Math.ceil(g.magnet), 132, 51); }
      // speedometer dial
      const cx = W - 34, cy = H - 36, kmh = Math.round(g.speed / 4);
      ctx.fillStyle = 'rgba(20,24,30,0.82)'; ctx.beginPath(); ctx.arc(cx, cy, 30, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#495057'; ctx.lineWidth = 2; ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
      for (let i = 0; i <= 8; i++) { const a = Math.PI * 0.75 + i / 8 * Math.PI * 1.5; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * 22, cy + Math.sin(a) * 22); ctx.lineTo(cx + Math.cos(a) * 27, cy + Math.sin(a) * 27); ctx.stroke(); }
      const na = Math.PI * 0.75 + Math.min(1, kmh / 220) * Math.PI * 1.5;
      ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(na) * 24, cy + Math.sin(na) * 24); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, cy, 3, 0, TAU); ctx.fill();
      ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center'; ctx.fillText(kmh, cx, cy + 15); ctx.font = '7px Arial'; ctx.fillText('קמ"ש', cx, cy + 23);
    }
    // behind the garage: a quiet road with the chosen car parked
    function drawIdle() {
      const fake = { scroll: time * 40, speed: 0, car: carDef(prog.car) };
      drawRoad(fake);
      drawVehicle(fake.car.kind, fake.car.color, laneX(1), PLAYER_Y, 0, { t: time });
    }

    // ---------- Garage ----------
    let viewCar = Math.max(0, CARS.findIndex(c => c.id === prog.car));
    const pctx = $('carPrev').getContext('2d');
    function drawPreview() {
      const c = pctx, car = CARS[viewCar], [w, h] = carSize(car.kind);
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, 208, 340);
      const sp = c.createRadialGradient(104, 190, 10, 104, 190, 120);
      sp.addColorStop(0, 'rgba(255,255,255,0.22)'); sp.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = sp; c.beginPath(); c.ellipse(104, 190, 100, 130, 0, 0, TAU); c.fill();
      c.setTransform(2.6, 0, 0, 2.6, 104, 170);
      c.rotate(Math.sin(time * 1.5) * 0.06);
      c.fillStyle = 'rgba(0,0,0,0.35)'; rr(c, -w / 2 + 3, -h / 2 + 4, w, h, 10); c.fill();
      drawCar(c, car.kind, car.color, w, h, { t: time });
      if (!prog.owned.includes(car.id)) { c.setTransform(1, 0, 0, 1, 0, 0); c.font = '44px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('🔒', 104, 170); }
    }
    function buildGarage() {
      $('bank').textContent = prog.bank;
      const car = CARS[viewCar], owned = prog.owned.includes(car.id);
      $('carName').textContent = car.name;
      $('carSpecial').textContent = car.special;
      $('dots').innerHTML = CARS.map((c, i) => `<span class="${i === viewCar ? 'on' : ''} ${prog.owned.includes(c.id) ? 'own' : ''}"></span>`).join('');
      const btn = $('playBtn');
      if (owned) { btn.textContent = '▶ סעו!'; btn.className = 'play-btn'; btn.disabled = false; }
      else { btn.textContent = `🛒 קנו ב-${car.price} 🪙`; btn.className = 'play-btn ' + (prog.bank >= car.price ? 'green' : 'gray'); }
      $('ups').innerHTML = UPGRADES.map(u => {
        const lv = upLv(u.id), max = lv >= UP_COST.length, cost = UP_COST[lv];
        return `<div class="up"><div class="ic">${u.icon}</div><div class="txt"><b>${u.name}</b><div class="lv">${'🟩'.repeat(lv)}${'⬛'.repeat(UP_COST.length - lv)}</div></div>
          <button data-up="${u.id}" ${max || prog.bank < cost ? 'disabled' : ''}>${max ? 'מקסימום' : `${cost} 🪙`}</button></div>`;
      }).join('');
      document.querySelectorAll('[data-up]').forEach(b => b.addEventListener('click', () => buyUp(b.dataset.up)));
      $('bestTxt').textContent = prog.best ? `🏆 שיא: ${prog.best} מטר` : '';
    }
    function buyUp(id) {
      const lv = upLv(id), cost = UP_COST[lv];
      if (lv >= UP_COST.length || prog.bank < cost) return;
      prog.bank -= cost; prog.ups[id] = lv + 1; saveProg(); sfx.power(); buildGarage();
    }
    function showGarage() {
      state = 'garage'; G = null; engineOff(); document.body.classList.remove('racing');
      ['overScreen', 'pauseScreen'].forEach(id => $(id).classList.add('hidden'));
      $('garage').classList.remove('hidden');
      viewCar = Math.max(0, CARS.findIndex(c => c.id === prog.car));
      buildGarage(); updateLaserBtn();
    }
    $('prevCar').addEventListener('click', () => { viewCar = (viewCar + CARS.length - 1) % CARS.length; selectIfOwned(); });
    $('nextCar').addEventListener('click', () => { viewCar = (viewCar + 1) % CARS.length; selectIfOwned(); });
    function selectIfOwned() { const c = CARS[viewCar]; if (prog.owned.includes(c.id)) { prog.car = c.id; saveProg(); } tone(500, .05, 'triangle'); buildGarage(); }
    $('playBtn').addEventListener('click', () => {
      const car = CARS[viewCar];
      if (!prog.owned.includes(car.id)) {
        if (prog.bank < car.price) { tone(150, .15, 'square', 0, .06); $('carSpecial').textContent = `צריך עוד ${car.price - prog.bank} 🪙 כדי לקנות את המכונית הזאת`; return; }
        prog.bank -= car.price; prog.owned.push(car.id); prog.car = car.id; saveProg();
        sfx.record(); confetti(80); say('מכונית חדשה!'); buildGarage(); return;
      }
      prog.car = car.id; saveProg(); newRace();
    });
    $('tabCars').addEventListener('click', () => { $('tabCars').classList.add('on'); $('tabUps').classList.remove('on'); $('carsPane').classList.remove('hidden'); $('upsPane').classList.add('hidden'); });
    $('tabUps').addEventListener('click', () => { $('tabUps').classList.add('on'); $('tabCars').classList.remove('on'); $('upsPane').classList.remove('hidden'); $('carsPane').classList.add('hidden'); viewCar = Math.max(0, CARS.findIndex(c => c.id === prog.car)); buildGarage(); });
    $('againBtn').addEventListener('click', newRace);
    $('garageBtn').addEventListener('click', showGarage);
    $('resumeBtn').addEventListener('click', togglePause);
    $('pauseGarageBtn').addEventListener('click', showGarage);
    function updateSoundBtn() { $('soundBtn').textContent = soundOn ? '🔊 צליל' : '🔇 שקט'; }
    $('soundBtn').addEventListener('click', () => { soundOn = !soundOn; save('race-sound', soundOn); updateSoundBtn(); if (!soundOn) engineOff(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

    // ---------- Confetti ----------
    const cc = $('confetti'), cctx = cc.getContext('2d');
    let bits = [], confettiRunning = false;
    const COLORS = ['#ff5f6d', '#ff9a3c', '#ffd23f', '#5fd068', '#3fa9f5', '#7c5cff', '#e45bd8'];
    function sizeConfetti() { cc.width = innerWidth; cc.height = innerHeight; }
    addEventListener('resize', sizeConfetti); sizeConfetti();
    function confetti(n) {
      for (let i = 0; i < n; i++) bits.push({ x: Math.random() * cc.width, y: -20 - Math.random() * cc.height * 0.3, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3, s: 6 + Math.random() * 6, c: COLORS[i % COLORS.length] });
      if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(confettiLoop); }
    }
    function confettiLoop() {
      cctx.clearRect(0, 0, cc.width, cc.height);
      bits = bits.filter(b => b.y < cc.height + 20);
      for (const b of bits) { b.x += b.vx; b.y += b.vy; b.r += b.vr; cctx.save(); cctx.translate(b.x, b.y); cctx.rotate(b.r); cctx.fillStyle = b.c; cctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); cctx.restore(); }
      if (bits.length) requestAnimationFrame(confettiLoop); else { confettiRunning = false; cctx.clearRect(0, 0, cc.width, cc.height); }
    }

    // ---------- Main loop ----------
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      update(dt);
      render();
      if (state === 'garage') drawPreview();
      requestAnimationFrame(frame);
    }
    fit(); updateSoundBtn(); showGarage();
    requestAnimationFrame(frame);
    window.__race = { get s() { return G && { state, dist: Math.round(G.dist), speed: Math.round(G.speed), hearts: G.hearts, fuel: +G.fuel.toFixed(2), coins: G.coins, lasers: G.lasers, traffic: G.traffic.length, items: G.items.length, lane: G.lane }; }, get prog() { return prog; }, newRace, steer, fireLaser, update, G: () => G, setDist: d => { G.dist = d; } };
  </script>
  <script>
    (function () {
      let lastTouch = 0;
      document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastTouch < 350 && !e.target.closest('button, a')) e.preventDefault(); lastTouch = now; }, { passive: false });
      ['gesturestart', 'gesturechange', 'gestureend', 'dblclick'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
      document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
    })();
  </script>
</body>
</html>
