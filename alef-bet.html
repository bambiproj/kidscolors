<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>א-ב</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #e96c2f 0%, #f7c948 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: nowrap;
    }

    .tab-btn {
      padding: 10px 20px;
      border-radius: 50px;
      border: 2px solid rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
      white-space: nowrap;
    }

    .tab-btn.active, .tab-btn:hover {
      background: rgba(255,255,255,0.35);
      border-color: #fff;
    }

    @media (max-width: 500px) {
      .tabs { gap: 6px; }
      .tab-btn { padding: 8px 9px; font-size: 0.78rem; }
    }

    h1 {
      color: #fff;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      margin-bottom: 30px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
      letter-spacing: 2px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 32px 28px 28px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .score {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 18px;
    }

    .letter-display {
      font-size: clamp(5rem, 22vw, 8rem);
      font-weight: 900;
      color: #333;
      margin: 0 0 8px;
      line-height: 1;
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0%   { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1);   opacity: 1; }
    }

    .question-label {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 24px;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .option-btn {
      padding: 18px 10px;
      border: 3px solid #e0e0e0;
      border-radius: 16px;
      background: #fafafa;
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.2s, background 0.2s;
      color: #333;
      line-height: 1;
    }

    .option-btn:hover:not(:disabled) {
      transform: translateY(-3px);
      border-color: #e96c2f;
      background: #fff8f0;
    }

    .option-btn:disabled { cursor: default; }

    .option-btn.correct {
      background: #d4f8d4;
      border-color: #4caf50;
      animation: bounce 0.4s ease;
    }

    .option-btn.wrong {
      background: #fde8e8;
      border-color: #f44336;
      animation: shake 0.4s ease;
    }

    @keyframes bounce {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.12); }
      70%  { transform: scale(0.96); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%   { transform: translateX(0); }
      25%  { transform: translateX(-8px); }
      50%  { transform: translateX(8px); }
      75%  { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }

    .feedback {
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: 700;
      min-height: 2rem;
    }

    .feedback.wrong  { color: #f44336; }
    .feedback.hidden { opacity: 0; }

    .success-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.97);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .success-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .success-img {
      width: 128px;
      height: 128px;
      image-rendering: pixelated;
      animation: popInBig 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .success-emoji {
      font-size: 5rem;
      line-height: 1;
      animation: popInBig 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: none;
    }

    @keyframes popInBig {
      0%   { transform: scale(0) rotate(-10deg); }
      70%  { transform: scale(1.2) rotate(3deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .success-name { font-size: 1.1rem; font-weight: 700; color: #444; }
    .success-en   { font-size: 0.85rem; font-weight: 500; color: #aaa; margin-top: -6px; }
    .success-msg  { font-size: 1.6rem; font-weight: 900; color: #4caf50; }

    .next-btn {
      margin-top: 10px;
      padding: 14px 40px;
      background: linear-gradient(135deg, #e96c2f, #f7c948);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 16px rgba(233,108,47,0.4);
    }

    .next-btn:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <nav class="tabs">
    <a class="tab-btn" href="index.html">🎨 צבעים</a>
    <a class="tab-btn" href="math.html">➕ חשבון</a>
    <a class="tab-btn" href="words.html">📖 מילים</a>
    <a class="tab-btn active" href="alef-bet.html">א-ב</a>
      <a class="tab-btn" href="pokemon.html">⚡ פוקימון</a>
  </nav>
  <h1>א-ב-ג ללמוד אותיות!</h1>

  <div class="card">
    <div class="score" id="score">שאלה 1</div>
    <div class="letter-display" id="letterDisplay"></div>
    <div class="question-label">?מה האות הבאה</div>
    <div class="options" id="options"></div>
    <div class="feedback hidden" id="feedback"></div>

    <div class="success-overlay" id="successOverlay">
      <img class="success-img" id="successImg" src="" alt="" />
      <div class="success-emoji" id="successEmoji"></div>
      <div class="success-name" id="successName"></div>
      <div class="success-en" id="successEn"></div>
      <div class="success-msg" id="successMsg"></div>
      <button class="next-btn" onclick="nextRound()">הבא ←</button>
    </div>
  </div>

  <script>
    const ALEFBET = ['א','ב','ג','ד','ה','ו','ז','ח','ט','י','כ','ל','מ','נ','ס','ע','פ','צ','ק','ר','ש','ת'];

    const BASE = 'https://resource.pokemon-home.com/battledata/img/pokei128/icon';
    const CREATURES = [
      { num: '0001', name: 'בולבסאור',   en: 'Bulbasaur'  },
      { num: '0004', name: 'שרמנדר',     en: 'Charmander' },
      { num: '0007', name: 'סקווירטל',   en: 'Squirtle'   },
      { num: '0025', name: 'פיקאצ׳ו',    en: 'Pikachu'    },
      { num: '0035', name: 'קלפיירי',    en: 'Clefairy'   },
      { num: '0039', name: 'ג׳יגלי פאף', en: 'Jigglypuff' },
      { num: '0052', name: 'מיאות׳',     en: 'Meowth'     },
      { num: '0054', name: 'סייידאק',    en: 'Psyduck'    },
      { num: '0094', name: 'גנגאר',      en: 'Gengar'     },
      { num: '0129', name: 'מאגיקרפ',    en: 'Magikarp'   },
      { num: '0131', name: 'לפראס',      en: 'Lapras'     },
      { num: '0133', name: 'איווי',      en: 'Eevee'      },
      { num: '0143', name: 'סנורלקס',    en: 'Snorlax'    },
      { num: '0149', name: 'דרגוניט',    en: 'Dragonite'  },
      { num: '0150', name: 'מיוטו',      en: 'Mewtwo'     },
      { num: '0151', name: 'מיו',        en: 'Mew'        },
      { num: '0155', name: 'סינדאקוויל', en: 'Cyndaquil'  },
      { num: '0175', name: 'טוגפי',      en: 'Togepi'     },
      { num: '0196', name: 'אספאון',     en: 'Espeon'     },
      { num: '0197', name: 'אמברון',     en: 'Umbreon'    },
      { num: '0249', name: 'לוג׳יה',     en: 'Lugia'      },
      { num: '0250', name: 'הו-אוה',     en: 'Ho-Oh'      },
      { num: '0255', name: 'טורצ׳יק',    en: 'Torchic'    },
      { num: '0258', name: 'מאדקיפ',     en: 'Mudkip'     },
      { num: '0385', name: 'ג׳יראצ׳י',   en: 'Jirachi'    },
      { num: '0448', name: 'לוקריו',     en: 'Lucario'    },
      { num: '0658', name: 'גרנינג׳ה',   en: 'Greninja'   },
      { num: '0700', name: 'סילווייאון', en: 'Sylveon'    },
      { num: '0813', name: 'סקורבאני',   en: 'Scorbunny'  },
      { num: '0909', name: 'פואקוקו',    en: 'Fuecoco'    },
    ];
    const SUCCESS_MSGS = ['!כל הכבוד','!מדהים','!מצוין','!וואו','!נהדר','!אלוף'];

    let score = 0;
    let total = 0;
    let correctLetter = '';
    let answered = false;
    let firstTry = true;

    let audioCtx = null;
    function getCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function playSuccess() {
      const ctx = getCtx();
      [523, 659, 784].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = freq;
        const t = ctx.currentTime + i * 0.13;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.18, t + 0.04);
        gain.gain.linearRampToValueAtTime(0, t + 0.28);
        osc.start(t); osc.stop(t + 0.3);
      });
    }

    function playError() {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(280, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(180, ctx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.32);
    }

    function shuffle(arr) {
      return [...arr].sort(() => Math.random() - 0.5);
    }

    function nextRound() {
      document.getElementById('successOverlay').classList.remove('show');
      answered = false;
      firstTry = true;
      document.getElementById('feedback').className = 'feedback hidden';
      document.getElementById('feedback').textContent = '';

      const idx = Math.floor(Math.random() * (ALEFBET.length - 1));
      const shownLetter = ALEFBET[idx];
      correctLetter = ALEFBET[idx + 1];

      total++;
      document.getElementById('score').textContent = `שאלה ${total}  |  ✅ ${score}`;

      const letterEl = document.getElementById('letterDisplay');
      letterEl.textContent = shownLetter;
      letterEl.style.animation = 'none';
      void letterEl.offsetWidth;
      letterEl.style.animation = '';

      const pool = ALEFBET.filter(l => l !== shownLetter && l !== correctLetter);
      const wrongs = shuffle(pool).slice(0, 3);
      const options = shuffle([correctLetter, ...wrongs]);

      const container = document.getElementById('options');
      container.innerHTML = '';
      options.forEach(letter => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = letter;
        btn.onclick = () => pick(btn, letter);
        container.appendChild(btn);
      });
    }

    function pick(btn, letter) {
      if (answered || btn.disabled) return;

      const feedback = document.getElementById('feedback');

      if (letter === correctLetter) {
        answered = true;
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
        btn.classList.add('correct');
        score++;
        document.getElementById('score').textContent = `שאלה ${total}  |  ✅ ${score}`;
        feedback.className = 'feedback hidden';

        setTimeout(() => {
          if (firstTry) {
            const creature = CREATURES[Math.floor(Math.random() * CREATURES.length)];
            document.getElementById('successImg').src = BASE + creature.num + '_f00_s0.png';
            document.getElementById('successImg').alt = creature.en;
            document.getElementById('successImg').style.display = '';
            document.getElementById('successEmoji').style.display = 'none';
            document.getElementById('successName').textContent = creature.name;
            document.getElementById('successEn').textContent = creature.en;
            document.getElementById('successMsg').textContent = SUCCESS_MSGS[Math.floor(Math.random() * SUCCESS_MSGS.length)];
          } else {
            document.getElementById('successImg').style.display = 'none';
            document.getElementById('successEmoji').style.display = 'block';
            document.getElementById('successEmoji').textContent = '👍';
            document.getElementById('successName').textContent = '';
            document.getElementById('successEn').textContent = '';
            document.getElementById('successMsg').textContent = 'נכון!';
          }
          document.getElementById('successOverlay').classList.add('show');
          playSuccess();
        }, 350);
      } else {
        firstTry = false;
        btn.classList.add('wrong');
        btn.disabled = true;
        playError();
        feedback.textContent = '!נסה שוב 💪';
        feedback.className = 'feedback wrong';
      }
    }

    nextRound();
  </script>
</body>
</html>
