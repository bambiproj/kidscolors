<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kids Checkers</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #3b2a50;
      --soft: #8a7a9e;
      --btn: #ff6f61;
      --btn-dark: #d94c3f;
      --light: #ffffff;
      --dark: #1e1e24;
      --vh: 100vh;
      --board: clamp(260px, min(calc(100vw - 8px), calc(var(--vh) - 206px)), 900px);
    }
    @supports (height: 100dvh) { :root { --vh: 100dvh; } }
    /* wide screens: board on the left, panel on the right */
    @media (min-width: 700px) and (min-aspect-ratio: 5/4) {
      :root { --board: clamp(260px, min(calc(var(--vh) - 80px), calc(100vw - 370px)), 1000px); }
    }
    body.theme-teal  { --light: #fff1d0; --dark: #2fa58f; }
    body.theme-berry { --light: #ffe8f1; --dark: #a35fd6; }
    body.theme-sky   { --light: #e9f7ff; --dark: #3c8fd2; }

    /* the page never scrolls or bounces, so the board stays put while playing */
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      position: fixed;
      inset: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #ffd3a5 0%, #fd6585 100%);
      color: var(--ink);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    .app {
      position: absolute;
      top: 44px; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 14px 4px 8px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    @media (min-width: 700px) and (min-aspect-ratio: 5/4) {
      .app { flex-direction: row; justify-content: center; align-items: center; gap: 18px; padding-top: 10px; }
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.25);
      display: flex;
      gap: 5px;
      padding: 6px 10px;
      z-index: 50;
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      max-width: 100vw;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 20px;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.25);
      white-space: nowrap;
    }
    nav a:hover { background: rgba(255,255,255,0.3); }
    nav a.active { background: rgba(255,255,255,0.4); }

    .panel { width: var(--board); display: flex; flex-direction: column; gap: 6px; margin-top: auto; padding-bottom: 6px; } /* sits at the bottom of the screen */
    @media (min-width: 700px) and (min-aspect-ratio: 5/4) { .panel { width: 330px; margin-top: 0; } .board-wrap { margin-top: 0; } }

    /* the two players */
    .players { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .tray {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.5);
      border-radius: 10px;
      padding: 0 8px;
      height: 30px;
      font-weight: bold;
      font-size: 0.8rem;
      overflow: hidden;
      transition: box-shadow .2s, background .2s;
    }
    .tray .who { white-space: nowrap; flex: none; }
    .tray .caps { display: flex; align-items: center; flex: 1; min-width: 0; height: 16px; overflow: hidden; }
    .tray .caps svg { width: 16px; height: 16px; margin-right: -8px; flex: none; }
    .tray .lead { color: #2e9d4f; white-space: nowrap; font-size: 0.75rem; }
    .tray.turn { background: #fff; box-shadow: 0 0 0 2px #ffd23f; }
    .thinking::after { content: ''; animation: dots 1s steps(4) infinite; }
    @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

    /* coach message: small plain text, fixed height so nothing jumps */
    .coach { display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 4px; }
    .coach .face { font-size: 1.4rem; }
    .coach .face.talk { animation: hop .4s ease; }
    @keyframes hop { 50% { transform: translateY(-6px) rotate(-6deg); } }
    .bubble {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      font-size: clamp(0.72rem, 3vw, 0.88rem);
      line-height: 1.2;
      overflow: hidden;
    }
    .bubble span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .bubble.oops { color: #a63d00; }
    .bubble.yay { color: #1c6b33; }

    /* board */
    .board-wrap {
      margin-top: auto; /* shares the free space with the panel, so the board sits in the middle */
      position: relative;
      flex: none;
      width: var(--board);
      height: var(--board);
      border-radius: 16px;
      box-shadow: 0 0 0 6px #fff, 0 10px 0 6px rgba(0,0,0,0.12), 0 20px 40px rgba(0,0,0,0.25);
      overflow: hidden;
    }
    .board {
      position: absolute; inset: 0;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      touch-action: none;
    }
    .sq { position: relative; background: var(--light); }
    .sq.dk { background: var(--dark); box-shadow: inset 0 0 calc(var(--board) / 40) rgba(0,0,0,0.18); }
    .sq.last::before { content: ''; position: absolute; inset: 0; background: rgba(255, 214, 0, 0.38); }
    /* green = must/can move, blue = picked (same colors as backgammon) */
    .sq.sel::before { content: ''; position: absolute; inset: 9%; border-radius: 50%; box-shadow: 0 0 0 3px #fff, 0 0 0 7px #2962ff; }
    .sq.hover::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 0 4px rgba(255,255,255,0.9); }
    .sq.must::before {
      content: ''; position: absolute; inset: 9%;
      border-radius: 50%;
      box-shadow: 0 0 0 3px #fff, 0 0 0 7px #00c853, 0 0 16px 6px rgba(0, 200, 83, 0.6);
      animation: pulse 0.7s ease-in-out infinite alternate;
    }
    .sq.bad::after {
      content: '✋'; position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: calc(var(--board) / 14);
      background: rgba(255, 80, 80, 0.45);
      animation: fadeout 0.9s forwards;
    }
    @keyframes fadeout { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes pulse { from { opacity: 0.55; } to { opacity: 1; } }
    .dot {
      position: absolute; left: 50%; top: 50%;
      width: 34%; height: 34%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 0 4px #00c853;
      animation: breathe 1s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 1;
    }
    .dot.jump { background: rgba(255, 111, 97, 0.9); box-shadow: 0 0 0 4px #fff; }
    @keyframes breathe { from { transform: translate(-50%, -50%) scale(0.8); } to { transform: translate(-50%, -50%) scale(1.08); } }

    .pieces { position: absolute; inset: 0; pointer-events: none; }
    .pc {
      position: absolute;
      left: 0; top: 0;
      width: 12.5%; height: 12.5%;
      transition: transform 0.28s cubic-bezier(.2,.9,.3,1.25);
      will-change: transform;
    }
    .pc svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .pc.drag { transition: none; z-index: 10; }
    .pc.drag svg, .pc.picked svg { transform: scale(1.18); }
    .pc.picked svg { animation: wiggle 0.5s ease-in-out infinite alternate; }
    @keyframes wiggle { from { transform: scale(1.15) rotate(-6deg); } to { transform: scale(1.15) rotate(6deg); } }
    .pc.ready svg { animation: bob 1.4s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-5%); } }
    .pc.shake { animation: shake 0.4s; }
    @keyframes shake {
      0%, 100% { margin-left: 0; } 20% { margin-left: -5%; } 40% { margin-left: 5%; }
      60% { margin-left: -4%; } 80% { margin-left: 3%; }
    }
    .pc.poof { transition: transform .35s, opacity .35s; opacity: 0; }
    .pc.crowned svg { animation: crowned 0.7s ease; }
    @keyframes crowned { 40% { transform: scale(1.45) rotate(-10deg); } }

    /* buttons */
    .buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .buttons button {
      border: none;
      border-radius: 14px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 0.78rem;
      height: 50px;
      padding: 4px 2px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.13);
      cursor: pointer;
      line-height: 1.1;
    }
    .buttons button b { display: block; font-size: 1.35rem; }
    .buttons button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.13); }
    .buttons button:disabled { opacity: 0.45; }

    /* overlays */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: safe center;
      gap: 10px;
      padding: 12px;
      text-align: center;
      z-index: 20;
      overflow-y: auto;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: clamp(1.2rem, 5vw, 1.9rem); }
    .overlay p { color: var(--soft); font-size: clamp(0.8rem, 3.4vw, 1rem); max-width: 420px; }
    .big { display: flex; gap: 6px; justify-content: center; }
    .big svg { width: clamp(52px, 15vw, 90px); height: clamp(52px, 15vw, 90px); animation: hop 1.2s infinite; }
    .big svg + svg { animation-delay: .3s; }
    .choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; width: 100%; max-width: 420px; }
    .choice {
      border: 3px solid transparent;
      background: #fff1ea;
      border-radius: 16px;
      padding: 8px 4px;
      font: inherit;
      color: var(--ink);
      cursor: pointer;
      font-size: clamp(0.8rem, 3.3vw, 1rem);
    }
    .choice b { display: block; font-size: clamp(1.6rem, 7vw, 2.4rem); }
    .choice small { display: block; color: var(--soft); font-size: 0.75em; }
    .choice.active { border-color: var(--btn); background: #ffe1d9; }
    .play-btn {
      border: none;
      background: var(--btn);
      color: #fff;
      font: inherit;
      font-size: 1.25rem;
      font-weight: bold;
      padding: 10px 34px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--btn-dark);
    }
    .play-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--btn-dark); }
    .wins { font-size: 0.85rem; color: var(--soft); }
    @media (max-width: 560px) {
      #startScreen .big { display: none; }
      .choices { grid-template-columns: repeat(4, 1fr); gap: 5px; }
      .choice { padding: 6px 2px; }
      .play-btn { font-size: 1.1rem; padding: 8px 28px; }
    }

    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
  </style>
</head>

  <script>
    // ---------- Rules ----------
    // Board: 64 cells, index = row * 8 + col, row 0 at the top.
    // 1 = red piece (you, moves up), 2 = red king, -1 = yellow piece (moves down), -2 = yellow king.
    const RED = 1, YEL = -1;
    const DIAG = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
    const rowOf = i => i >> 3, colOf = i => i & 7;
    const isDark = i => (rowOf(i) + colOf(i)) % 2 === 1;
    const sideOf = v => Math.sign(v);

    function startBoard() {
      const b = new Array(64).fill(0);
      for (let i = 0; i < 64; i++) {
        if (!isDark(i)) continue;
        if (rowOf(i) <= 2) b[i] = YEL;
        if (rowOf(i) >= 5) b[i] = RED;
      }
      return b;
    }

    function dirsFor(v) {
      if (Math.abs(v) === 2) return DIAG;
      return v > 0 ? DIAG.slice(0, 2) : DIAG.slice(2);
    }
    const lastRow = side => side === RED ? 0 : 7;

    // every legal move for `side`; jumps are compulsory, multi-jumps are one move
    function genMoves(b, side) {
      const jumps = [];
      for (let i = 0; i < 64; i++) if (sideOf(b[i]) === side) findJumps(b, i, b[i], [i], [], jumps);
      if (jumps.length) return jumps;
      const steps = [];
      for (let i = 0; i < 64; i++) {
        if (sideOf(b[i]) !== side) continue;
        for (const [dr, dc] of dirsFor(b[i])) {
          const r = rowOf(i) + dr, c = colOf(i) + dc;
          if (r < 0 || r > 7 || c < 0 || c > 7) continue;
          const t = r * 8 + c;
          if (b[t] === 0) steps.push({ path: [i, t], caps: [], promote: Math.abs(b[i]) === 1 && r === lastRow(side) });
        }
      }
      return steps;
    }
    function findJumps(b, from, v, path, caps, out) {
      let found = false;
      for (const [dr, dc] of dirsFor(v)) {
        const r = rowOf(from) + dr * 2, c = colOf(from) + dc * 2;
        if (r < 0 || r > 7 || c < 0 || c > 7) continue;
        const mid = from + dr * 8 + dc, land = r * 8 + c;
        if (sideOf(b[mid]) !== -sideOf(v) || b[land] !== 0) continue;
        found = true;
        const nb = b.slice();
        nb[from] = 0; nb[mid] = 0; nb[land] = v;
        const promote = Math.abs(v) === 1 && r === lastRow(sideOf(v));
        if (promote) out.push({ path: [...path, land], caps: [...caps, mid], promote: true }); // crowning ends the turn
        else findJumps(nb, land, v, [...path, land], [...caps, mid], out);
      }
      if (!found && caps.length) out.push({ path, caps, promote: false });
    }

    function applyMove(b, m) {
      const nb = b.slice();
      const v = nb[m.path[0]];
      nb[m.path[0]] = 0;
      for (const c of m.caps) nb[c] = 0;
      nb[m.path[m.path.length - 1]] = m.promote ? v * 2 : v;
      return nb;
    }

    // ---------- Computer player (alpha-beta search) ----------
    function evaluate(b, side) {
      let s = 0;
      for (let i = 0; i < 64; i++) {
        const v = b[i];
        if (!v) continue;
        const r = rowOf(i), c = colOf(i);
        let val;

      if (v) oops(vsBot() ? `זה כלי של ה${LEVELS[level].he}! אתם הקבוצה ה<b>אדומה</b>. 🔴` :
                            `עכשיו תור ${turn === RED ? '🔴 האדום' : '🟡 הצהוב'}!`, i);
      else coach('קודם לחצו על אחד הכלים שלכם, ואז על נקודה! 👆');
      return 'done';
    }

    boardEl.addEventListener('pointerdown', e => {
      if (!playing || over) return;
      if (thinking) { coach(`רגע, ה${LEVELS[level].he} חושב... 🤔`); return; }
      const i = cellAt(e);
      if (i === null) return;
      const wasSelected = selected === i;
      const r = onPress(i);
      if (r === 'picked' || r === 'keep') {
        drag = { i, el: piecesEl.querySelector(`.pc[data-i="${i}"]`), moved: false, wasSelected, x: e.clientX, y: e.clientY };
        boardEl.setPointerCapture(e.pointerId);
      }
    });
    boardEl.addEventListener('pointermove', e => {
      if (!drag) return;
      if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
      drag.moved = true;
      const r = boardEl.getBoundingClientRect(), cell = r.width / 8;
      const x = (e.clientX - r.left - cell / 2) / cell * 100, y = (e.clientY - r.top - cell * 0.7) / cell * 100;
      if (drag.el) { drag.el.classList.add('drag'); drag.el.style.transform = `translate(${x}%, ${y}%)`; }
      setHover(cellAt(e));
    });
    function endDrag(e) {
      if (!drag) return;
      const d = drag;
      drag = null;
      setHover(null);
      if (d.el) d.el.classList.remove('drag');
      const i = e && cellAt(e);
      const back = () => { if (d.el && d.el.isConnected) { const p = pos(d.i); d.el.style.transform = `translate(${p.x}%, ${p.y}%)`; } };
      if (d.moved && i !== null && i !== d.i) { if (!hop(i)) back(); return; }
      back();
      if (!d.moved && d.wasSelected && partial.length < 2) { selected = null; partial = []; renderPieces(); renderMarks(); coach(turnText()); }
    }
    boardEl.addEventListener('pointerup', endDrag);
    boardEl.addEventListener('pointercancel', () => endDrag(null));

    // ---------- Buttons ----------
    function newGame() {
      board = startBoard(); view = board; turn = RED;
      legal = genMoves(board, turn);
      selected = null; partial = []; lastPath = null; history = []; quiet = 0;
      thinking = false; over = false; playing = true;
      $('startScreen').classList.add('hidden');
      $('overScreen').classList.add('hidden');
      renderAll();
      coach(vsBot() ? `אתם משחקים נגד ה${LEVELS[level].he} ${LEVELS[level].emoji}. האדום מתחיל! 👆`
                    : 'שני שחקנים! 🔴 האדום מתחיל. משחקים בתורות. 🙂');
    }
    function showStart() {
      playing = false; thinking = false; over = false;
      board = startBoard(); view = board; turn = RED; legal = genMoves(board, turn);
      selected = null; partial = []; lastPath = null; history = [];
      renderAll();
      $('overScreen').classList.add('hidden');
      $('startScreen').classList.remove('hidden');
      updateWinsText();
      coach(turnText());
    }
    $('playBtn').addEventListener('click', newGame);
    $('againBtn').addEventListener('click', showStart);
    $('newBtn').addEventListener('click', showStart);

    $('undoBtn').addEventListener('click', () => {
      if (thinking || !history.length) return;
      let h = history.pop();
      if (vsBot() && h.turn === YEL && history.length) h = history.pop(); // take back the computer's move too
      ({ board, turn, lastPath, quiet } = h);
      view = board; legal = genMoves(board, turn);
      selected = null; partial = []; over = false;
      $('overScreen').classList.add('hidden');
      renderAll();
      coach('חזרנו אחורה! ↩️ נסו מהלך אחר.', 'yay');
    });

    $('hintBtn').addEventListener('click', () => {
      if (!humanTurn() || partial.length > 1) return;
      coach('רגע, אני חושב... 🤔');
      setTimeout(() => {
        const m = think(board, turn, { depth: 6, noise: 0, random: 0, time: 800 });
        if (!m) return;
        select(m.path[0]);
        const t = m.path[1];
        cells[t].classList.add('must');
        setTimeout(() => cells[t].classList.remove('must'), 2500);
        coach(m.caps.length ? '💡 נסו את הקפיצה הזאת! לחצו על המשבצת הזוהרת. 🦘' : '💡 נסו להזיז את הכלי הזה למשבצת הזוהרת!', 'yay');
      }, 30);
    });

    $('themeBtn').addEventListener('click', () => { theme = (theme + 1) % THEMES.length; applyTheme(); save('checkers-theme', theme); sfx.pick(); });
    function applyTheme() { THEMES.forEach(t => t && document.body.classList.remove(t)); if (THEMES[theme]) document.body.classList.add(THEMES[theme]); }
    function updateSoundBtn() { $('soundBtn').innerHTML = `<b>${soundOn ? '🔊' : '🔇'}</b>צליל`; }
    $('soundBtn').addEventListener('click', () => {
      soundOn = !soundOn; save('checkers-sound', soundOn); updateSoundBtn();
      if (!soundOn && 'speechSynthesis' in window) speechSynthesis.cancel();
    });

    const choiceBtns = document.querySelectorAll('.choice');
    function markLevel() { choiceBtns.forEach(b => b.classList.toggle('active', b.dataset.level === level)); renderTrays(); }
    choiceBtns.forEach(b => b.addEventListener('click', () => { level = b.dataset.level; save('checkers-level', level); markLevel(); sfx.pick(); }));
    function updateWinsText() {
      const w = wins;
      $('winsText').textContent = (w.turtle || w.kitty || w.lion) ? `🏅 הניצחונות שלך: 🐢 ${w.turtle || 0} · 🐱 ${w.kitty || 0} · 🦁 ${w.lion || 0}` : '';
    }

    // ---------- Confetti ----------
    const cc = $('confetti'), cctx = cc.getContext('2d');
    let bits = [], confettiRunning = false;
    const COLORS = ['#ff5f6d', '#ff9a3c', '#ffd23f', '#5fd068', '#3fa9f5', '#7c5cff', '#e45bd8'];
    function sizeConfetti() { cc.width = innerWidth; cc.height = innerHeight; }
    addEventListener('resize', sizeConfetti); sizeConfetti();
    function confetti(n) {
      for (let i = 0; i < n; i++)
        bits.push({ x: Math.random() * cc.width, y: -20 - Math.random() * cc.height * 0.3, vx: (Math.random() - .5) * 2,
          vy: 2 + Math.random() * 3, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3, s: 6 + Math.random() * 6, c: COLORS[i % COLORS.length] });
      if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(confettiLoop); }
    }
    function confettiLoop() {
      cctx.clearRect(0, 0, cc.width, cc.height);
      bits = bits.filter(b => b.y < cc.height + 20);
      for (const b of bits) {
        b.x += b.vx; b.y += b.vy; b.r += b.vr;
        cctx.save(); cctx.translate(b.x, b.y); cctx.rotate(b.r); cctx.fillStyle = b.c; cctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); cctx.restore();
      }
      if (bits.length) requestAnimationFrame(confettiLoop); else { confettiRunning = false; cctx.clearRect(0, 0, cc.width, cc.height); }
    }

    // ---------- Start ----------
    legal = genMoves(board, turn);
    applyTheme();
    updateSoundBtn();
    markLevel();
    updateWinsText();
    renderAll();
    window.__checkers = { // handy for testing
      get board() { return board; }, get turn() { return turn; }, genMoves, think, BOTS, newGame,
      load(b, t = RED) { board = b.slice(); view = board; turn = t; legal = genMoves(board, turn); selected = null; partial = []; renderAll(); }
    };
  </script>
</body>
</html>
