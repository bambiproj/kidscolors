name: Build Android APK

on:
  push:
    branches:
      - claude/android-document-scanner-pdf-k65yy9
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/DocScanner-debug.apk
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocScanner-debug-apk
          path: dist/DocScanner-debug.apk
          if-no-files-found: error

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: docscanner-latest
          name: Doc Scanner (latest debug build)
          body: |
            Debug-signed APK of the Doc Scanner app.
            Download `DocScanner-debug.apk` below and install it on your device
            (enable "Install unknown apps" for your browser/file manager first).
          files: dist/DocScanner-debug.apk

      - name: Commit APK back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/DocScanner-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to commit."
          else
            git commit -m "Build: update DocScanner-debug.apk [skip ci]"
            git push origin HEAD:claude/android-document-scanner-pdf-k65yy9
          fi
