name: Build Monster Snake APK

on:
  push:
    branches:
      - claude/monster-snake-android-83pj0i
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        working-directory: monster-snake
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Rename APK
        working-directory: monster-snake
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/MonsterSnake.apk
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MonsterSnake-APK
          path: monster-snake/out/MonsterSnake.apk
          if-no-files-found: error
