<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>קופצני ופיקצ'ו</title>
  <style>
    html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
    button { touch-action: manipulation; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #3b2a50;
      --soft: #8a7a9e;
      --btn: #ff6f61;
      --btn-dark: #d94c3f;
      --vh: 100vh;
      --bw: clamp(240px, min(calc(100vw - 8px), calc(var(--vh) - 232px)), 720px);
    }
    @supports (height: 100dvh) { :root { --vh: 100dvh; } }

    /* the page never scrolls or bounces, so the game stays put while playing */
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      position: fixed;
      inset: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
      color: var(--ink);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    .app {
      position: absolute;
      top: 44px; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 8px 4px 8px;
      overflow: hidden;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.25);
      display: flex;
      gap: 5px;
      padding: 6px 10px;
      z-index: 50;
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      max-width: 100vw;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 20px;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.25);
      white-space: nowrap;
    }
    nav a:hover { background: rgba(255,255,255,0.3); }
    nav a.active { background: rgba(255,255,255,0.4); }

    .board-wrap {
      position: relative;
      width: min(calc(100vw - 8px), 760px);
      flex: 1 1 auto;
      min-height: 220px;
      border-radius: 18px;
      padding: 5px;
      background: #fff;
      box-shadow: 0 10px 0 rgba(0,0,0,0.12), 0 20px 40px rgba(0,0,0,0.25);
    }
    canvas#game { display: block; width: 100%; height: 100%; border-radius: 14px; }

    .overlay {
      position: absolute;
      inset: 5px;
      border-radius: 14px;
      background: rgba(255,255,255,0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: safe center;
      text-align: center;
      padding: 10px;
      gap: 8px;
      overflow-y: auto;
      z-index: 5;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: clamp(1.15rem, 5.2vw, 1.9rem); }
    .overlay p { color: var(--soft); font-size: clamp(0.75rem, 3.2vw, 1rem); max-width: 400px; }
    .overlay .label { font-size: 0.8rem; font-weight: bold; color: var(--soft); }
    .big { font-size: clamp(2.4rem, 11vw, 4rem); animation: hop 1.2s infinite; }
    @keyframes hop { 50% { transform: translateY(-6px) rotate(-6deg); } }
    .levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; max-width: 420px; }
    .lvl {
      border: 3px solid transparent; border-radius: 12px; padding: 4px 0;
      font: inherit; font-weight: bold; font-size: clamp(0.95rem, 4vw, 1.2rem); cursor: pointer; color: var(--ink);
    }
    .lvl small { display: block; font-size: 0.6rem; letter-spacing: -1px; font-weight: normal; }
    .lvl.meadow { background: #d7f5cf; } .lvl.sunset { background: #ffe0c7; } .lvl.night { background: #d9d5ff; } .lvl.candy { background: #ffd9ec; }
    .lvl.locked { opacity: 0.4; cursor: default; }
    .lvl.active { border-color: var(--btn); }
    .diff { display: flex; gap: 6px; }
    .diff button { border: 3px solid transparent; background: #f2eeff; border-radius: 12px; padding: 4px 12px; font: inherit; font-size: 0.85rem; cursor: pointer; color: var(--ink); }
    .diff button.active { border-color: #7c5cff; background: #e6dfff; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .play-btn {
      border: none; background: var(--btn); color: #fff; font: inherit; font-size: 1.15rem; font-weight: bold;
      padding: 8px 28px; border-radius: 999px; cursor: pointer; box-shadow: 0 5px 0 var(--btn-dark);
    }
    .play-btn.alt { background: #7c5cff; box-shadow: 0 5px 0 #5a3fd1; }
    .play-btn:active { transform: translateY(3px); }
    .stars3 { font-size: clamp(2rem, 9vw, 3rem); letter-spacing: 4px; }
    .stars3 .off { filter: grayscale(1); opacity: 0.3; }

    .panel { width: min(calc(100vw - 8px), 560px); display: flex; flex-direction: column; gap: 6px; flex: none; }
    .coach { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 4px; }
    .coach .face { font-size: 1.4rem; }
    .coach .face.talk { animation: hop .4s ease; }
    .bubble { flex: 1; font-size: clamp(0.74rem, 3.1vw, 0.9rem); line-height: 1.2; overflow: hidden; }
    .bubble span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .bubble.oops { color: #a63d00; }
    .bubble.yay { color: #1c6b33; }
    .coach .mini {
      flex: none; width: 38px; height: 38px; border: none; border-radius: 50%;
      font-size: 1.1rem; background: #fff; box-shadow: 0 3px 0 rgba(0,0,0,0.15); cursor: pointer;
    }
    .coach .mini.pause { background: #fff3c4; }

    /* walk zone: hold the left half to walk left, the right half to walk right
       (slide across to change). Tapping anywhere else on the screen jumps. */
    .move { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; height: 88px; direction: ltr; touch-action: none; }
    .move div {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      border-radius: 24px; background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,0.15);
      color: #7c5cff; font-size: 2.4rem; font-weight: bold;
      transition: transform .06s, background .06s, box-shadow .06s;
    }
    .move div small { font-size: 0.8rem; color: var(--soft); font-weight: normal; }
    .move div.on { background: #7c5cff; color: #fff; transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.2); }
    .move div.on small { color: #e6dfff; }

    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
  </style>
  <style>
    /* one big button back to the games page */
    nav a.home-link { font-family: 'Segoe UI', Tahoma, Arial, sans-serif !important; font-size: 0.9rem !important; font-weight: 800 !important;
      padding: 4px 16px !important; border-radius: 999px !important; background: #fff !important; color: #5a3fd1 !important;
      border: none !important; box-shadow: 0 3px 0 rgba(0,0,0,0.18) !important; text-decoration: none !important; white-space: nowrap; }
    nav a.home-link:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.18) !important; }
  </style>
</head>
<body>
  <nav dir="rtl">

      <div dir="rtl" class="overlay hidden" id="overScreen">

          <button class="play-btn" id="resumeBtn">▶ ממשיכים</button>
          <button class="play-btn alt" id="menuBtn3">🏠 שלבים</button>
        </div>

        <div data-dir="left">◀<small>אחורה</small></div>
        <div data-dir="right"><small>קדימה</small>▶</div>
      </div>
    </div>
  </div>

  <canvas id="confetti"></canvas>

    // 'H' heart, 'C' checkpoint, 'P' start, 'G' goal flag, 'T' tip sign
    const ROWS = 12;
    function build(W, theme, fn) {
      const g = Array.from({ length: ROWS }, () => Array(W).fill(' '));
      const api = {
        G(a, b, top = 10) { for (let x = a; x <= b; x++) for (let y = top; y < ROWS; y++) g[y][x] = '#'; },
        T(x, y, ch) { g[y][x] = ch; },
        R(a, b, y, ch) { for (let x = a; x <= b; x++) g[y][x] = ch; },
      };
      fn(api);
      return { theme, rows: g.map(r => r.join('')) };
    }

    const THEMES = {
      meadow: { sky: ['#7fe0ff', '#e6fff6'], far: '#9fe3b0', near: '#62c983', grass: '#59d17a', grassDark: '#36a85a', dirt: '#a5734c', dirtDark: '#86593a', cloud: '#ffffff', sun: '#fff3a3' },
      sunset: { sky: ['#ff8fa3', '#ffd6a5'], far: '#c7a6ff', near: '#9b7bea', grass: '#8ce99a', grassDark: '#51cf66', dirt: '#b08968', dirtDark: '#8d6e52', cloud: '#fff4f0', sun: '#fff1b8' },
      night:  { sky: ['#140f35', '#3d2a7a'], far: '#2c2468', near: '#211b55', grass: '#63e6be', grassDark: '#20c997', dirt: '#5f4b9b', dirtDark: '#48387d', cloud: '#7d6fd1', sun: '#fff8d6' },
      candy:  { sky: ['#ffb3d9', '#fff0f8'], far: '#ffc9e3', near: '#ff9ccf', grass: '#ffffff', grassDark: '#ffd1e8', dirt: '#c48bf0', dirtDark: '#a56cd6', cloud: '#ffffff', sun: '#fff6a0' }
    };
    const WORLD_NAMES = { meadow: 'יער הפטריות הקסום 🍄', sunset: 'איי השמיים 🌈', night: 'מערת הקריסטלים 💎', candy: 'ממלכת הממתקים 🏰' };

    // ---------- Constants ----------
    const TS = 32;
    // the camera always shows the full height of a level plus a little sky; its width follows the screen shape
    let VH = 13 * TS, VW = 12 * TS, TOP = VH - 12 * TS, boxW = 0, boxH = 0;
    const GRAV = 1800, RUN = 175, JUMP = -620, JUMP2 = -560, MAXFALL = 720, SPRING = -980, STOMP = -430;
    const PW = 22, PH = 28;
    const DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    const TAU = Math.PI * 2;
    const $ = id => document.getElementById(id);
    const canvas = $('game'), ctx = canvas.getContext('2d');
    function fit() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if (!w || !h || (w === boxW && h === boxH)) return;
      boxW = w; boxH = h;
      VW = Math.max(9 * TS, Math.min(24 * TS, VH * w / h));
      canvas.width = Math.round(w * DPR); canvas.height = Math.round(h * DPR);
    }

    // ---------- Storage ----------
    function load(key, def) { try { const v = localStorage.getItem(key); return v === null ? def : JSON.parse(v); } catch { return def; } }
    function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch {} }
    let progress = load('jump-progress', { unlocked: 1, stars: [] });
    let diff = load('jump-diff', 'easy'), soundOn = load('jump-sound', true);
    let chosen = Math.min(progress.unlocked, LEVELS.length) - 1;
    $('soundBtn').textContent = soundOn ? '🔊' : '🔇';

    // ---------- Sound ----------
    let audio = null;
    function tone(freq, dur = 0.1, type = 'sine', when = 0, vol = 0.12, slide = 0) {
      if (!soundOn) return;
      try {
        audio = audio || new (window.AudioContext || window.webkitAudioContext)();
        if (audio.state === 'suspended') audio.resume();
        const t = audio.currentTime + when;
        const o = audio.createOscillator(), g = audio.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur + 0.02);
      } catch {}
    }
    const sfx = {
      jump()   { tone(330, .14, 'square', 0, .06, 1.8); },
      jump2()  { tone(500, .14, 'square', 0, .06, 1.8); },
      coin()   { tone(988, .06, 'square', 0, .05); tone(1319, .12, 'square', .05, .05); },
      star()   { [784, 988, 1175, 1568].forEach((f, i) => tone(f, .12, 'triangle', i * .07, .1)); },
      stomp()  { tone(220, .12, 'triangle', 0, .15, .5); },
      bump()   { tone(160, .08, 'square', 0, .06); },
      spring() { tone(200, .3, 'sine', 0, .14, 4); },
      hurt()   { tone(400, .35, 'sawtooth', 0, .08, .4); },
      heart()  { [523, 784].forEach((f, i) => tone(f, .14, 'triangle', i * .1, .12)); },
      flag()   { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, .16, 'triangle', i * .1, .12)); },
      check()  { [659, 880].forEach((f, i) => tone(f, .12, 'triangle', i * .08, .1)); }
    };
    function say(text) {
      if (!soundOn || !('speechSynthesis' in window)) return;
      try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'he-IL'; u.pitch = 1.3; u.rate = 1.05; speechSynthesis.speak(u); } catch {}
    }

    // ---------- Level state ----------
    let L, map, W, theme, levelIdx = 0;
    let hero, enemies, platforms, coins, stars, hearts, checks, signs, goal, particles, floaters;
    let lives, coinCount, starCount, camX = 0, time = 0, state = 'menu', paused = false, respawn, finishT = 0, bumps = [];

    function loadLevel(i) {
      levelIdx = i;
      L = LEVELS[i]; theme = THEMES[L.theme];
      map = L.rows.map(r => r.split('')); W = map[0].length;
      enemies = []; platforms = []; coins = []; stars = []; hearts = []; checks = []; signs = []; particles = []; floaters = []; bumps = [];
      let tipNo = 0;
      for (let y = 0; y < map.length; y++) for (let x = 0; x < W; x++) {
        const c = map[y][x], px = x * TS, py = y * TS;
        const keep = '#B?=S^'.includes(c);
        if (!keep) map[y][x] = ' ';
        if (c === 'P') respawn = { x: px + (TS - PW) / 2, y: py + TS - PH };
        else if (c === 'o') coins.push({ x: px + TS / 2, y: py + TS / 2, got: false });
        else if (c === '*') stars.push({ x: px + TS / 2, y: py + TS / 2, got: false });
        else if (c === 'H') hearts.push({ x: px + TS / 2, y: py + TS / 2, got: false });
        else if (c === 'C') checks.push({ x: px, y: py, on: false });
        else if (c === 'T') signs.push({ x: px, y: py, tip: (TIPS[i] || [])[tipNo++] || '', seen: false });
        else if (c === 'G') goal = { x: px + TS / 2, y: py + TS };
        else if (c === 'E') enemies.push({ kind: 'slime', x: px + 3, y: py + TS - 20, w: 26, h: 20, vx: -45, vy: 0, alive: true, squash: 0 });
        else if (c === 'F') enemies.push({ kind: 'bee', x0: px, y0: py, x: px, y: py, w: 26, h: 22, t: Math.random() * 6, alive: true, dir: 1 });
        else if (c === 'M') platforms.push({ kind: 'h', x0: px, y0: py, x: px, y: py, w: 3 * TS, h: 14, range: 5 * TS, t: 0, dx: 0, dy: 0 });
        else if (c === 'V') platforms.push({ kind: 'v', x0: px, y0: py, x: px, y: py, w: 3 * TS, h: 14, range: 6 * TS, t: 0, dx: 0, dy: 0 });
      }
      lives = diff === 'easy' ? 5 : 3;
      coinCount = 0; starCount = 0; time = 0;
      spawnHero(respawn);
      camX = 0;
      state = 'play'; paused = false; finishT = 0;
      ['startScreen', 'doneScreen', 'overScreen', 'pauseScreen'].forEach(id => $(id).classList.add('hidden'));
      coach(`שלב ${i + 1} · ${WORLD_NAMES[L.theme]}. קדימה לדגל! 🚩`);
    }
    function spawnHero(p) {
      hero = { x: p.x, y: p.y, vx: 0, vy: 0, onGround: false, jumps: 1, coyote: 0, buffer: 0, face: 1, invuln: 1.2, squash: 0, run: 0, plat: null };
    }

    // ---------- Tiles ----------
    const tile = (tx, ty) => (ty < 0 || tx < 0 || tx >= W) ? (ty < 0 ? ' ' : '#') : ty >= map.length ? ' ' : map[ty][tx];
    const solid = c => c === '#' || c === 'B' || c === '?' || c === 'U' || c === '^';

    // ---------- Input ----------
    // hold and slide on the strip to walk; tap (or hold for a higher jump) anywhere else to jump
    const keys = { left: false, right: false, jump: false };
    function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch {} }
    function press(k, on) {
      if (k === 'jump' && on && !keys.jump && hero && state === 'play') { hero.buffer = 0.13; buzz(10); }
      keys[k] = on;
    }
    const moveEl = $('move');
    let moveId = null;
    function setMove(dir) {
      const was = keys.left ? 'left' : keys.right ? 'right' : null;
      keys.left = dir === 'left'; keys.right = dir === 'right';
      moveEl.querySelectorAll('[data-dir]').forEach(d => d.classList.toggle('on', d.dataset.dir === dir));
      if (dir && dir !== was) buzz(8);
    }
    const moveAt = e => { const r = moveEl.getBoundingClientRect(); setMove(e.clientX < r.left + r.width / 2 ? 'left' : 'right'); };
    function moveEnd() { moveId = null; setMove(null); }
    moveEl.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); moveId = e.pointerId; moveEl.setPointerCapture(e.pointerId); moveAt(e); });
    moveEl.addEventListener('pointermove', e => { if (e.pointerId === moveId) moveAt(e); });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => moveEl.addEventListener(t, e => { if (e.pointerId === moveId) moveEnd(); }));

    const jumpIds = new Set();
    document.addEventListener('pointerdown', e => {
      if (e.target.closest('#move, button, nav, a, .overlay:not(.hidden)')) return;
      if (state !== 'play' || paused) return;
      jumpIds.add(e.pointerId);
      press('jump', true);
      const r = canvas.getBoundingClientRect();
      if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom)
        ripples.push({ x: (e.clientX - r.left) / r.width * VW, y: (e.clientY - r.top) / r.height * VH, t: 0 });
    });
    const jumpUp = e => { if (jumpIds.delete(e.pointerId) && !jumpIds.size) press('jump', false); };
    document.addEventListener('pointerup', jumpUp);
    document.addEventListener('pointercancel', jumpUp);
    // safety net: when no finger is left on the screen, nothing can stay pressed
    function releaseAll() { jumpIds.clear(); press('jump', false); if (moveId !== null) moveEnd(); else setMove(null); }
    document.addEventListener('touchend', e => { if (!e.touches.length) releaseAll(); });
    addEventListener('blur', releaseAll);
    let ripples = [];

    const KEYMAP = { ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', ArrowUp: 'jump', w: 'jump', ' ': 'jump', z: 'jump' };
    addEventListener('keydown', e => {
      if (!KEYMAP[e.key]) { if (e.key === 'p' || e.key === 'Escape') togglePause(); return; }
      e.preventDefault(); if (e.repeat) return;
      const k = KEYMAP[e.key];
      if (k === 'jump') press('jump', true); else setMove(k);
    });
    addEventListener('keyup', e => {
      const k = KEYMAP[e.key]; if (!k) return;
      if (k === 'jump') press('jump', false); else if (keys[k]) setMove(null);
    });

    // ---------- Physics ----------
    function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
    function heroBox() { return { x: hero.x, y: hero.y, w: PW, h: PH }; }

    function moveHero(dt) {
      const h = hero;
      // walking
      const want = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      const acc = h.onGround ? 1600 : 1000;
      if (want) { h.vx += want * acc * dt; h.face = want; } else { const f = (h.onGround ? 1800 : 500) * dt; h.vx = Math.abs(h.vx) <= f ? 0 : h.vx - Math.sign(h.vx) * f; }
      h.vx = Math.max(-RUN, Math.min(RUN, h.vx));
      // jumping: a little forgiveness before landing and after leaving a ledge
      h.buffer -= dt; h.coyote -= dt;
      if (h.buffer > 0) {
        if (h.onGround || h.coyote > 0) { h.vy = JUMP; h.cut = true; h.onGround = false; h.coyote = 0; h.buffer = 0; h.squash = -0.25; sfx.jump(); dust(h.x + PW / 2, h.y + PH, 5); }
        else if (h.jumps > 0) { h.vy = JUMP2; h.cut = true; h.jumps = 0; h.buffer = 0; h.squash = -0.2; sfx.jump2(); sparkle(h.x + PW / 2, h.y + PH, '#fff', 8); }
      }
      if (h.cut && !keys.jump && h.vy < -260) h.vy = -260;    // short hop when the button is let go (not for springs)
      if (h.vy >= 0) h.cut = false;
      h.vy = Math.min(MAXFALL, h.vy + GRAV * dt);

      // ride a moving platform
      if (h.plat) { h.x += h.plat.dx; h.y += h.plat.dy; }

      // move across, then up/down, bumping into tiles
      h.x += h.vx * dt;
      collideX(h);
      const prevBottom = h.y + PH;
      h.y += h.vy * dt;
      const wasGround = h.onGround;
      h.onGround = false; h.plat = null;
      collideY(h, prevBottom);
      for (const p of platforms) {
        if (h.vy >= 0 && prevBottom <= p.y - p.dy + 2 && h.y + PH >= p.y && h.x + PW > p.x + 2 && h.x < p.x + p.w - 2) {
          h.y = p.y - PH; h.vy = 0; h.onGround = true; h.plat = p;
        }
      }
      if (h.onGround) { h.jumps = 1; h.coyote = 0.1; if (!wasGround) { h.squash = 0.3; dust(h.x + PW / 2, h.y + PH, 4); if (h.vyLand > 300) buzz(5); } }
      h.vyLand = h.vy;
      h.run += Math.abs(h.vx) * dt * 0.06;
      h.squash *= 0.85;
    }
    function collideX(b) {
      const top = Math.floor(b.y / TS), bot = Math.floor((b.y + PH - 1) / TS);
      if (b.vx > 0) {
        const tx = Math.floor((b.x + PW) / TS);
        for (let ty = top; ty <= bot; ty++) if (solid(tile(tx, ty))) { b.x = tx * TS - PW - 0.01; b.vx = 0; break; }
      } else if (b.vx < 0) {
        const tx = Math.floor(b.x / TS);
        for (let ty = top; ty <= bot; ty++) if (solid(tile(tx, ty))) { b.x = (tx + 1) * TS + 0.01; b.vx = 0; break; }
      }
      if (b.x < 0) b.x = 0;
    }
    function collideY(h, prevBottom) {
      const l = Math.floor((h.x + 1) / TS), r = Math.floor((h.x + PW - 1) / TS);
      if (h.vy > 0) {
        const ty = Math.floor((h.y + PH) / TS);
        for (let tx = l; tx <= r; tx++) {
          const c = tile(tx, ty);
          if (solid(c) || (c === '=' && prevBottom <= ty * TS + 1)) {
            h.y = ty * TS - PH; h.vy = 0; h.onGround = true;
            if (c === '^') { h.vy = SPRING; h.cut = false; h.onGround = false; h.jumps = 1; bumps.push({ x: tx, y: ty, t: 0.3, spring: true }); sfx.spring(); coach('בואינג! 🌀'); }
            break;
          }
        }
      } else if (h.vy < 0) {
        const ty = Math.floor(h.y / TS);
        for (let tx = l; tx <= r; tx++) {
          const c = tile(tx, ty);
          if (solid(c)) {
            h.y = (ty + 1) * TS; h.vy = 30;
            if (c === '?') { map[ty][tx] = 'U'; coinPop(tx, ty); }
            else sfx.bump();
            bumps.push({ x: tx, y: ty, t: 0.18 });
            break;
          }
        }
      }
    }

    function updateEnemies(dt) {
      for (const e of enemies) {
        if (!e.alive) { e.squash -= dt; continue; }
        if (e.kind === 'slime') {
          e.vy = Math.min(MAXFALL, e.vy + GRAV * dt);
          e.x += e.vx * dt;
          const front = e.vx > 0 ? e.x + e.w : e.x;
          const tx = Math.floor(front / TS), ty = Math.floor((e.y + e.h / 2) / TS), below = Math.floor((e.y + e.h + 2) / TS);
          if (solid(tile(tx, ty)) || (!solid(tile(tx, below)) && tile(tx, below) !== '=')) { e.vx = -e.vx; e.x += e.vx * dt * 2; }
          e.y += e.vy * dt;
          const by = Math.floor((e.y + e.h) / TS), bx = Math.floor((e.x + e.w / 2) / TS);
          if (solid(tile(bx, by)) || tile(bx, by) === '=') { e.y = by * TS - e.h; e.vy = 0; }
        } else {
          e.t += dt;
          e.x = e.x0 + Math.sin(e.t * 0.9) * TS * 2.5;
          e.y = e.y0 + Math.sin(e.t * 2.6) * 14;
          e.dir = Math.cos(e.t * 0.9) >= 0 ? 1 : -1;
        }
        // touching the hero
        const hb = heroBox();
        if (overlap(hb, e)) {
          if (hero.vy > 0 && hb.y + hb.h - e.y < 16) {
            e.alive = false; e.squash = 0.5; hero.vy = keys.jump ? JUMP * 0.9 : STOMP; hero.cut = false; hero.jumps = 1;
            sfx.stomp(); sparkle(e.x + e.w / 2, e.y + e.h / 2, '#ffe14d', 12); floater(e.x + e.w / 2, e.y, '+5');
            coinCount += 5; coach(pick(['בום! 💥', 'יופי של קפיצה! 🦘', 'הבסתם אותו! ⭐']), 'yay');
          } else hurt(e.x + e.w / 2 < hero.x + PW / 2 ? 1 : -1);
        }
      }
    }
    function updatePlatforms(dt) {
      for (const p of platforms) {
        p.t += dt;
        const k = (1 - Math.cos(p.t * (p.kind === 'h' ? 0.9 : 0.8))) / 2;   // smooth back-and-forth
        const nx = p.kind === 'h' ? p.x0 + k * p.range : p.x0;
        const ny = p.kind === 'v' ? p.y0 - k * p.range : p.y0;
        p.dx = nx - p.x; p.dy = ny - p.y; p.x = nx; p.y = ny;
      }
    }

    function hurt(dir) {
      if (hero.invuln > 0) return;
      lives--; sfx.hurt();
      hero.invuln = 1.6; hero.vx = dir * 260; hero.vy = -380;
      sparkle(hero.x + PW / 2, hero.y + PH / 2, '#ff4d6d', 10);
      if (lives <= 0) return gameOver();
      coach(`אאוץ'! נשארו ${lives} ❤️`, 'oops');
    }
    function fell() {
      lives--; sfx.hurt();
      if (lives <= 0) return gameOver();
      const cp = [...checks].reverse().find(c => c.on);
      spawnHero(cp ? { x: cp.x + 5, y: cp.y + TS - PH } : respawn);
      hero.invuln = 1.6;
      coach(`נפלתם לבור! 🕳️ חוזרים ${cp ? 'לנקודת השמירה' : 'להתחלה'}. נשארו ${lives} ❤️`, 'oops');
    }

    function collect() {
      const hb = heroBox(), cx = hero.x + PW / 2, cy = hero.y + PH / 2;
      const near = (o, r) => Math.abs(o.x - cx) < r + PW / 2 && Math.abs(o.y - cy) < r + PH / 2;
      for (const c of coins) if (!c.got && near(c, 8)) { c.got = true; coinCount++; sfx.coin(); sparkle(c.x, c.y, '#ffd23f', 6); }
      for (const s of stars) if (!s.got && near(s, 12)) {
        s.got = true; starCount++; sfx.star(); sparkle(s.x, s.y, '#fff27a', 20);
        coach(`כוכב גדול! ⭐ (${starCount}/3)`, 'yay'); say('כוכב!');
      }
      for (const h of hearts) if (!h.got && near(h, 10)) {
        h.got = true; lives++; sfx.heart(); sparkle(h.x, h.y, '#ff4d6d', 12); coach(`לב נוסף! ❤️ יש לכם ${lives}`, 'yay');
      }
      for (const c of checks) if (!c.on && Math.abs(c.x + TS / 2 - cx) < TS * 0.7 && Math.abs(c.y + TS / 2 - cy) < TS) {
        c.on = true; sfx.check(); sparkle(c.x + TS / 2, c.y, '#5fd068', 14); coach('נקודת שמירה! 🚩 אם תיפלו, תחזרו לכאן.', 'yay');
      }
      for (const s of signs) if (!s.seen && Math.abs(s.x + TS / 2 - cx) < TS * 1.2 && s.tip) { s.seen = true; coach(s.tip); }
      // spikes
      const l = Math.floor(hb.x / TS), r = Math.floor((hb.x + hb.w) / TS), t = Math.floor(hb.y / TS), b = Math.floor((hb.y + hb.h) / TS);
      for (let ty = t; ty <= b; ty++) for (let tx = l; tx <= r; tx++)
        if (tile(tx, ty) === 'S' && overlap(hb, { x: tx * TS + 4, y: ty * TS + 14, w: TS - 8, h: TS - 14 })) hurt(hero.vx > 0 ? -1 : 1);
      // the flag
      if (goal && cx > goal.x - 6 && state === 'play') finish();
    }

    function coinPop(tx, ty) {
      coinCount++; sfx.coin();
      particles.push({ kind: 'coin', x: tx * TS + TS / 2, y: ty * TS, vx: 0, vy: -380, life: 0.55, max: 0.55 });
    }

    // ---------- Level end ----------
    function finish() {
      state = 'finish'; finishT = 0;
      sfx.flag(); confetti(120); say('כל הכבוד!');
      const best = progress.stars[levelIdx] || 0;
      progress.stars[levelIdx] = Math.max(best, starCount);
      progress.unlocked = Math.max(progress.unlocked, Math.min(LEVELS.length, levelIdx + 2));
      save('jump-progress', progress);
      coach(`הגעתם לדגל! 🚩 ${starCount}/3 כוכבים`, 'yay');
      setTimeout(() => {
        $('doneStars').innerHTML = [0, 1, 2].map(k => `<span class="${k < starCount ? '' : 'off'}">⭐</span>`).join('');
        const last = levelIdx === LEVELS.length - 1;
        $('doneTitle').textContent = last ? '🏆 סיימתם את כל השלבים!' : `שלב ${levelIdx + 1} הושלם!`;
        $('doneText').textContent = `אספתם ${coinCount} מטבעות ו-${starCount} כוכבים. ` + (starCount < 3 ? 'אפשר לחזור ולמצוא את כל הכוכבים! 🔍' : 'מושלם! כל הכוכבים! 🌟');
        $('nextBtn').style.display = last ? 'none' : '';
        $('doneScreen').classList.remove('hidden');
        state = 'done';
      }, 1500);
    }
    function gameOver() {
      state = 'over';
      coach('נגמרו הלבבות. נסו שוב! 💪', 'oops');
      setTimeout(() => $('overScreen').classList.remove('hidden'), 700);
    }

    // ---------- Effects ----------
    function dust(x, y, n) { for (let i = 0; i < n; i++) particles.push({ x, y, vx: (Math.random() - .5) * 120, vy: -Math.random() * 60, r: 2 + Math.random() * 3, c: 'rgba(255,255,255,0.8)', life: .35, max: .35 }); }

          for (let k = 0; k < 4; k++) { const yy = py + TS - 8 - k * (4 - sq / 6); ctx.moveTo(px + 9, yy); ctx.lineTo(px + TS - 9, yy - 2); }
          ctx.stroke();
          ctx.fillStyle = '#ff4d6d'; roundRect(px + 3, py + 8 + sq, TS - 6, 8, 4); ctx.fill();
        }
      }
    }
    function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

    function drawThings() {
      // moving platforms
      for (const p of platforms) {
        const x = p.x - camX;
        ctx.fillStyle = '#a0683c'; roundRect(x, p.y, p.w, p.h, 6); ctx.fill();
        ctx.fillStyle = '#c98a55'; roundRect(x + 2, p.y + 2, p.w - 4, 5, 3); ctx.fill();
        ctx.strokeStyle = '#7a4a26'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x + 32, p.y + 2); ctx.lineTo(x + 32, p.y + p.h - 2); ctx.moveTo(x + 64, p.y + 2); ctx.lineTo(x + 64, p.y + p.h - 2); ctx.stroke();
      }
      // signs and checkpoints
      for (const s of signs) {
        const x = s.x - camX; if (x < -40 || x > VW + 40) continue;
        ctx.fillStyle = '#8b5a2b'; ctx.fillRect(x + 14, s.y + 14, 4, 18);
        ctx.fillStyle = s.seen ? '#d9b382' : '#f2c98f'; roundRect(x + 2, s.y + 2, 28, 16, 3); ctx.fill();
        ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#c0392b'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('!', x + 16, s.y + 10 + (s.seen ? 0 : Math.sin(time * 5) * 1.5));
      }
      for (const c of checks) {
        const x = c.x - camX; if (x < -40 || x > VW + 40) continue;
        ctx.fillStyle = '#ccc'; ctx.fillRect(x + 14, c.y - 6, 3, 38);
        ctx.fillStyle = c.on ? '#5fd068' : '#bbb';
        ctx.beginPath(); ctx.moveTo(x + 17, c.y - 6); ctx.lineTo(x + 32, c.y + 1 + Math.sin(time * 6) * 2); ctx.lineTo(x + 17, c.y + 8); ctx.fill();
      }
      // goal flag
      if (goal) {
        const x = goal.x - camX;
        ctx.fillStyle = '#eee'; ctx.fillRect(x - 2, goal.y - 150, 5, 150);
        ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(x + 0.5, goal.y - 152, 6, 0, TAU); ctx.fill();
        ctx.fillStyle = '#ff4d6d'; ctx.beginPath(); ctx.moveTo(x + 3, goal.y - 146);
        for (let k = 0; k <= 10; k++) ctx.lineTo(x + 3 + k * 3.6, goal.y - 146 + Math.sin(time * 6 + k * 0.6) * 3 + k * 1.2);
        for (let k = 10; k >= 0; k--) ctx.lineTo(x + 3 + k * 3.6, goal.y - 116 + Math.sin(time * 6 + k * 0.6) * 3 - k * 1.2);
        ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = '16px Arial'; ctx.textAlign = 'center'; ctx.fillText('⭐', x + 20, goal.y - 130);
        ctx.fillStyle = '#7a8599'; ctx.fillRect(x - 10, goal.y - 8, 21, 8);
      }
      // coins, stars, hearts
      for (const c of coins) {
        if (c.got) continue; const x = c.x - camX; if (x < -20 || x > VW + 20) continue;
        const s = Math.abs(Math.cos(time * 4 + c.x * 0.05));
        ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.ellipse(x, c.y, 8 * s + 1, 9, 0, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#e09a00'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(x - 1, c.y - 5, 2 * s, 10);
      }
      for (const s of stars) {
        if (s.got) continue; const x = s.x - camX; if (x < -30 || x > VW + 30) continue;
        const gr = ctx.createRadialGradient(x, s.y, 2, x, s.y, 26);
        gr.addColorStop(0, 'rgba(255,240,120,0.9)'); gr.addColorStop(1, 'rgba(255,240,120,0)');
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, s.y, 26, 0, TAU); ctx.fill();
        starShape(x, s.y + Math.sin(time * 3) * 3, 13, time * 1.5, '#ffd23f', '#e09a00');
      }
      for (const h of hearts) { if (!h.got) heartShape(h.x - camX, h.y + Math.sin(time * 4) * 3, 10, '#ff4d6d'); }
    }
    function starShape(x, y, r, rot, fill, stroke) {
      ctx.beginPath();
      for (let k = 0; k < 10; k++) { const a = rot + k * Math.PI / 5 - Math.PI / 2, rr = k % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
      ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
    }
    function heartShape(x, y, r, color) {

      ctx.bezierCurveTo(x + r * 0.7, y - r * 1.1, x + r * 1.4, y - r * 0.1, x, y + r * 0.9);
      ctx.fill();
    }

    function drawEnemies() {
      for (const e of enemies) {
        const x = e.x - camX; if (x < -40 || x > VW + 40) continue;
        if (!e.alive) {
          if (e.squash <= 0) continue;
          ctx.globalAlpha = Math.max(0, e.squash * 2);
          ctx.fillStyle = e.kind === 'slime' ? '#5fd068' : '#ffd23f';
          ctx.beginPath(); ctx.ellipse(x + e.w / 2, e.y + e.h - 3, e.w / 2 + 4, 4, 0, 0, TAU); ctx.fill();
          ctx.globalAlpha = 1; continue;
        }
        groundShadow(x + e.w / 2, e.y + e.h, e.w * 0.55);
        if (e.kind === 'slime') {
          const wob = Math.sin(time * 8 + e.x) * 2;
          const g = ctx.createRadialGradient(x + e.w * 0.35, e.y + 4, 2, x + e.w / 2, e.y + e.h, e.w);
          g.addColorStop(0, '#b6ffb0'); g.addColorStop(1, '#2fa84a');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.moveTo(x - 1, e.y + e.h); ctx.quadraticCurveTo(x - 2, e.y - wob, x + e.w / 2, e.y - 2 - wob); ctx.quadraticCurveTo(x + e.w + 2, e.y - wob, x + e.w + 1, e.y + e.h); ctx.closePath(); ctx.fill();
          ctx.strokeStyle = '#1b7a33'; ctx.lineWidth = 2; ctx.stroke();
          ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.ellipse(x + 7, e.y + 4 - wob, 4, 2.2, -0.5, 0, TAU); ctx.fill();
          const d = Math.sign(e.vx);
          for (const s of [-1, 1]) {
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + e.w / 2 + s * 5 + d * 2, e.y + 7, 4, 0, TAU); ctx.fill();
            ctx.fillStyle = '#1b1b2f'; ctx.beginPath(); ctx.arc(x + e.w / 2 + s * 5 + d * 3, e.y + 7.5, 2, 0, TAU); ctx.fill();
          }
          ctx.strokeStyle = '#1b5e20'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x + e.w / 2 + d * 2, e.y + 12, 3, 0.2, Math.PI - 0.2); ctx.stroke();
        } else {
          const cx = x + e.w / 2, cy = e.y + e.h / 2;
          ctx.save(); ctx.translate(cx, cy); ctx.scale(e.dir, 1);
          const flap = Math.sin(time * 40) * 0.5;
          ctx.fillStyle = 'rgba(220,240,255,0.85)';
          ctx.beginPath(); ctx.ellipse(-2, -11, 6, 9, -0.4 + flap, 0, TAU); ctx.ellipse(5, -11, 6, 9, 0.4 - flap, 0, TAU); ctx.fill();
          ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#a06c00'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(0, 0, 13, 10, 0, 0, TAU); ctx.stroke(); ctx.fill();
          ctx.fillStyle = '#2a1e3a'; ctx.fillRect(-4, -9, 3, 18); ctx.fillRect(3, -9, 3, 18);
          ctx.beginPath(); ctx.moveTo(-13, 0); ctx.lineTo(-18, 2); ctx.lineTo(-13, 3); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(8, -3, 3.5, 0, TAU); ctx.fill();
          ctx.fillStyle = '#2a1e3a'; ctx.beginPath(); ctx.arc(9, -3, 1.8, 0, TAU); ctx.fill();
          ctx.restore();
        }
      }
    }

    // the hero: a cheerful yellow electric mouse
    function drawHero() {
      const h = hero;
      if (h.invuln > 0 && state === 'play' && Math.floor(time * 12) % 2) return;
      const cx = h.x + PW / 2 - camX, by = h.y + PH;
      const air = !h.onGround;
      let sx = 1 + h.squash * 0.6, sy = 1 - h.squash * 0.6;
      if (air) { sx = 1 - Math.min(0.15, Math.abs(h.vy) / 4000); sy = 1 + Math.min(0.15, Math.abs(h.vy) / 4000); }
      const running = !air && Math.abs(h.vx) > 20;
      const bob = running ? Math.abs(Math.sin(h.run * 6)) * 2 : 0;
      groundShadow(cx, by, 12);
      ctx.save();
      ctx.translate(cx, by - bob);
      ctx.scale(sx * h.face, sy);
      ctx.lineJoin = 'round';
      // lightning-bolt tail
      const wag = Math.sin(time * 6) * 0.08;
      ctx.save(); ctx.rotate(wag);
      ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#b07800'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      [[-8, -9], [-14, -12], [-11, -16], [-19, -21], [-15, -24], [-24, -33], [-8, -24], [-11, -21], [-5, -15]].forEach(([x, y], k) => k ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#8d5a2b'; ctx.beginPath(); ctx.moveTo(-8, -9); ctx.lineTo(-14, -12); ctx.lineTo(-11, -14); ctx.lineTo(-6, -12); ctx.fill();
      ctx.restore();
      // feet
      const step = running ? Math.sin(h.run * 6) * 4 : 0;
      ctx.fillStyle = '#f5b800';
      ctx.beginPath(); ctx.ellipse(-4 + step, -2, 5, 3, 0, 0, TAU); ctx.ellipse(6 - step, -2, 5, 3, 0, 0, TAU); ctx.fill();
      // ears with black tips
      for (const [ex, rot] of [[-5, -0.35], [6, 0.3]]) {
        ctx.save(); ctx.translate(ex, -26); ctx.rotate(rot + (air ? -0.1 : 0));
        ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#a06c00'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.ellipse(0, -7, 3.6, 10, 0, 0, TAU); ctx.stroke(); ctx.fill();
        ctx.fillStyle = '#2a1e3a'; ctx.beginPath(); ctx.ellipse(0, -13.5, 2.6, 4, 0, 0, TAU); ctx.fill();
        ctx.restore();
      }
      // body and head
      const g = ctx.createRadialGradient(-3, -20, 2, 0, -14, 17);
      g.addColorStop(0, '#fff3a0'); g.addColorStop(1, '#ffc800');
      ctx.strokeStyle = '#a06c00'; ctx.lineWidth = 2.2;          // outline first, then the fill on top
      ctx.beginPath(); ctx.ellipse(0, -9, 10, 9, 0, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(1, -19, 12.5, 10.5, 0, 0, TAU); ctx.stroke();
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(0, -9, 10, 9, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(1, -19, 12.5, 10.5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.45)';                 // shine on the head
      ctx.beginPath(); ctx.ellipse(-4, -25, 4.5, 2.5, -0.5, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(160,100,0,0.18)';                   // shading under the head
      ctx.beginPath(); ctx.ellipse(1, -11, 9, 3, 0, 0, TAU); ctx.fill();
      // brown back stripes
      ctx.strokeStyle = '#a0662d'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-9, -12); ctx.lineTo(-5, -12); ctx.moveTo(-9, -7); ctx.lineTo(-5, -7); ctx.stroke();
      // eyes
      ctx.fillStyle = '#2a1e3a';
      ctx.beginPath(); ctx.ellipse(7, -21, 2.6, 3.1, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-1.5, -21, 2.4, 2.9, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(7.9, -22.2, 1.1, 0, TAU); ctx.arc(-0.7, -22.2, 1, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(6.4, -19.8, 0.5, 0, TAU); ctx.fill();
      // red cheeks (they spark when jumping)
      const cg = ctx.createRadialGradient(10, -16.5, 0.5, 10, -15.5, 3.2);
      cg.addColorStop(0, '#ff9a9a'); cg.addColorStop(1, '#e8343a');
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.arc(10, -15.5, 3, 0, TAU); ctx.arc(-4.5, -15.5, 2.6, 0, TAU); ctx.fill();
      if (air && Math.floor(time * 20) % 2) {
        ctx.strokeStyle = '#fff59d'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(13, -17); ctx.lineTo(16, -19); ctx.lineTo(15, -16); ctx.lineTo(18, -17); ctx.stroke();
      }
      // nose and smile
      ctx.fillStyle = '#2a1e3a'; ctx.beginPath(); ctx.arc(4, -18, 0.8, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#7a3b00'; ctx.lineWidth = 1.3;
      ctx.beginPath();
      if (air) ctx.arc(4, -14.5, 2, 0, TAU); else { ctx.arc(2.6, -16, 1.6, 0.2, Math.PI - 0.2); ctx.moveTo(6.8, -16); ctx.arc(5.2, -16, 1.6, 0.2, Math.PI - 0.2); }
      ctx.stroke();
      ctx.restore();
      ctx.lineCap = 'butt';
    }

    function drawEffects() {
      for (const p of particles) {
        const a = Math.max(0, p.life / p.max), x = p.x - camX;
        if (p.kind === 'coin') {
          ctx.globalAlpha = a; ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.ellipse(x, p.y, 7 * Math.abs(Math.cos(p.life * 20)) + 1, 8, 0, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; continue;
        }
        ctx.globalAlpha = a;
        if (p.star) starShape(x, p.y, p.r * 1.6, 0, p.c); else { ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(x, p.y, p.r, 0, TAU); ctx.fill(); }
      }
      ctx.globalAlpha = 1;
      ctx.font = 'bold 14px "Comic Sans MS", sans-serif'; ctx.textAlign = 'center';
      for (const f of floaters) { ctx.globalAlpha = Math.min(1, f.life * 2); ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.strokeText(f.text, f.x - camX, f.y); ctx.fillStyle = '#ff6f00'; ctx.fillText(f.text, f.x - camX, f.y); }
      ctx.globalAlpha = 1;
    }

    function drawRipples() {
      for (const r of ripples) {           // a ring where a finger tapped to jump
        r.t += 1 / 60;
        ctx.globalAlpha = Math.max(0, 1 - r.t * 3); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(r.x, r.y, 10 + r.t * 90, 0, TAU); ctx.stroke();
        ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(r.x, r.y, 6 + r.t * 70, 0, TAU); ctx.stroke();
      }
      ripples = ripples.filter(r => r.t < 0.34);
      ctx.globalAlpha = 1;
    }
    function drawHud() {
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      roundRect(6, 6, VW - 12, 30, 12); ctx.fill();
      const n = Math.max(lives, 0);
      for (let k = 0; k < Math.min(n, 6); k++) heartShape(22 + k * 20, 21, 8, '#ff4d6d');
      // coins
      ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(VW / 2 - 18, 21, 8, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#e09a00'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#3b2a50'; ctx.font = 'bold 16px "Comic Sans MS", sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(coinCount, VW / 2 - 6, 22);
      // stars
      for (let k = 0; k < 3; k++) starShape(VW - 70 + k * 22, 21, 9, 0, k < starCount ? '#ffd23f' : 'rgba(0,0,0,0.15)', k < starCount ? '#e09a00' : null);
      ctx.fillStyle = '#7c5cff'; ctx.font = 'bold 12px "Comic Sans MS", sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(levelIdx + 1, VW - 98, 22);
    }

    function render() {
      fit();
      const k = (canvas.width / DPR) / VW;            // screen pixels per world pixel
      ctx.setTransform(DPR * k, 0, 0, DPR * k, 0, 0);
      if (!L) loadPreview();
      ctx.save();
      ctx.translate(0, TOP);
      drawBackground();
      drawTiles();
      drawThings();
      drawEnemies();
      if (hero) drawHero();
      drawEffects();
      drawForeground();
      ctx.restore();
      drawRipples();
      // a soft dark edge around the screen
      const v = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.45, VW / 2, VH / 2, Math.max(VW, VH) * 0.75);
      v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.18)');
      ctx.fillStyle = v; ctx.fillRect(0, 0, VW, VH);
      if (state !== 'menu') drawHud();
    }
    function loadPreview() { L = LEVELS[chosen]; theme = THEMES[L.theme]; map = L.rows.map(r => r.split('')); W = map[0].length; enemies = []; platforms = []; coins = []; stars = []; hearts = []; checks = []; signs = []; particles = []; floaters = []; bumps = []; goal = null; hero = null; }

    // ---------- Coach ----------
    let msgTimer;
    function coach(text, mood = '') {
      const b = $('bubble'), f = $('coachFace');
      b.innerHTML = `<span>${text}</span>`;
      b.className = 'bubble ' + mood;
      f.textContent = mood === 'oops' ? '😵' : mood === 'yay' ? '🥳' : '⚡';
      f.classList.remove('talk'); void f.offsetWidth; f.classList.add('talk');
    }

    // ---------- Menus ----------
    function showMenu() {
      state = 'menu'; paused = false;
      ['doneScreen', 'overScreen', 'pauseScreen'].forEach(id => $(id).classList.add('hidden'));
      $('startScreen').classList.remove('hidden');
      chosen = Math.min(chosen, progress.unlocked - 1);
      buildLevelButtons(); loadPreview();
      coach('פיקה-פיקה! בחרו שלב ועזרו לי להגיע לדגל! 🚩');
    }
    function buildLevelButtons() {
      $('levels').innerHTML = LEVELS.map((lv, i) => {
        const locked = i >= progress.unlocked, s = progress.stars[i] || 0;
        return `<button class="lvl ${lv.theme} ${locked ? 'locked' : ''} ${i === chosen ? 'active' : ''}" data-i="${i}">${locked ? '🔒' : i + 1}<small>${locked ? '' : '⭐'.repeat(s) + '·'.repeat(3 - s)}</small></button>`;
      }).join('');
      document.querySelectorAll('.lvl').forEach(b => b.addEventListener('click', () => {
        const i = +b.dataset.i;
        if (i >= progress.unlocked) { coach('השלב הזה עוד נעול 🔒 סיימו את השלב הקודם כדי לפתוח אותו!', 'oops'); return; }
        chosen = i; buildLevelButtons(); loadPreview(); tone(600, .06, 'triangle');
      }));
      document.querySelectorAll('#diff button').forEach(b => b.classList.toggle('active', b.dataset.d === diff));
    }
    document.querySelectorAll('#diff button').forEach(b => b.addEventListener('click', () => { diff = b.dataset.d; save('jump-diff', diff); buildLevelButtons(); tone(520, .06, 'triangle'); }));
    $('playBtn').addEventListener('click', () => loadLevel(chosen));
    $('nextBtn').addEventListener('click', () => { chosen = Math.min(LEVELS.length - 1, levelIdx + 1); loadLevel(chosen); });
    $('retryBtn').addEventListener('click', () => loadLevel(levelIdx));
    $('againBtn').addEventListener('click', () => loadLevel(levelIdx));
    ['menuBtn1', 'menuBtn2', 'menuBtn3'].forEach(id => $(id).addEventListener('click', showMenu));
    function togglePause(force) {
      if (state !== 'play') return;
      paused = force !== undefined ? force : !paused;
      $('pauseScreen').classList.toggle('hidden', !paused);
      $('pauseBtn').textContent = paused ? '▶️' : '⏸️';
    }
    $('pauseBtn').addEventListener('click', () => togglePause());
    $('resumeBtn').addEventListener('click', () => togglePause(false));
    $('soundBtn').addEventListener('click', () => { soundOn = !soundOn; save('jump-sound', soundOn); $('soundBtn').textContent = soundOn ? '🔊' : '🔇'; if (!soundOn && 'speechSynthesis' in window) speechSynthesis.cancel(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) togglePause(true); });

    // ---------- Confetti ----------
    const cc = $('confetti'), cctx = cc.getContext('2d');
    let bits = [], confettiRunning = false;
    const COLORS = ['#ff5f6d', '#ff9a3c', '#ffd23f', '#5fd068', '#3fa9f5', '#7c5cff', '#e45bd8'];
    function sizeConfetti() { cc.width = innerWidth; cc.height = innerHeight; }
    addEventListener('resize', sizeConfetti); sizeConfetti();
    function confetti(n) {
      for (let i = 0; i < n; i++)
        bits.push({ x: Math.random() * cc.width, y: -20 - Math.random() * cc.height * 0.3, vx: (Math.random() - .5) * 2,
          vy: 2 + Math.random() * 3, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3, s: 6 + Math.random() * 6, c: COLORS[i % COLORS.length] });
      if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(confettiLoop); }
    }
    function confettiLoop() {
      cctx.clearRect(0, 0, cc.width, cc.height);
      bits = bits.filter(b => b.y < cc.height + 20);
      for (const b of bits) { b.x += b.vx; b.y += b.vy; b.r += b.vr; cctx.save(); cctx.translate(b.x, b.y); cctx.rotate(b.r); cctx.fillStyle = b.c; cctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); cctx.restore(); }
      if (bits.length) requestAnimationFrame(confettiLoop); else { confettiRunning = false; cctx.clearRect(0, 0, cc.width, cc.height); }
    }

    // ---------- Main loop (small fixed steps keep the jumping steady) ----------
    let last = performance.now(), acc = 0;
    function frame(now) {
      const dt = Math.min(0.1, (now - last) / 1000); last = now;
      if (!paused && (state === 'play' || state === 'finish')) {
        acc += dt;
        while (acc >= 1 / 120) { update(1 / 120); acc -= 1 / 120; }
      } else if (state === 'menu') { time += dt; camX = (Math.sin(time * 0.15) * 0.5 + 0.5) * (W * TS - VW) * 0.3; }
      else if (state === 'done' || state === 'over') time += dt;
      render();
      requestAnimationFrame(frame);
    }
    showMenu();
    requestAnimationFrame(frame);
    window.__jump = { get s() { return { state, x: hero && hero.x, y: hero && hero.y, lives, coins: coinCount, stars: starCount, level: levelIdx, camX }; }, press, loadLevel, LEVELS, get hero() { return hero; }, get goal() { return goal; }, get enemies() { return enemies; }, step(dt) { update(dt); }, teleport(tx, ty) { hero.x = tx * TS + 5; hero.y = ty * TS + TS - PH; hero.vy = 0; } };
  </script>
  <script>
    // stop accidental zooming when little fingers tap fast (iPhone double-tap zoom and pinch zoom)
    (function () {
      let lastTouch = 0;
      document.addEventListener('touchend', e => {
        const now = Date.now();
        if (now - lastTouch < 350) e.preventDefault();
        lastTouch = now;
      }, { passive: false });
      ['gesturestart', 'gesturechange', 'gestureend', 'dblclick'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
      document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
    })();
  </script>
</body>
