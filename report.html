<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tandem Report – Last 14 Days</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #1a1a2e;
    }

    header {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    header h1 { color: #fff; font-size: 1.3rem; font-weight: 700; letter-spacing: -0.3px; }
    header h1 span { color: #e94560; }

    #login-area { display: flex; align-items: center; gap: 1rem; }
    #user-info { color: rgba(255,255,255,0.8); font-size: 0.85rem; }

    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.5rem 1.1rem; border: none; border-radius: 8px;
      font-size: 0.85rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-fb   { background: #1877f2; color: #fff; }
    .btn-out  { background: rgba(255,255,255,0.15); color: #fff; }
    .btn-load { background: #e94560; color: #fff; }

    main { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem 4rem; }

    /* ── selectors ──────────────────────────────────── */
    #selectors {
      background: rgba(255,255,255,0.97);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    #selectors h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: #999; margin-bottom: 0.75rem; }
    .selector-row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-end; }
    .selector-row label { font-size: 0.78rem; color: #555; font-weight: 600; display: block; margin-bottom: 0.3rem; }
    .selector-row select {
      padding: 0.5rem 0.8rem; border: 1.5px solid #ddd; border-radius: 8px;
      font-size: 0.9rem; min-width: 240px; background: #fff; cursor: pointer;
    }
    .selector-row select:focus { outline: none; border-color: #e94560; }

    /* ── summary cards ──────────────────────────────── */
    #summary { display: none; margin-bottom: 2rem; }
    #summary h2, #daily-section h2 {
      color: #fff; font-size: 1rem; font-weight: 700;
      margin-bottom: 0.9rem; text-shadow: 0 1px 4px rgba(0,0,0,0.3);
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 1rem;
    }
    .card {
      background: rgba(255,255,255,0.97);
      border-radius: 14px;
      padding: 1.1rem 1.2rem;
      box-shadow: 0 4px 18px rgba(0,0,0,0.25);
      transition: transform 0.15s;
      border-top: 3px solid #e94560;
    }
    .card:hover { transform: translateY(-3px); }
    .card .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: #999; margin-bottom: 0.4rem; }
    .card .value { font-size: 1.55rem; font-weight: 800; color: #0f3460; line-height: 1; }
    .card .sub   { font-size: 0.72rem; color: #bbb; margin-top: 0.3rem; }

    /* ── daily section ──────────────────────────────── */
    #daily-section { display: none; }

    .chart-wrap {
      background: rgba(255,255,255,0.97);
      border-radius: 14px;
      padding: 1.25rem;
      box-shadow: 0 4px 18px rgba(0,0,0,0.25);
      margin-bottom: 1.5rem;
    }

    .table-wrap {
      background: rgba(255,255,255,0.97);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,0.25);
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
    thead tr { background: #f7f7fb; }
    th {
      padding: 0.75rem 1rem; text-align: right; font-size: 0.72rem;
      text-transform: uppercase; letter-spacing: 0.05em; color: #e94560; font-weight: 700;
    }
    th:first-child { text-align: left; }
    td { padding: 0.65rem 1rem; border-top: 1px solid #f0f0f0; text-align: right; }
    td:first-child { text-align: left; font-weight: 600; color: #333; }
    tbody tr:hover { background: #fdf5f7; }

    /* ── login prompt ────────────────────────────────── */
    #login-prompt {
      text-align: center; padding: 5rem 1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px; color: #fff; margin-top: 1rem;
    }
    #login-prompt h2 { font-size: 1.8rem; margin-bottom: 0.6rem; }
    #login-prompt p  { opacity: 0.6; margin-bottom: 1.8rem; font-size: 0.95rem; }

    #spinner {
      display: none; text-align: center; padding: 3rem;
      color: rgba(255,255,255,0.7); font-size: 1rem;
    }
    .spin {
      display: inline-block; width: 26px; height: 26px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #e94560; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-right: 0.6rem; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #error-msg {
      display: none; background: #fff0f0; border: 1px solid #f5c6cb;
      color: #721c24; border-radius: 10px; padding: 0.9rem 1.2rem;
      margin-bottom: 1rem; font-size: 0.88rem;
    }
  </style>
</head>
<body>

<script>
  const META_APP_ID = '1775776353390485';
  const DEFAULT_ACCOUNT_ID = 'act_891924867203358'; // Tandem2026
  const DEFAULT_CAMPAIGN_ID = '';
</script>

<header>
  <h1>Tandem <span>Report</span></h1>
  <div id="login-area">
    <span id="user-info"></span>
    <button id="btn-login"  class="btn btn-fb"  onclick="fbLogin()">Login with Facebook</button>
    <button id="btn-logout" class="btn btn-out" onclick="fbLogout()" style="display:none">Logout</button>
  </div>
</header>

<main>
  <div id="login-prompt">
    <h2>Meta Campaign Report</h2>
    <p>Last 14 days — spend, events, and cost per day</p>
    <button class="btn btn-fb" onclick="fbLogin()">Login with Facebook</button>
  </div>

  <div id="spinner"><span class="spin"></span>Loading data…</div>
  <div id="error-msg"></div>

  <div id="selectors">
    <h2>Select Campaign</h2>
    <div class="selector-row">
      <div>
        <label for="sel-account">Ad Account</label>
        <select id="sel-account" onchange="onAccountChange()"><option>Loading…</option></select>
      </div>
      <div>
        <label for="sel-campaign">Campaign</label>
        <select id="sel-campaign"><option>Select account first</option></select>
      </div>
      <div style="padding-bottom:1px">
        <button class="btn btn-load" onclick="loadReport()">Load Report</button>
      </div>
    </div>
  </div>

  <div id="summary">
    <h2>14-Day Summary</h2>
    <div class="cards" id="cards"></div>
  </div>

  <div id="daily-section">
    <h2>Day-by-Day Breakdown</h2>
    <div class="chart-wrap">
      <canvas id="daily-chart" height="90"></canvas>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Spend ($)</th>
            <th>Impressions</th>
            <th>Clicks</th>
            <th>Reach</th>
            <th>CTR</th>
            <th>CPC ($)</th>
            <th>CPM ($)</th>
            <th>Actions</th>
            <th>Cost / Action ($)</th>
          </tr>
        </thead>
        <tbody id="daily-body"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
  window.fbAsyncInit = function () {
    FB.init({ appId: META_APP_ID, cookie: true, xfbml: false, version: 'v19.0' });
    FB.getLoginStatus(statusChangeCallback);
  };
  (function (d, s, id) {
    if (d.getElementById(id)) return;
    const js = d.createElement(s); js.id = id;
    js.src = 'https://connect.facebook.net/en_US/sdk.js';
    d.getElementsByTagName('head')[0].appendChild(js);
  }(document, 'script', 'facebook-jssdk'));
</script>

<script>
  let accessToken = null;
  let chartInstance = null;

  function statusChangeCallback(resp) {
    if (resp.status === 'connected') {
      accessToken = resp.authResponse.accessToken;
      onLoggedIn();
    } else {
      onLoggedOut();
    }
  }

  function fbLogin() {
    FB.login(statusChangeCallback, { scope: 'ads_read' });
  }

  function fbLogout() {
    FB.logout(() => { accessToken = null; onLoggedOut(); });
  }

  function onLoggedIn() {
    FB.api('/me', { fields: 'name' }, (me) => {
      document.getElementById('user-info').textContent = `👤 ${me.name}`;
    });
    document.getElementById('btn-login').style.display  = 'none';
    document.getElementById('btn-logout').style.display = '';
    document.getElementById('login-prompt').style.display = 'none';
    fetchAccounts();
  }

  function onLoggedOut() {
    accessToken = null;
    document.getElementById('btn-login').style.display  = '';
    document.getElementById('btn-logout').style.display = 'none';
    document.getElementById('user-info').textContent    = '';
    document.getElementById('login-prompt').style.display = '';
    hide('selectors'); hide('summary'); hide('daily-section');
  }

  async function graphGet(path, params = {}) {
    const url = new URL(`https://graph.facebook.com/v19.0${path}`);
    url.searchParams.set('access_token', accessToken);
    Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
    const r = await fetch(url);
    const j = await r.json();
    if (j.error) throw new Error(j.error.message);
    return j;
  }

  async function fetchAccounts() {
    console.log('fetchAccounts called');
    showSpinner();
    try {
      const data = await graphGet('/me/adaccounts', { fields: 'id,name,account_id', limit: 50 });
      const sel = document.getElementById('sel-account');
      sel.innerHTML = '';
      data.data.forEach(acc => {
        const o = document.createElement('option');
        o.value = acc.id;
        o.textContent = `${acc.name} (${acc.account_id})`;
        if (acc.id === DEFAULT_ACCOUNT_ID) o.selected = true;
        sel.appendChild(o);
      });
      console.log('Accounts loaded:', data.data.length, 'showing selectors');
      show('selectors');
      const selectedAccount = sel.value || data.data[0].id;
      await fetchCampaigns(selectedAccount);
    } catch (e) {
      showError(e.message);
    } finally {
      hideSpinner();
    }
  }

  async function onAccountChange() {
    await fetchCampaigns(document.getElementById('sel-account').value);
  }

  async function fetchCampaigns(accountId) {
    const sel = document.getElementById('sel-campaign');
    sel.innerHTML = '<option>Loading…</option>';
    try {
      const data = await graphGet(`/${accountId}/campaigns`, { fields: 'id,name,status', limit: 100 });
      sel.innerHTML = '';
      data.data.forEach(c => {
        const o = document.createElement('option');
        o.value = c.id;
        o.textContent = `${c.name} [${c.status}]`;
        if (DEFAULT_CAMPAIGN_ID && c.id === DEFAULT_CAMPAIGN_ID) o.selected = true;
        sel.appendChild(o);
      });
    } catch (e) {
      sel.innerHTML = '<option>Error</option>';
      showError(e.message);
    }
  }

  async function loadReport() {
    const campaignId = document.getElementById('sel-campaign').value;
    if (!campaignId) return;
    clearError(); showSpinner();
    hide('summary'); hide('daily-section');

    const fields = 'spend,impressions,clicks,reach,ctr,cpc,cpm,actions,cost_per_action_type,date_start,date_stop';

    try {
      const [summaryData, dailyData] = await Promise.all([
        graphGet(`/${campaignId}/insights`, { fields, date_preset: 'last_14d', level: 'campaign' }),
        graphGet(`/${campaignId}/insights`, { fields, date_preset: 'last_14d', time_increment: 1, level: 'campaign', limit: 14 })
      ]);

      renderSummary(summaryData.data?.[0] ?? null);
      renderDaily(dailyData.data || []);
    } catch (e) {
      showError(e.message);
    } finally {
      hideSpinner();
    }
  }

  function renderSummary(d) {
    const totalActions = sumActions(d?.actions);
    const cpa = d && totalActions > 0 ? `$${(parseFloat(d.spend) / totalActions).toFixed(2)}` : '—';

    const cards = [
      { label: 'Total Spend',   value: d ? `$${fmt2(d.spend)}`   : '—', sub: 'USD last 14 days' },
      { label: 'Impressions',   value: d ? fmtN(d.impressions)   : '—', sub: 'total views' },
      { label: 'Clicks',        value: d ? fmtN(d.clicks)        : '—', sub: 'link clicks' },
      { label: 'Reach',         value: d ? fmtN(d.reach)         : '—', sub: 'unique people' },
      { label: 'CTR',           value: d ? `${fmt2(d.ctr)}%`     : '—', sub: 'click-through rate' },
      { label: 'Avg CPC',       value: d ? `$${fmt2(d.cpc)}`     : '—', sub: 'cost per click' },
      { label: 'CPM',           value: d ? `$${fmt2(d.cpm)}`     : '—', sub: 'per 1,000 impressions' },
      { label: 'Total Actions', value: fmtN(totalActions),              sub: 'all event types' },
      { label: 'Cost / Action', value: cpa,                             sub: 'avg across events' },
    ];

    document.getElementById('cards').innerHTML = cards.map(c => `
      <div class="card">
        <div class="label">${c.label}</div>
        <div class="value">${c.value}</div>
        <div class="sub">${c.sub}</div>
      </div>`).join('');

    show('summary');
  }

  function renderDaily(rows) {
    if (!rows.length) return;
    rows.sort((a, b) => a.date_start.localeCompare(b.date_start));

    const labels  = rows.map(r => r.date_start);
    const spends  = rows.map(r => parseFloat(r.spend || 0));
    const actions = rows.map(r => sumActions(r.actions));
    const cpas    = rows.map((r, i) => actions[i] > 0 ? +(spends[i] / actions[i]).toFixed(2) : 0);

    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(document.getElementById('daily-chart'), {
      data: {
        labels,
        datasets: [
          { type: 'bar',  label: 'Spend ($)',        data: spends,  backgroundColor: 'rgba(233,69,96,0.7)', yAxisID: 'ySpend',   order: 2 },
          { type: 'line', label: 'Actions',           data: actions, borderColor: '#0f3460', backgroundColor: 'rgba(15,52,96,0.1)', tension: 0.3, yAxisID: 'yActions', order: 1 },
          { type: 'line', label: 'Cost / Action ($)', data: cpas,    borderColor: '#f5a623', backgroundColor: 'rgba(245,166,35,0.1)', tension: 0.3, borderDash: [5,3], yAxisID: 'ySpend', order: 0 }
        ]
      },
      options: {
        responsive: true,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { position: 'top' } },
        scales: {
          ySpend:   { type: 'linear', position: 'left',  title: { display: true, text: 'Spend / CPA ($)' } },
          yActions: { type: 'linear', position: 'right', title: { display: true, text: 'Actions' }, grid: { drawOnChartArea: false } }
        }
      }
    });

    document.getElementById('daily-body').innerHTML = rows.map((r, i) => {
      const spend = parseFloat(r.spend || 0);
      const acts  = actions[i];
      return `<tr>
        <td>${r.date_start}</td>
        <td>$${fmt2(r.spend)}</td>
        <td>${fmtN(r.impressions)}</td>
        <td>${fmtN(r.clicks)}</td>
        <td>${fmtN(r.reach)}</td>
        <td>${fmt2(r.ctr)}%</td>
        <td>$${fmt2(r.cpc)}</td>
        <td>$${fmt2(r.cpm)}</td>
        <td>${fmtN(acts)}</td>
        <td>${acts > 0 ? '$' + (spend / acts).toFixed(2) : '—'}</td>
      </tr>`;
    }).join('');

    show('daily-section');
  }

  function sumActions(actions) {
    if (!actions?.length) return 0;
    return actions.reduce((s, a) => s + parseInt(a.value || 0, 10), 0);
  }

  function fmt2(v) { return v ? parseFloat(v).toFixed(2) : '0.00'; }
  function fmtN(v) { return v ? parseInt(v).toLocaleString() : '0'; }
  function show(id) { document.getElementById(id).style.display = 'block'; }
  function hide(id) { document.getElementById(id).style.display = 'none'; }
  function showSpinner() { document.getElementById('spinner').style.display = ''; }
  function hideSpinner() { document.getElementById('spinner').style.display = 'none'; }
  function showError(msg) { const el = document.getElementById('error-msg'); el.textContent = '⚠️ ' + msg; el.style.display = ''; }
  function clearError() { document.getElementById('error-msg').style.display = 'none'; }
</script>
</body>
</html>
