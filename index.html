<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>צבעים בעברית</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      color: #fff;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      margin-bottom: 30px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
      letter-spacing: 2px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 32px 28px 28px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      text-align: center;
    }

    .score {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 18px;
    }

    .color-swatch {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      margin: 0 auto 10px;
      border: 6px solid #f0f0f0;
      box-shadow: 0 6px 24px rgba(0,0,0,0.15);
      transition: transform 0.3s;
    }

    .color-swatch.pulse {
      animation: pulse 0.5s ease;
    }

    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    .question {
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: 700;
      color: #333;
      margin: 18px 0 24px;
      min-height: 2.4rem;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .option-btn {
      padding: 18px 10px;
      border: 3px solid #e0e0e0;
      border-radius: 16px;
      background: #fafafa;
      font-size: clamp(1.1rem, 4vw, 1.35rem);
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.2s, background 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .option-btn .swatch-mini {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid #ddd;
    }

    .option-btn:hover:not(:disabled) {
      transform: translateY(-3px);
      border-color: #aaa;
    }

    .option-btn:disabled { cursor: default; }

    .option-btn.correct {
      background: #d4f8d4;
      border-color: #4caf50;
      animation: bounce 0.4s ease;
    }

    .option-btn.wrong {
      background: #fde8e8;
      border-color: #f44336;
      animation: shake 0.4s ease;
    }

    @keyframes bounce {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.1); }
      70%  { transform: scale(0.96); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%   { transform: translateX(0); }
      25%  { transform: translateX(-6px); }
      50%  { transform: translateX(6px); }
      75%  { transform: translateX(-4px); }
      100% { transform: translateX(0); }
    }

    .feedback {
      margin-top: 22px;
      font-size: 1.3rem;
      font-weight: 700;
      min-height: 2rem;
      transition: opacity 0.3s;
    }

    .feedback.correct { color: #4caf50; }
    .feedback.wrong   { color: #f44336; }
    .feedback.hidden  { opacity: 0; }

    .next-btn {
      margin-top: 20px;
      padding: 14px 40px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      display: none;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 16px rgba(118,75,162,0.4);
    }

    .next-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(118,75,162,0.5); }
    .next-btn.visible { display: inline-block; }

    .stars {
      font-size: 1.6rem;
      letter-spacing: 4px;
      min-height: 2rem;
    }
  </style>
</head>
<body>
  <h1>🎨 ללמוד צבעים!</h1>

  <div class="card">
    <div class="score" id="score">שאלה 1</div>
    <div class="color-swatch" id="swatch"></div>
    <div class="stars" id="stars"></div>
    <div class="question" id="question">?איזה צבע זה</div>
    <div class="options" id="options"></div>
    <div class="feedback hidden" id="feedback"></div>
    <button class="next-btn" id="nextBtn" onclick="nextRound()">הבא ←</button>
  </div>

  <script>
    const COLORS = [
      { he: 'אָדֹם',   en: 'Red',    hex: '#e53935' },
      { he: 'כָּחֹל',  en: 'Blue',   hex: '#1e88e5' },
      { he: 'יָרֹק',   en: 'Green',  hex: '#43a047' },
      { he: 'צָהֹב',   en: 'Yellow', hex: '#fdd835' },
      { he: 'כָּתֹם',  en: 'Orange', hex: '#fb8c00' },
      { he: 'סָגֹל',   en: 'Purple', hex: '#8e24aa' },
      { he: 'וָרֹד',   en: 'Pink',   hex: '#e91e63' },
      { he: 'חוּם',    en: 'Brown',  hex: '#795548' },
      { he: 'שָׁחֹר',  en: 'Black',  hex: '#212121' },
      { he: 'לָבָן',   en: 'White',  hex: '#f5f5f5' },
      { he: 'אָפֹר',   en: 'Gray',   hex: '#9e9e9e' },
    ];

    let score = 0;
    let total = 0;
    let correct = null;
    let answered = false;

    function shuffle(arr) {
      return [...arr].sort(() => Math.random() - 0.5);
    }

    function nextRound() {
      answered = false;
      document.getElementById('feedback').className = 'feedback hidden';
      document.getElementById('feedback').textContent = '';
      document.getElementById('nextBtn').classList.remove('visible');
      document.getElementById('stars').textContent = '';

      const shuffled = shuffle(COLORS);
      correct = shuffled[0];
      const options = shuffled.slice(0, 4);

      total++;
      document.getElementById('score').textContent = `שאלה ${total}  |  ✅ ${score}`;

      const swatch = document.getElementById('swatch');
      swatch.style.background = correct.hex;
      swatch.classList.remove('pulse');
      void swatch.offsetWidth;
      swatch.classList.add('pulse');

      document.getElementById('question').textContent = '?איזה צבע זה';

      const container = document.getElementById('options');
      container.innerHTML = '';

      shuffle(options).forEach(color => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `
          <span class="swatch-mini" style="background:${color.hex}"></span>
          <span>${color.he}</span>
        `;
        btn.onclick = () => pick(btn, color);
        container.appendChild(btn);
      });
    }

    function pick(btn, color) {
      if (answered) return;
      answered = true;

      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(b => b.disabled = true);

      const feedback = document.getElementById('feedback');

      if (color.he === correct.he) {
        score++;
        btn.classList.add('correct');
        feedback.textContent = '!כל הכבוד 🌟 נכון מאוד';
        feedback.className = 'feedback correct';
        document.getElementById('stars').textContent = randomStars();
        document.getElementById('score').textContent = `שאלה ${total}  |  ✅ ${score}`;
      } else {
        btn.classList.add('wrong');
        // highlight correct answer
        allBtns.forEach(b => {
          if (b.querySelector('span:last-child').textContent.trim() === correct.he) {
            b.classList.add('correct');
          }
        });
        feedback.textContent = `לא נכון 😢  התשובה הנכונה: ${correct.he}`;
        feedback.className = 'feedback wrong';
      }

      document.getElementById('nextBtn').classList.add('visible');
    }

    function randomStars() {
      const n = Math.floor(Math.random() * 3) + 3;
      return '⭐'.repeat(n);
    }

    nextRound();
  </script>
</body>
</html>
