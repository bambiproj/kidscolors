<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>משחקים לילדים</title>
  <style>
    html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      position: fixed; inset: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', Tahoma, Arial, sans-serif;
      background: linear-gradient(160deg, #7c5cff 0%, #4dabf7 55%, #63e6be 100%);
      display: flex; flex-direction: column;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    /* floating clouds and bubbles behind everything */
    .sky { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .sky span { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.18); animation: drift linear infinite; }
    @keyframes drift { from { transform: translateY(0); } to { transform: translateY(-120vh); } }

    header { position: relative; text-align: center; padding: 10px 8px 4px; flex: none; }
    h1 {
      color: #fff; font-size: clamp(1.4rem, 6vw, 2.4rem); line-height: 1.15;
      text-shadow: 0 3px 0 rgba(0,0,0,0.15), 0 6px 14px rgba(0,0,0,0.2);
    }
    h1 .r { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-4px) rotate(-8deg); } }
    header p { color: rgba(255,255,255,0.92); font-size: clamp(0.8rem, 3.4vw, 1rem); margin-top: 2px; }

    .grid {
      position: relative; flex: 1 1 auto; min-height: 0;
      display: grid; gap: var(--gap, 10px); padding: 8px 10px 12px;
      width: 100%; max-width: 1400px; margin: 0 auto;
    }
    .tile {
      --c1: #ff8787; --c2: #f03e3e;
      position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: calc(var(--t, 100px) * 0.04);
      text-decoration: none; color: #fff; border-radius: calc(var(--t, 100px) * 0.2);
      background: linear-gradient(150deg, var(--c1), var(--c2));
      box-shadow: 0 6px 0 rgba(0,0,0,0.16), 0 10px 20px rgba(0,0,0,0.18), inset 0 2px 0 rgba(255,255,255,0.45);
      overflow: hidden; min-width: 0; min-height: 0;
      transition: transform .15s;
      animation: pop .5s backwards;
    }
    @keyframes pop { from { transform: scale(0.4); opacity: 0; } }
    .tile:hover { transform: translateY(-3px) scale(1.03); }
    .tile:active { transform: translateY(4px) scale(0.97); box-shadow: 0 2px 0 rgba(0,0,0,0.16), inset 0 2px 0 rgba(255,255,255,0.45); }
    /* shine across the top of the tile */
    .tile::before {
      content: ''; position: absolute; left: -20%; right: -20%; top: -55%; height: 90%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.35), rgba(255,255,255,0) 70%);
    }
    .tile .icon {
      position: relative; display: grid; place-items: center;
      width: calc(var(--t, 100px) * 0.56); height: calc(var(--t, 100px) * 0.56); border-radius: 50%;
      background: rgba(255,255,255,0.92); box-shadow: 0 4px 0 rgba(0,0,0,0.12), inset 0 -4px 0 rgba(0,0,0,0.06);
      font-size: calc(var(--t, 100px) * 0.33); line-height: 1;
      animation: float 3s ease-in-out infinite; animation-delay: var(--d, 0s);
    }
    .tile .icon.txt { font-family: 'Arial Rounded MT Bold', Arial, sans-serif; font-weight: 900; color: #e8590c; font-size: calc(var(--t, 100px) * 0.24); }
    @keyframes float { 50% { transform: translateY(calc(var(--t, 100px) * -0.04)) rotate(-4deg); } }
    .tile .name {
      position: relative; font-weight: bold; font-size: clamp(0.72rem, calc(var(--t, 100px) * 0.15), 1.5rem);
      text-shadow: 0 2px 0 rgba(0,0,0,0.2); white-space: nowrap;
    }
    .tile .badge {
      position: absolute; top: 6px; left: 6px; background: #ffd43b; color: #c92a2a; font-weight: bold;
      font-size: clamp(0.6rem, calc(var(--t, 100px) * 0.1), 0.9rem); padding: 2px 7px; border-radius: 999px;
      box-shadow: 0 2px 0 rgba(0,0,0,0.15); transform: rotate(-10deg); animation: wiggle 1.2s ease-in-out infinite;
    }
    @keyframes wiggle { 50% { transform: rotate(8deg) scale(1.1); } }
  </style>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="משחקים" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#7c5cff" />
  <script src="app.js" defer></script>
</head>
<body>
  <div class="sky" id="sky"></div>
  <header>
    <h1><span class="r">🌈</span> משחקים לילדים <span class="r" style="animation-delay:.6s">⭐</span></h1>
    <p>בחרו משחק ושחקו! 👇</p>
  </header>
  <main class="grid" id="grid"></main>

  <script>
    // every game: page, name, icon and two tile colors
    const GAMES = [
      ['soccer.html', 'בעיטות לשער', '⚽', '#69db7c', '#2b8a3e', true],
      ['race.html', 'מרוץ מכוניות', '🏎️', '#ff8787', '#c92a2a'],
      ['water.html', 'מים לדגי', '🐠', '#4dabf7', '#1971c2'],
      ['draw.html', 'מציירים', '✏️', '#ffa94d', '#e8590c'],
      ['dig.html', 'חופרים', '⛏️', '#ffd43b', '#f08c00'],
      ['platformer.html', 'קופצני', '⚡', '#ffe066', '#fab005'],
      ['pacman.html', 'פקמן', '😋', '#748ffc', '#4263eb'],
      ['connect4.html', '4 בשורה', '🟡', '#ff8787', '#e03131'],
      ['snake.html', 'נחש', '🐍', '#69db7c', '#2f9e44'],
      ['maze.html', 'מבוך', '🧩', '#b197fc', '#7048e8'],
      ['hexmaze.html', 'משושים', '🐝', '#ffc078', '#f76707'],
      ['pokemon.html', 'פוקימון', '🎴', '#ff922b', '#d9480f'],
      ['chess.html', 'שחמט', '♟️', '#adb5bd', '#495057'],
      ['checkers.html', 'דמקה', '🔴', '#f783ac', '#c2255c'],
      ['backgammon.html', 'שש-בש', '🎲', '#d8a47f', '#9c5b2e'],
      ['colors.html', 'צבעים', '🎨', '#f06595', '#ae3ec9'],
      ['alef-bet.html', 'אלף-בית', 'אב', '#63e6be', '#0ca678'],
      ['words.html', 'מילים', '📖', '#66d9e8', '#1098ad'],
      ['math.html', 'חשבון', '➕', '#8ce99a', '#37b24d']
    ];
    const grid = document.getElementById('grid');
    grid.innerHTML = GAMES.map(([href, name, icon, c1, c2, isNew], i) =>
      `<a class="tile" href="${href}" style="--c1:${c1};--c2:${c2};animation-delay:${i * 0.03}s">
         ${isNew ? '<span class="badge">חדש!</span>' : ''}
         <span class="icon${/^[֐-׿]/.test(icon) ? ' txt' : ''}" style="--d:${(i % 5) * -0.6}s">${icon}</span>
         <span class="name">${name}</span>
       </a>`).join('');

    // spread the tiles over the whole screen: pick the column count that gives the biggest tiles
    function fit() {
      const r = grid.getBoundingClientRect(), gap = r.width < 500 ? 8 : 12;
      const w = r.width - 20, h = r.height - 20, n = GAMES.length;
      let best = { t: 0 };
      for (let c = 2; c <= 9; c++) {
        const rows = Math.ceil(n / c), tw = (w - gap * (c - 1)) / c, th = (h - gap * (rows - 1)) / rows;
        const t = Math.min(tw, th * 1.15);
        if (t > best.t) best = { t, c, rows, tw, th };
      }
      grid.style.setProperty('--gap', gap + 'px');
      grid.style.gridTemplateColumns = `repeat(${best.c}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${best.rows}, 1fr)`;
      grid.style.setProperty('--t', Math.min(best.tw, best.th) + 'px');
    }
    addEventListener('resize', fit); fit();

    // a few soft bubbles drifting up
    const sky = document.getElementById('sky');
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('span'), size = 20 + Math.random() * 70;
      Object.assign(s.style, { width: size + 'px', height: size + 'px', left: Math.random() * 100 + '%', top: 100 + Math.random() * 30 + '%', animationDuration: 14 + Math.random() * 16 + 's', animationDelay: -Math.random() * 30 + 's' });
      sky.appendChild(s);
    }
  </script>
  <script>
    (function () {
      let lastTouch = 0;
      document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastTouch < 350 && !e.target.closest('button, a')) e.preventDefault(); lastTouch = now; }, { passive: false });
      ['gesturestart', 'gesturechange', 'gestureend', 'dblclick'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
      document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
    })();
  </script>
</body>
</html>
