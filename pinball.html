<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>פינבול היצורים</title>
  <style>
    html { touch-action: none; -webkit-text-size-adjust: 100%; }
    button { touch-action: none; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      position: fixed; inset: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', Tahoma, Arial, sans-serif;
      background: radial-gradient(circle at 50% 15%, #23163a 0%, #07040e 70%);
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    .app { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 4px 6px; overflow: hidden; }
    nav { position: fixed; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.35); display: flex; gap: 6px; padding: 6px 10px; z-index: 50; align-items: center; }
    nav a.home-link { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; font-size: 0.9rem; font-weight: 800; padding: 4px 16px; border-radius: 999px; background: #fff; color: #5a3fd1; box-shadow: 0 3px 0 rgba(0,0,0,0.18); text-decoration: none; white-space: nowrap; }
    nav .nav-btn { border: none; border-radius: 999px; background: rgba(255,255,255,0.92); font-size: 0.95rem; padding: 3px 10px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,0.18); }
    .board-wrap { position: relative; flex: 1 1 auto; min-height: 240px; width: min(calc(100vw - 8px), 760px); display: flex; align-items: center; justify-content: center; }
    canvas#game { display: block; border-radius: 12px; touch-action: none; box-shadow: 0 0 0 4px #1b1b1b, 0 0 0 7px #6c757d, 0 0 0 9px #212529, 0 16px 34px rgba(0,0,0,0.7); }
    .overlay { position: absolute; inset: 0; margin: auto; border-radius: 12px; background: rgba(8,5,18,0.9); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: safe center; text-align: center; padding: 14px; gap: 10px; overflow-y: auto; z-index: 5; }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: clamp(1.3rem, 6vw, 2rem); text-shadow: 0 0 14px #ff922b; color: #ffd43b; }
    .overlay p { color: rgba(255,255,255,0.88); font-size: clamp(0.8rem, 3.4vw, 0.98rem); max-width: 330px; line-height: 1.4; }
    .play-btn { border: none; background: #ffd43b; color: #5c3c00; font: inherit; font-size: 1.15rem; font-weight: bold; padding: 9px 28px; border-radius: 999px; cursor: pointer; box-shadow: 0 5px 0 #c99a00; touch-action: manipulation; }
    .play-btn:active { transform: translateY(3px); }
    .best { color: #ffe066; font-weight: bold; font-size: 0.9rem; }
    .best:empty { display: none; }
    /* two big flipper pads: each half of the screen is a flipper */
    .pads { width: min(calc(100vw - 8px), 560px); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: none; direction: ltr; }
    .pad { height: 54px; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: bold; color: #3d2600; font-size: 0.95rem;
      background: linear-gradient(180deg, #ffe066, #f59f00); box-shadow: 0 6px 0 #9c5d00, inset 0 2px 0 rgba(255,255,255,0.6); transition: transform .05s; }
    .pad b { font-size: 1.6rem; }
    .pad.down { transform: translateY(5px); box-shadow: 0 1px 0 #9c5d00, inset 0 2px 0 rgba(255,255,255,0.6); filter: brightness(1.12); }
    .pad.launch { background: linear-gradient(180deg, #ff8787, #e03131); color: #fff; box-shadow: 0 6px 0 #8f1c1c, inset 0 2px 0 rgba(255,255,255,0.4); }
  </style>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="משחקים" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#7c5cff" />
  <script src="app.js" defer></script>
</head>
<body>
  <nav dir="rtl"><a class="home-link" href="index.html">🏠 כל המשחקים</a><button class="nav-btn" id="soundBtn">🔊</button></nav>
  <div class="app">
    <div class="board-wrap" id="wrap">
      <canvas id="game"></canvas>
      <div dir="rtl" class="overlay" id="startScreen">
        <h2>🎱 פינבול היצורים</h2>
        <p><b>אגודל שמאל</b> על חצי המסך השמאלי, <b>אגודל ימין</b> על החצי הימני - והכנפיים זזות.<br>
          כשהכדור מחכה בשיגור: <b>החזיקו</b> את האצבע ו<b>שחררו</b> לשיגור.<br><br>
          🐾 רמפות = תופסים יצורים · 🎯 3 מטרות = נעילה · 🔒🔒 = מולטיבול<br>🐉 העירו את הדרקון 3 פעמים - ואז רמפה או מערה פותחת משימה!</p>
        <div class="best" id="best"></div>
        <button class="play-btn" id="playBtn">▶ התחילו!</button>
      </div>
      <div dir="rtl" class="overlay hidden" id="overScreen">
        <h2 id="overTitle">המשחק נגמר</h2>
        <p id="overText"></p>
        <button class="play-btn" id="againBtn">🔁 עוד משחק</button>
      </div>
    </div>
    <div class="pads">
      <div class="pad" id="padL"><b>◀</b><span>כנף</span></div>
      <div class="pad" id="padR"><span>כנף</span><b>▶</b></div>
    </div>
  </div>

  <script>
    // ---------- Table (pixels): x right, y down the slope ----------
    const W = 360, H = 640, TAU = Math.PI * 2, DMD_H = 46;
    const BR = 7, GRAV = 1150, DT = 1 / 480;
    const DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    const $ = id => document.getElementById(id);
    const rnd = (a, b) => a + Math.random() * (b - a);
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    function shade(col, a) { const n = parseInt(col.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; const t = a < 0 ? 0 : 255, p = Math.abs(a); return `rgb(${Math.round((t - r) * p + r)},${Math.round((t - g) * p + g)},${Math.round((t - b) * p + b)})`; }

    const ARC_C = { x: 179, y: 215 }, ARC_R = 167;
    const arc = []; for (let a = 0; a >= -Math.PI; a -= Math.PI / 48) arc.push([ARC_C.x + Math.cos(a) * ARC_R, ARC_C.y + Math.sin(a) * ARC_R]);
    // walls the ball bounces off: r = half thickness, e = bounciness, kind decides how they are drawn
    const WALLS = [
      { pts: [[346, 650], ...arc, [12, 650]], r: 3, e: 0.35, kind: 'outer' },
      { pts: [[322, 650], [322, 240]], r: 3, e: 0.3, kind: 'metal' },                          // plunger lane wall
      { pts: [[44, 236], [44, 334]], r: 3, e: 0.35, kind: 'metal' },                           // spinner lane wall (left orbit)
      { pts: [[36, 440], [36, 512], [99, 555]], r: 3, e: 0.3, kind: 'metal' },                 // left inlane guide
      { pts: [[304, 440], [304, 512], [241, 555]], r: 3, e: 0.3, kind: 'metal' },              // right inlane guide
      { pts: [[62, 445], [62, 500], [100, 527]], r: 3, e: 0.3, kind: 'hidden' },               // sling bodies
      { pts: [[278, 445], [278, 500], [240, 527]], r: 3, e: 0.3, kind: 'hidden' },
      { pts: [[128, 98], [128, 128]], r: 3, e: 0.4, kind: 'guide' }, { pts: [[160, 94], [160, 124]], r: 3, e: 0.4, kind: 'guide' },
      { pts: [[192, 94], [192, 124]], r: 3, e: 0.4, kind: 'guide' }, { pts: [[224, 98], [224, 128]], r: 3, e: 0.4, kind: 'guide' },
      { pts: [[150, 332], [158, 352]], r: 3, e: 0.4, kind: 'guide' }, { pts: [[194, 332], [186, 352]], r: 3, e: 0.4, kind: 'guide' },
      { pts: [[318, 292], [318, 372]], r: 2, e: 0.2, kind: 'hidden' }                          // behind the drop targets
    ];
    const POSTS = [[80, 330], [126, 330], [218, 330], [264, 330], [36, 440], [304, 440], [128, 98], [224, 98], [44, 236]].map(([x, y]) => ({ x, y, r: 5 }));
    const BUMPERS = [{ x: 140, y: 184 }, { x: 204, y: 184 }, { x: 172, y: 234 }].map((b, i) => ({ ...b, r: 17, flash: 0, col: ['#ff6b6b', '#4dabf7', '#ffd43b'][i] }));
    const SLINGS = [{ a: [62, 445], b: [100, 527], n: [0.91, -0.42], flash: 0 }, { a: [278, 445], b: [240, 527], n: [-0.91, -0.42], flash: 0 }];
    const DROPS = [298, 322, 346].map(y => ({ x: 314, y, h: 20, down: false, t: 0 }));
    const LANES = [144, 176, 208].map(x => ({ x, y: 112, lit: false }));
    const SAUCER = { x: 172, y: 312 };
    const TOY = { x: 270, y: 124, r: 19, wob: 0, hits: 0 };
    const SPINNER = { x0: 12, x1: 44, y: 290, a: 0, w: 0 };
    const RAMPS = [
      { name: 'שמאל', ent: [[80, 330], [126, 330]], path: [[103, 328], [100, 250], [86, 190], [58, 170], [34, 204], [36, 300], [48, 425]], clear: 3, exit: [0, 260], col: '#4dabf7' },
      { name: 'ימין', ent: [[218, 330], [264, 330]], path: [[241, 328], [244, 250], [258, 190], [286, 170], [310, 204], [306, 300], [292, 425]], clear: 3, exit: [0, 260], col: '#ff922b' }
    ];
    const FLIP_L = 54;
    const flippers = [
      { x: 110, y: 562, rest: 0.52, up: -0.46, a: 0.52, w: 0, on: false },
      { x: 230, y: 562, rest: Math.PI - 0.52, up: Math.PI + 0.46, a: Math.PI - 0.52, w: 0, on: false }
    ];
    const CREATURES = [{ name: 'זיפי', col: '#b197fc', kind: 'zap' }, { name: 'בובי', col: '#4dabf7', kind: 'water' }, { name: 'עלעלי', col: '#69db7c', kind: 'leaf' }, { name: 'גחלי', col: '#ff922b', kind: 'fire' }];
    const MODES = [
      { name: 'סופת ברקים', tip: 'באמפרים ×10!', icon: '⚡' },
      { name: 'ריצת רמפות', tip: 'כל רמפה 15,000!', icon: '🛝' },
      { name: 'ציד מטרות', tip: 'כל מטרה 5,000!', icon: '🎯' },
      { name: 'סחרור', tip: 'הספינר שווה 1,000!', icon: '🌀' }
    ];
    const FLASHERS = [{ x: 40, y: 92, col: '#4dabf7', v: 0 }, { x: 316, y: 92, col: '#ff922b', v: 0 }, { x: 103, y: 300, col: '#74c0fc', v: 0 }, { x: 241, y: 300, col: '#ffa94d', v: 0 }, { x: 172, y: 280, col: '#da77f2', v: 0 }];
    const flash = (i, v = 1) => { FLASHERS[i].v = Math.max(FLASHERS[i].v, v); };

    // ---------- Saved ----------
    function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } }
    function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
    let best = load('pinball-best', 0), soundOn = load('pinball-sound', true);

    // ---------- Sound: coils, rubbers, bells, and a little music ----------
    let audio = null, master = null;
    function ac() { if (!audio) { audio = new (window.AudioContext || window.webkitAudioContext)(); master = audio.createGain(); master.gain.value = 0.9; master.connect(audio.destination); } if (audio.state === 'suspended') audio.resume(); return audio; }
    function tone(f, dur = .1, type = 'sine', when = 0, vol = .12, slide = 0) { if (!soundOn) return; try { const a = ac(), t = a.currentTime + when, o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); o.connect(g).connect(master); o.start(t); o.stop(t + dur + .02); } catch {} }
    const noiseBuf = {};
    function noise(dur, vol, freq, type = 'lowpass', when = 0, q = 0.8) { if (!soundOn) return; try { const a = ac(), n = Math.max(1, Math.floor(a.sampleRate * dur)); let b = noiseBuf[n]; if (!b) { b = a.createBuffer(1, n, a.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) ** 3; noiseBuf[n] = b; } const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); f.type = type; f.frequency.value = freq; f.Q.value = q; g.gain.value = vol; s.buffer = b; s.connect(f).connect(g).connect(master); s.start(a.currentTime + when); } catch {} }
    const last = {}; const lim = (k, ms) => { const n = performance.now(); if (n - (last[k] || 0) < ms) return false; last[k] = n; return true; };
    const sfx = {
      flipper() { noise(.05, .5, 1400, 'lowpass'); noise(.09, .35, 180, 'lowpass', .005); tone(70, .07, 'square', 0, .07, .5); },
      flipDown() { noise(.03, .15, 900); },
      bumper() { if (!lim('b', 35)) return; noise(.06, .6, 2200, 'bandpass', 0, 1.2); tone(120, .12, 'sine', 0, .3, .5); tone(880, .06, 'square', 0, .03); },
      sling() { if (!lim('s', 35)) return; noise(.05, .55, 1600, 'bandpass'); tone(95, .06, 'sine', 0, .22, .6); },
      rubber(v) { if (v < 180 || !lim('r', 50)) return; noise(.025, Math.min(.18, v / 5000), 700, 'bandpass'); },
      wall(v) { if (v < 220 || !lim('w', 50)) return; noise(.02, Math.min(.14, v / 7000), 4200, 'highpass'); },
      rollover() { tone(1568, .1, 'triangle', 0, .07); tone(2093, .14, 'triangle', .05, .06); },
      drop() { noise(.07, .5, 450); tone(100, .1, 'sine', 0, .2); },
      dropReset() { noise(.12, .5, 300); tone(80, .12, 'square', 0, .07); },
      spin() { if (!lim('sp', 28)) return; noise(.012, .25, 5000, 'highpass'); tone(2400, .015, 'square', 0, .02); },
      toy() { tone(330, .15, 'sawtooth', 0, .07, 1.6); noise(.08, .4, 900); },
      ramp() { tone(220, .45, 'sawtooth', 0, .045, 2.8); noise(.45, .1, 1400, 'bandpass'); },
      rampDone() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, .1, 'square', i * .055, .05)); },
      saucer() { tone(70, .25, 'sine', 0, .35, .5); noise(.15, .4, 350); },
      kick() { noise(.09, .6, 600); tone(120, .1, 'square', 0, .1, .5); },
      kickback() { noise(.15, .7, 500); tone(80, .2, 'square', 0, .15, .4); },
      plunger(p) { noise(.18, .4 + p * .3, 500); tone(160 + p * 220, .3, 'triangle', 0, .08, 2.2); },
      drain() { [523, 392, 330, 262, 196].forEach((f, i) => tone(f, .26, 'triangle', i * .15, .1)); noise(.3, .3, 200, 'lowpass', .6); },
      jackpot() { [523, 659, 784, 1047, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, .13, 'square', i * .075, .06)); noise(1.2, .12, 1500, 'bandpass', .2); },
      lane() { [1047, 1319, 1568].forEach((f, i) => tone(f, .1, 'triangle', i * .065, .07)); },
      knocker() { noise(.12, .9, 160); tone(55, .25, 'square', 0, .2, .5); },
      start() { [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, .14, 'square', i * .09, .06)); },
      saved() { [784, 659, 784, 1047].forEach((f, i) => tone(f, .12, 'triangle', i * .08, .08)); },
      mode() { [392, 392, 523, 659, 784].forEach((f, i) => tone(f, .16, 'sawtooth', i * .1, .05)); }
    };
    function say(t) { if (!soundOn || !('speechSynthesis' in window)) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'he-IL'; u.pitch = 1.2; u.rate = 1.1; speechSynthesis.speak(u); } catch {} }
    // background music: a bass line and a melody, faster in multiball
    const SONG = { bass: [45, 45, 52, 45, 48, 48, 55, 48, 43, 43, 50, 43, 47, 47, 52, 50], lead: [69, 0, 72, 74, 76, 0, 74, 72, 67, 0, 71, 72, 74, 0, 76, 79] };
    let musicStep = 0, musicT = 0;
    const midi = n => 440 * Math.pow(2, (n - 69) / 12);
    function music(dt) {
      if (!soundOn || state !== 'play') return;
      musicT -= dt;
      if (musicT > 0) return;
      const beat = (multiball ? 0.13 : 0.19) * 0.72; musicT = Math.max(musicT + beat, 0.01);
      const i = musicStep++ % 16, bn = SONG.bass[i], ln = SONG.lead[(i + (multiball ? 8 : 0)) % 16];
      tone(midi(bn), beat * 0.9, 'triangle', 0, 0.05);
      if (ln && i % 2 === 0) tone(midi(ln), beat * 1.6, 'square', 0, 0.018);
      if (i % 4 === 0) noise(.04, .08, 120, 'lowpass');
      if (i % 4 === 2) noise(.03, .05, 6000, 'highpass');
    }

    // ---------- Canvas ----------
    const canvas = $('game'), ctx = canvas.getContext('2d');
    function fit() {
      // as wide as the screen allows; if the table is then too tall, show most of it and scroll with the ball
      const wrap = $('wrap'), bw = wrap.clientWidth - 14, bh = wrap.clientHeight - 14, sc = Math.min(bw / W, bh / (H * 0.8));
      const cw = Math.floor(W * sc), ch = Math.floor(Math.min(H * sc, bh));
      VIEW_H = ch / sc;
      canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px'; canvas.width = Math.round(cw * DPR); canvas.height = Math.round(ch * DPR);
      document.querySelectorAll('.overlay').forEach(o => { o.style.width = cw + 'px'; o.style.height = ch + 'px'; });
    }
    addEventListener('resize', fit);
    let VIEW_H = H, camY = 0;
    function moveCamera(dt) {
      const maxY = H - VIEW_H; if (maxY <= 0.5) { camY = 0; return; }
      if (state !== 'play') { camY = maxY * (0.5 + 0.5 * Math.sin(time * 0.35)); return; }
      const live = balls.filter(b => !b.gone && !b.lockedAway);
      if (!live.length) { camY += (maxY - camY) * Math.min(1, dt * 5); return; }
      const y = Math.max(...live.map(b => b.y));                       // follow the lowest ball: that is the one to save
      camY += (clamp(y - VIEW_H * 0.55, 0, maxY) - camY) * Math.min(1, dt * 6);
      camY = clamp(camY, clamp(y - VIEW_H + 70, 0, maxY), clamp(y - DMD_H - 24, 0, maxY));
    }

    // ---------- Creatures ----------
    function creature(c, x, y, s, cr, t = 0) {
      const col = cr.col, dark = shade(col, -0.5), light = shade(col, 0.6), wob = Math.sin(t * 9);
      c.save(); c.translate(x, y); c.scale(s, s); c.lineJoin = 'round'; c.lineCap = 'round';
      c.fillStyle = 'rgba(0,0,0,0.35)'; c.beginPath(); c.ellipse(2, 22, 20, 5, 0, 0, TAU); c.fill();
      const outline = () => { c.strokeStyle = dark; c.lineWidth = 1.3; c.stroke(); };
      // ---- behind the body: tails, ears, crests
      if (cr.kind === 'zap') {
        c.fillStyle = col; c.beginPath(); c.moveTo(14, 10); c.lineTo(30, 2); c.lineTo(25, -4); c.lineTo(36, -16); c.lineTo(22, -10); c.lineTo(26, -3); c.lineTo(12, 4); c.closePath(); c.fill(); outline();
        for (const sd of [-1, 1]) {
          const g = c.createLinearGradient(sd * 8, -12, sd * 22, -40); g.addColorStop(0, col); g.addColorStop(1, light);
          c.fillStyle = g; c.beginPath(); c.moveTo(sd * 5, -15); c.lineTo(sd * 13, -30); c.lineTo(sd * 10, -31); c.lineTo(sd * 20, -42); c.lineTo(sd * 18, -29); c.lineTo(sd * 21, -28); c.lineTo(sd * 15, -12); c.closePath(); c.fill(); outline();
        }
      }
      if (cr.kind === 'water') {
        const g = c.createLinearGradient(14, 0, 34, 0); g.addColorStop(0, col); g.addColorStop(1, '#a5d8ff');
        c.fillStyle = g; c.beginPath(); c.moveTo(14, 8); c.quadraticCurveTo(26, 6, 30, -6); c.quadraticCurveTo(31, 4, 38, 6); c.quadraticCurveTo(30, 10, 34, 18); c.quadraticCurveTo(24, 12, 14, 14); c.closePath(); c.fill(); outline();
        for (const sd of [-1, 1]) { c.fillStyle = '#a5d8ff'; c.beginPath(); c.moveTo(sd * 15, -10); c.quadraticCurveTo(sd * 28, -16, sd * 25, -2); c.quadraticCurveTo(sd * 22, -6, sd * 17, -4); c.closePath(); c.fill(); outline(); }
        const dg = c.createRadialGradient(-2, -30, 1, 0, -26, 12); dg.addColorStop(0, '#e7f5ff'); dg.addColorStop(1, '#339af0');
        c.fillStyle = dg; c.beginPath(); c.moveTo(0, -42); c.bezierCurveTo(4, -34, 9, -28, 8, -22); c.bezierCurveTo(7, -16, -7, -16, -8, -22); c.bezierCurveTo(-9, -28, -4, -34, 0, -42); c.fill(); outline();
      }
      if (cr.kind === 'leaf') {
        c.strokeStyle = '#2b8a3e'; c.lineWidth = 3; c.beginPath(); c.moveTo(15, 12); c.bezierCurveTo(30, 14, 34, 0, 26, -2); c.bezierCurveTo(20, -3, 21, 6, 27, 5); c.stroke();
        for (const sd of [-1, 1]) {
          c.save(); c.translate(sd * 4, -17); c.rotate(sd * 0.55 + wob * 0.05);
