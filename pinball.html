<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>פינבול היצורים</title>
  <style>
    html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
    button { touch-action: manipulation; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      position: fixed; inset: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', Tahoma, Arial, sans-serif;
      background: radial-gradient(circle at 50% 20%, #2b1a4a 0%, #0a0614 75%);
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    .app { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 4px 8px; overflow: hidden; }
    nav { position: fixed; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.25); display: flex; gap: 5px; padding: 6px 10px; z-index: 50; }
    nav a.home-link { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; font-size: 0.9rem; font-weight: 800; padding: 4px 16px; border-radius: 999px; background: #fff; color: #5a3fd1; box-shadow: 0 3px 0 rgba(0,0,0,0.18); text-decoration: none; white-space: nowrap; }
    .board-wrap { position: relative; flex: 1 1 auto; min-height: 240px; width: min(calc(100vw - 8px), 760px); display: flex; align-items: center; justify-content: center; }
    canvas#game { display: block; border-radius: 14px; touch-action: none; box-shadow: 0 0 0 5px #343a40, 0 0 0 8px #868e96, 0 14px 30px rgba(0,0,0,0.6); }
    .overlay { position: absolute; inset: 0; margin: auto; border-radius: 14px; background: rgba(10,6,25,0.88); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: safe center; text-align: center; padding: 12px; gap: 10px; overflow-y: auto; z-index: 5; }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: clamp(1.3rem, 6vw, 2rem); text-shadow: 0 0 14px #ff922b; color: #ffd43b; }
    .overlay p { color: rgba(255,255,255,0.88); font-size: clamp(0.8rem, 3.4vw, 1rem); max-width: 330px; line-height: 1.35; }
    .play-btn { border: none; background: #ffd43b; color: #5c3c00; font: inherit; font-size: 1.15rem; font-weight: bold; padding: 9px 28px; border-radius: 999px; cursor: pointer; box-shadow: 0 5px 0 #c99a00; }
    .play-btn:active { transform: translateY(3px); }
    .best { color: #ffe066; font-weight: bold; font-size: 0.9rem; }
    .best:empty { display: none; }
    .panel { width: min(calc(100vw - 8px), 560px); display: grid; grid-template-columns: 1.3fr 1fr 0.7fr 1.3fr; gap: 6px; flex: none; direction: ltr; }
    .panel button { border: none; border-radius: 16px; font: inherit; height: 64px; cursor: pointer; font-weight: bold; color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,0.45); line-height: 1.05; font-size: 0.8rem; }
    .panel button b { display: block; font-size: 1.5rem; }
    .panel .flip { background: linear-gradient(180deg, #ffd43b, #f08c00); color: #5c3c00; }
    .panel #launchBtn { background: linear-gradient(180deg, #ff6b6b, #c92a2a); }
    .panel #soundBtn { background: #495057; }
    .panel button.down { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.45); filter: brightness(1.15); }
  </style>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="משחקים" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#7c5cff" />
  <script src="app.js" defer></script>
</head>
<body>
  <nav dir="rtl"><a class="home-link" href="index.html">🏠 כל המשחקים</a></nav>
  <div class="app">
    <div class="board-wrap" id="wrap">
      <canvas id="game"></canvas>
      <div dir="rtl" class="overlay" id="startScreen">
        <h2>🎱 פינבול היצורים</h2>
        <p>לחצו על <b>צד שמאל</b> או <b>צד ימין</b> של המסך כדי להפעיל את הכנפיים.<br>החזיקו את <b>🚀 שיגור</b> כדי למתוח את הקפיץ, ושחררו!<br><br>שלחו את הכדור ל<b>רמפות</b> כדי לתפוס יצורים 🐾, הפילו את <b>3 המטרות</b> ונעלו כדורים ב<b>מערה</b> ל<b>מולטיבול</b>!</p>
        <div class="best" id="best"></div>
        <button class="play-btn" id="playBtn">▶ התחילו!</button>
      </div>
      <div dir="rtl" class="overlay hidden" id="overScreen">
        <h2 id="overTitle">המשחק נגמר</h2>
        <p id="overText"></p>
        <button class="play-btn" id="againBtn">🔁 עוד משחק</button>
      </div>
    </div>
    <div class="panel">
      <button class="flip" id="leftBtn"><b>◀</b>כנף</button>
      <button id="launchBtn"><b>🚀</b>שיגור</button>
      <button id="soundBtn"><b>🔊</b></button>
      <button class="flip" id="rightBtn"><b>▶</b>כנף</button>
    </div>
  </div>

  <script>
    // ---------- Table (pixels): x right, y down the slope ----------
    const W = 360, H = 640, TAU = Math.PI * 2, DMD_H = 44;
    const BR = 7, GRAV = 1150, DT = 1 / 480;
    const DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    const $ = id => document.getElementById(id);
    const rnd = (a, b) => a + Math.random() * (b - a);
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    // walls: polylines the ball bounces off (r = half thickness, e = bounciness)
    const ARC_C = { x: 179, y: 215 }, ARC_R = 167;
    const arc = []; for (let a = 0; a >= -Math.PI; a -= Math.PI / 40) arc.push([ARC_C.x + Math.cos(a) * ARC_R, ARC_C.y + Math.sin(a) * ARC_R]);
    const WALLS = [
      { pts: [[346, 650], ...arc.slice(), [12, 650]].map(p => p), r: 3, e: 0.35, kind: 'outer' },
      { pts: [[322, 650], [322, 240]], r: 3, e: 0.3 },                                         // plunger lane wall
      { pts: [[36, 440], [36, 512], [99, 555]], r: 3, e: 0.3 },                               // left inlane guide
      { pts: [[304, 440], [304, 512], [241, 555]], r: 3, e: 0.3 },                             // right inlane guide
      { pts: [[62, 445], [62, 500], [100, 527]], r: 3, e: 0.3 },                                // left sling body
      { pts: [[278, 445], [278, 500], [240, 527]], r: 3, e: 0.3 },                             // right sling body
      { pts: [[128, 98], [128, 128]], r: 3, e: 0.4 }, { pts: [[160, 94], [160, 124]], r: 3, e: 0.4 },
      { pts: [[192, 94], [192, 124]], r: 3, e: 0.4 }, { pts: [[224, 98], [224, 128]], r: 3, e: 0.4 },   // top lane posts
      { pts: [[12, 320], [22, 320], [22, 392], [12, 392]], r: 2, e: 0.2 },                      // drop target pocket
      { pts: [[150, 330], [158, 352]], r: 3, e: 0.4 }, { pts: [[194, 330], [186, 352]], r: 3, e: 0.4 }   // saucer side guides
    ];
    const POSTS = [[80, 330], [126, 330], [218, 330], [264, 330], [36, 440], [304, 440], [128, 98], [224, 98]].map(([x, y]) => ({ x, y, r: 5 }));
    const BUMPERS = [{ x: 140, y: 182 }, { x: 204, y: 182 }, { x: 172, y: 232 }].map((b, i) => ({ ...b, r: 17, flash: 0, col: ['#ff6b6b', '#4dabf7', '#ffd43b'][i] }));
    const SLINGS = [{ a: [62, 445], b: [100, 527], n: [0.91, -0.42], flash: 0 }, { a: [278, 445], b: [240, 527], n: [-0.91, -0.42], flash: 0 }];
    const DROPS = [330, 354, 378].map(y => ({ x: 22, y, h: 20, down: false, t: 0 }));
    const LANES = [144, 176, 208].map(x => ({ x, y: 112, lit: false }));
    const SAUCER = { x: 172, y: 312 };
    // ramps: an entrance line, a path in the air, and where the ball comes out
    const RAMPS = [
      { name: 'שמאל', ent: [[80, 330], [126, 330]], path: [[103, 328], [100, 250], [86, 190], [58, 170], [34, 204], [36, 300], [48, 425]], exit: [0, 260], col: '#4dabf7' },
      { name: 'ימין', ent: [[218, 330], [264, 330]], path: [[241, 328], [244, 250], [258, 190], [286, 170], [310, 204], [306, 300], [292, 425]], exit: [0, 260], col: '#ff922b' }
    ];
    const FLIP_L = 54;
    const flippers = [
      { x: 110, y: 562, rest: 0.52, up: -0.46, a: 0.52, w: 0, on: false, side: -1 },
      { x: 230, y: 562, rest: Math.PI - 0.52, up: Math.PI + 0.46, a: Math.PI - 0.52, w: 0, on: false, side: 1 }
    ];
    const CREATURES = [
      { name: 'זיפי', col: '#ffd43b', kind: 'zap' }, { name: 'בובי', col: '#4dabf7', kind: 'water' },
      { name: 'עלעלי', col: '#69db7c', kind: 'leaf' }, { name: 'גחלי', col: '#ff922b', kind: 'fire' }
    ];

    // ---------- Saved ----------
    function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } }
    function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
    let best = load('pinball-best', 0), soundOn = load('pinball-sound', true);

    // ---------- Sound: every part of the machine has its own sound ----------
    let audio = null;
    function ac() { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); return audio; }
    function tone(f, dur = .1, type = 'sine', when = 0, vol = .12, slide = 0) { if (!soundOn) return; try { const a = ac(), t = a.currentTime + when, o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02); } catch {} }
    function noise(dur, vol, freq, type = 'lowpass', when = 0) { if (!soundOn) return; try { const a = ac(), n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) ** 3; const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); f.type = type; f.frequency.value = freq; g.gain.value = vol; s.buffer = b; s.connect(f).connect(g).connect(a.destination); s.start(a.currentTime + when); } catch {} }
    const last = {}; const lim = (k, ms) => { const n = performance.now(); if (n - (last[k] || 0) < ms) return false; last[k] = n; return true; };
    const sfx = {
      flipper() { noise(.07, .35, 900); tone(90, .06, 'square', 0, .08, .6); },
      bumper() { if (!lim('b', 40)) return; tone(260, .12, 'square', 0, .1, 1.8); noise(.1, .3, 2500, 'bandpass'); },
      sling() { if (!lim('s', 40)) return; noise(.06, .4, 1800, 'bandpass'); tone(140, .05, 'square', 0, .08); },
      rollover() { tone(1568, .12, 'triangle', 0, .08); tone(2093, .15, 'triangle', .06, .07); },
      drop() { noise(.08, .4, 500); tone(110, .1, 'sine', 0, .15); },
      wall(v) { if (v < 250 || !lim('w', 60)) return; noise(.03, Math.min(.12, v / 6000), 3500, 'highpass'); },
      ramp() { tone(300, .5, 'sawtooth', 0, .06, 3); noise(.5, .1, 1200, 'bandpass'); },
      rampDone() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, .12, 'square', i * .06, .06)); },
      saucer() { tone(80, .2, 'sine', 0, .25, .5); noise(.15, .3, 400); },
      kick() { noise(.1, .5, 700); tone(150, .1, 'square', 0, .1, .5); },
      plunger(p) { noise(.15, .3 + p * .3, 600); tone(200 + p * 300, .25, 'triangle', 0, .1, 2); },
      drain() { [523, 392, 330, 262, 196].forEach((f, i) => tone(f, .25, 'triangle', i * .14, .1)); },
      jackpot() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, .14, 'square', i * .08, .07)); noise(1.2, .15, 1500, 'bandpass', .2); },
      lane() { [1047, 1319, 1568].forEach((f, i) => tone(f, .1, 'triangle', i * .07, .07)); },
      start() { [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, .14, 'square', i * .09, .07)); },
      saved() { [784, 659, 784, 1047].forEach((f, i) => tone(f, .12, 'triangle', i * .08, .08)); }
    };
    function say(t) { if (!soundOn || !('speechSynthesis' in window)) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'he-IL'; u.pitch = 1.3; u.rate = 1.1; speechSynthesis.speak(u); } catch {} }

    // ---------- Canvas ----------
    const canvas = $('game'), ctx = canvas.getContext('2d');
    function fit() {
      const wrap = $('wrap'), bw = wrap.clientWidth - 16, bh = wrap.clientHeight - 16, sc = Math.min(bw / W, bh / H);
      const cw = Math.floor(W * sc), ch = Math.floor(H * sc);
      canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px'; canvas.width = Math.round(cw * DPR); canvas.height = Math.round(ch * DPR);
      document.querySelectorAll('.overlay').forEach(o => { o.style.width = cw + 'px'; o.style.height = ch + 'px'; });
    }
    addEventListener('resize', fit);

    // ---------- Playfield art, painted once ----------
    const art = document.createElement('canvas'); art.width = W * 2; art.height = H * 2;
    function creature(c, x, y, s, cr, mood = 1) {
      // our own cute creatures: a round body, ears or leaves or flames, big shiny eyes
      c.save(); c.translate(x, y); c.scale(s, s);
      const shade = (col, a) => { const n = parseInt(col.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; const t = a < 0 ? 0 : 255, p = Math.abs(a); return `rgb(${Math.round((t - r) * p + r)},${Math.round((t - g) * p + g)},${Math.round((t - b) * p + b)})`; };
      if (cr.kind === 'zap') { c.fillStyle = shade(cr.col, -0.1); for (const sd of [-1, 1]) { c.beginPath(); c.moveTo(sd * 8, -14); c.lineTo(sd * 20, -34); c.lineTo(sd * 15, -12); c.closePath(); c.fill(); } c.fillStyle = '#343a40'; for (const sd of [-1, 1]) { c.beginPath(); c.moveTo(sd * 17, -29); c.lineTo(sd * 20, -34); c.lineTo(sd * 15, -30); c.fill(); } }
      if (cr.kind === 'water') { c.fillStyle = shade(cr.col, 0.3); c.beginPath(); c.moveTo(-6, -18); c.quadraticCurveTo(0, -36, 6, -18); c.fill(); }
      if (cr.kind === 'leaf') { c.fillStyle = '#2b8a3e'; c.beginPath(); c.ellipse(-10, -20, 6, 12, -0.6, 0, TAU); c.ellipse(10, -20, 6, 12, 0.6, 0, TAU); c.fill(); }
      if (cr.kind === 'fire') { const fg = c.createLinearGradient(0, -36, 0, -14); fg.addColorStop(0, '#ffe066'); fg.addColorStop(1, '#f03e3e'); c.fillStyle = fg; c.beginPath(); c.moveTo(-10, -14); c.quadraticCurveTo(-12, -30, -2, -38); c.quadraticCurveTo(-2, -26, 4, -30); c.quadraticCurveTo(12, -24, 10, -14); c.fill(); }
      const g = c.createRadialGradient(-6, -8, 2, 0, 0, 22); g.addColorStop(0, shade(cr.col, 0.45)); g.addColorStop(1, shade(cr.col, -0.25));
      c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, 20, 18, 0, 0, TAU); c.fill();
      c.strokeStyle = shade(cr.col, -0.45); c.lineWidth = 1.5; c.stroke();
      c.fillStyle = shade(cr.col, 0.35); c.beginPath(); c.ellipse(0, 8, 11, 7, 0, 0, TAU); c.fill();
      for (const sd of [-1, 1]) { c.fillStyle = '#fff'; c.beginPath(); c.ellipse(sd * 7, -3, 5.5, 6.5, 0, 0, TAU); c.fill(); c.fillStyle = '#1b1b1b'; c.beginPath(); c.arc(sd * 7 + 1, -2, 3.4, 0, TAU); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(sd * 7 + 2.2, -3.6, 1.3, 0, TAU); c.fill(); }
      c.fillStyle = 'rgba(255,100,120,0.55)'; for (const sd of [-1, 1]) { c.beginPath(); c.ellipse(sd * 13, 5, 3.5, 2.2, 0, 0, TAU); c.fill(); }
      c.strokeStyle = '#5c1a1a'; c.lineWidth = 1.6; c.lineCap = 'round'; c.beginPath(); c.arc(0, 4, 4, 0.2, Math.PI - 0.2); c.stroke();
      c.restore();
    }
    function paintArt() {
      const c = art.getContext('2d'); c.scale(2, 2);
      // the wooden cabinet edge and the playfield base
      c.fillStyle = '#1a1030'; c.fillRect(0, 0, W, H);
      c.save(); c.beginPath(); c.moveTo(346, 650); arc.forEach(([x, y]) => c.lineTo(x, y)); c.lineTo(12, 650); c.closePath(); c.clip();
      const base = c.createLinearGradient(0, 40, 0, H); base.addColorStop(0, '#1c3f8f'); base.addColorStop(0.5, '#2b1c6e'); base.addColorStop(1, '#3a1450');
      c.fillStyle = base; c.fillRect(0, 0, W, H);
      // painted regions: a forest on the left, a volcano on the right, the sea in the middle
      const forest = c.createLinearGradient(0, 0, 120, 0); forest.addColorStop(0, '#1b5e20'); forest.addColorStop(1, 'rgba(46,125,50,0)');
      c.fillStyle = forest; c.fillRect(0, 60, 130, 420);
      const lava = c.createLinearGradient(W, 0, 220, 0); lava.addColorStop(0, '#bf360c'); lava.addColorStop(1, 'rgba(230,81,0,0)');
      c.fillStyle = lava; c.fillRect(220, 60, 140, 420);
      for (let k = 0; k < 9; k++) { c.fillStyle = `rgba(56,142,60,${0.35 + (k % 3) * 0.1})`; c.beginPath(); c.arc(20 + (k * 37) % 100, 120 + k * 42, 16 + (k % 3) * 5, 0, TAU); c.fill(); }
      for (let k = 0; k < 7; k++) { c.fillStyle = `rgba(255,${120 + k * 12},40,0.25)`; c.beginPath(); c.moveTo(250 + (k * 23) % 80, 480 - k * 50); c.lineTo(270 + (k * 23) % 80, 440 - k * 50); c.lineTo(290 + (k * 23) % 80, 480 - k * 50); c.fill(); }
      // stars sprinkled around
      for (let k = 0; k < 60; k++) { c.fillStyle = 'rgba(255,255,255,0.5)'; c.beginPath(); c.arc((k * 97) % W, 60 + (k * 53) % 400, (k % 3) * 0.6 + 0.4, 0, TAU); c.fill(); }
      // the big round center: a map circle with the four creatures
      const cx = 172, cy = 440;
      const rg = c.createRadialGradient(cx, cy, 10, cx, cy, 95); rg.addColorStop(0, '#74c0fc'); rg.addColorStop(0.7, '#1971c2'); rg.addColorStop(1, '#0b3d75');
      c.fillStyle = rg; c.beginPath(); c.arc(cx, cy, 92, 0, TAU); c.fill();
      c.strokeStyle = '#ffd43b'; c.lineWidth = 6; c.stroke(); c.strokeStyle = '#e8590c'; c.lineWidth = 2; c.beginPath(); c.arc(cx, cy, 96, 0, TAU); c.stroke();
      c.fillStyle = 'rgba(105,219,124,0.6)'; c.beginPath(); c.ellipse(cx - 30, cy - 20, 34, 18, 0.3, 0, TAU); c.ellipse(cx + 35, cy + 25, 30, 16, -0.2, 0, TAU); c.fill();
      CREATURES.forEach((cr, i) => creature(c, cx + [-38, 38, -40, 40][i], cy + [-30, -30, 32, 32][i], 0.9, cr));
      // title on the apron area above the flippers
      c.font = 'bold 15px "Comic Sans MS", sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.lineWidth = 4; c.strokeStyle = '#7a1f00'; c.strokeText('פינבול היצורים', cx, cy + 2); c.fillStyle = '#ffd43b'; c.fillText('פינבול היצורים', cx, cy + 2);
      // the bumper area: a pond of light
      const pg = c.createRadialGradient(172, 205, 10, 172, 205, 80); pg.addColorStop(0, 'rgba(255,212,59,0.35)'); pg.addColorStop(1, 'rgba(255,212,59,0)');
      c.fillStyle = pg; c.beginPath(); c.arc(172, 205, 80, 0, TAU); c.fill();
      // flipper area paint
      c.fillStyle = '#c92a2a'; c.beginPath(); c.moveTo(36, 507); c.lineTo(104, 557); c.lineTo(120, 650); c.lineTo(12, 650); c.lineTo(12, 505); c.fill();
      c.beginPath(); c.moveTo(304, 507); c.lineTo(236, 557); c.lineTo(220, 650); c.lineTo(322, 650); c.lineTo(322, 505); c.fill();
      c.fillStyle = '#1b1b2e'; c.beginPath(); c.moveTo(104, 557); c.lineTo(236, 557); c.lineTo(250, 650); c.lineTo(90, 650); c.fill();
      // plunger lane metal
      const lane = c.createLinearGradient(322, 0, 346, 0); lane.addColorStop(0, '#495057'); lane.addColorStop(0.5, '#adb5bd'); lane.addColorStop(1, '#495057');
      c.fillStyle = lane; c.fillRect(323, 240, 23, 420);
      c.restore();
      // chrome side rails
      for (const x of [6, 352]) { const g = c.createLinearGradient(x - 4, 0, x + 4, 0); g.addColorStop(0, '#495057'); g.addColorStop(0.5, '#f1f3f5'); g.addColorStop(1, '#495057'); c.fillStyle = g; c.fillRect(x - 4, 44, 8, H); }
    }

    // ---------- Lamps (inserts in the playfield) ----------

      shape(1.5); ctx.fillStyle = '#c92a2a'; ctx.fill();               // red rubber
      shape(-0.5); const g = ctx.createLinearGradient(f.x - px * 8, f.y - py * 8, f.x + px * 8, f.y + py * 8); g.addColorStop(0, '#f59f00'); g.addColorStop(0.5, '#ffe066'); g.addColorStop(1, '#e67700'); ctx.fillStyle = g; ctx.fill();
      ctx.fillStyle = '#adb5bd'; ctx.beginPath(); ctx.arc(f.x, f.y, 3.5, 0, TAU); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(f.x - 1, f.y - 1, 1.2, 0, TAU); ctx.fill();
    }
    function drawBall(b, lift = 0) {
      const r = BR * (1 + lift * 0.35);
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(b.x + 3 + lift * 8, b.y + 4 + lift * 10, r, r * 0.8, 0, 0, TAU); ctx.fill();
      // shiny chrome with the colours of the table reflected in it
      const g = ctx.createRadialGradient(b.x - r * 0.35, b.y - r * 0.4, 0.5, b.x, b.y, r);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, '#dee2e6'); g.addColorStop(0.75, '#6c757d'); g.addColorStop(1, '#212529');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(77,171,247,0.45)'; ctx.beginPath(); ctx.ellipse(b.x + r * 0.2, b.y + r * 0.45, r * 0.55, r * 0.22, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,146,43,0.35)'; ctx.beginPath(); ctx.ellipse(b.x - r * 0.45, b.y + r * 0.2, r * 0.2, r * 0.35, 0.4, 0, TAU); ctx.fill();
    }
    function drawRamp(r) {
      const P = r.path;
      const line = (w, col) => { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); P.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); };
      ctx.save(); ctx.translate(4, 6); line(20, 'rgba(0,0,0,0.25)'); ctx.restore();       // shadow on the playfield
      line(20, r.col + '55');                                                               // clear coloured plastic
      line(14, 'rgba(255,255,255,0.12)');
      // metal side rails
      ctx.save(); ctx.translate(-8, 0); line(1.6, 'rgba(230,230,240,0.85)'); ctx.restore();
      ctx.save(); ctx.translate(8, 0); line(1.6, 'rgba(230,230,240,0.85)'); ctx.restore();
      line(2, 'rgba(255,255,255,0.4)');
    }
    function drawDMD() {
      // a dot-matrix display: the text is drawn small, then shown as round orange dots
      const cols = 120, rows = 16;
      dmdCtx.fillStyle = '#000'; dmdCtx.fillRect(0, 0, cols, rows);
      dmdCtx.fillStyle = '#fff'; dmdCtx.textAlign = 'center'; dmdCtx.textBaseline = 'middle';
      if (state === 'attract') { dmdCtx.font = 'bold 9px Arial'; dmdCtx.fillText(Math.floor(time * 0.5) % 2 ? 'פינבול היצורים' : `שיא ${best.toLocaleString()}`, cols / 2, 8); }
      else if (dmdMsg && dmdT > 0) { dmdCtx.font = 'bold 8px Arial'; dmdCtx.fillText(dmdMsg.a, cols / 2, 4.5); dmdCtx.font = '7px Arial'; dmdCtx.fillText(dmdMsg.b, cols / 2, 12); }
      else { dmdCtx.font = 'bold 10px Arial'; dmdCtx.fillText(score.toLocaleString(), cols / 2, 6.5); dmdCtx.font = '6px Arial'; dmdCtx.fillText(`כדור ${Math.min(3, ballNo)}   ×${bonusX}`, cols / 2, 13.5); }
      const img = dmdCtx.getImageData(0, 0, cols, rows).data;
      ctx.fillStyle = '#0b0705'; ctx.fillRect(0, 0, W, DMD_H);
      const cw = (W - 16) / cols, ch = (DMD_H - 8) / rows, x0 = 8, y0 = 4;
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        const v = img[(y * cols + x) * 4] / 255;
        ctx.fillStyle = v > 0.35 ? `rgba(255,${120 + v * 60},20,${0.35 + v * 0.65})` : 'rgba(255,120,20,0.08)';
        ctx.beginPath(); ctx.arc(x0 + x * cw + cw / 2, y0 + y * ch + ch / 2, Math.min(cw, ch) * 0.42, 0, TAU); ctx.fill();
      }
      ctx.strokeStyle = '#343a40'; ctx.lineWidth = 2; ctx.strokeRect(1, 1, W - 2, DMD_H - 2);
    }
    const dmdCv = document.createElement('canvas'); dmdCv.width = 120; dmdCv.height = 16; const dmdCtx = dmdCv.getContext('2d', { willReadFrequently: true }); dmdCtx.direction = 'rtl';

    function render() {
      const k = canvas.width / W; ctx.setTransform(k, 0, 0, k, 0, 0);
      ctx.save(); if (shake > 0) ctx.translate(rnd(-2, 2) * shake * 10, rnd(-2, 2) * shake * 10);
      ctx.drawImage(art, 0, 0, W, H);
      // general illumination: soft lights flicker a little, like real bulbs
      for (const L2 of LAMPS) drawLamp(L2);
      // top lanes
      for (const l of LANES) { ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(l.x - 9, l.y - 14, 18, 28); }
      // drop targets
      for (const d of DROPS) {
        if (d.down) continue;
        const g = ctx.createLinearGradient(d.x - 6, 0, d.x + 4, 0); g.addColorStop(0, '#c92a2a'); g.addColorStop(1, '#ff8787');
        ctx.fillStyle = g; ctx.fillRect(d.x - 6, d.y + 1, 9, d.h - 2); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(d.x - 6, d.y + 1, 9, d.h - 2);
        ctx.fillStyle = '#ffd43b'; ctx.beginPath(); ctx.arc(d.x - 1.5, d.y + d.h / 2, 2.5, 0, TAU); ctx.fill();
      }
      // the cave (saucer)
      const sg = ctx.createRadialGradient(SAUCER.x, SAUCER.y, 2, SAUCER.x, SAUCER.y, 16); sg.addColorStop(0, '#000'); sg.addColorStop(0.7, '#212529'); sg.addColorStop(1, '#868e96');
      ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(SAUCER.x, SAUCER.y, 14, 0, TAU); ctx.fill();
      ctx.fillStyle = lockLit ? (Math.floor(time * 6) % 2 ? '#da77f2' : '#fff') : '#adb5bd'; ctx.font = 'bold 8px Arial'; ctx.textAlign = 'center'; ctx.fillText('מערה', SAUCER.x, SAUCER.y - 20);
      // walls: guides and posts in chrome and rubber
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (const w of WALLS.slice(1)) { ctx.strokeStyle = '#ced4da'; ctx.lineWidth = w.r * 2; ctx.beginPath(); w.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1; ctx.stroke(); }
      for (const p of POSTS) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); ctx.fillStyle = '#e03131'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r - 2, 0, TAU); ctx.fill(); }
      // outer wall line
      ctx.strokeStyle = '#adb5bd'; ctx.lineWidth = 4; ctx.beginPath(); WALLS[0].pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
      // lane gate
      ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(322, 238); ctx.lineTo(346, 212); ctx.stroke();
      SLINGS.forEach(drawSling);
      BUMPERS.forEach(drawBumper);
      // balls on the playfield
      for (const b of balls) if (!b.ramp && !b.gone) drawBall(b);
      flippers.forEach(drawFlipper);
      // plunger
      const py = 594 - plunge * 26;
      ctx.fillStyle = '#868e96'; ctx.fillRect(330, py, 8, 640 - py); ctx.fillStyle = '#e03131'; ctx.fillRect(326, py - 2, 16, 6);
      ctx.strokeStyle = '#ced4da'; ctx.lineWidth = 1.5; for (let y = py + 8; y < 636; y += 5) { ctx.beginPath(); ctx.moveTo(328, y); ctx.lineTo(340, y + 2.5); ctx.stroke(); }
      // ramps above everything, with balls riding them
      RAMPS.forEach(drawRamp);
      for (const b of balls) if (b.ramp) drawBall(b, Math.sin(Math.min(1, b.ramp.t) * Math.PI));
      // apron
      ctx.fillStyle = '#c92a2a'; ctx.beginPath(); ctx.moveTo(12, 610); ctx.lineTo(120, 600); ctx.lineTo(120, 640); ctx.lineTo(12, 640); ctx.fill(); ctx.beginPath(); ctx.moveTo(322, 610); ctx.lineTo(220, 600); ctx.lineTo(220, 640); ctx.lineTo(322, 640); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 8px Arial'; ctx.textAlign = 'center'; ctx.fillText('פינבול', 60, 624); ctx.fillText('היצורים', 270, 624);
      // glass reflection
      const gl = ctx.createLinearGradient(0, 0, W, H); gl.addColorStop(0, 'rgba(255,255,255,0)'); gl.addColorStop(0.45, 'rgba(255,255,255,0.06)'); gl.addColorStop(0.5, 'rgba(255,255,255,0)');
      ctx.fillStyle = gl; ctx.fillRect(0, DMD_H, W, H);
      ctx.restore();
      drawDMD();
      // lights around the score when something big happens
      if (dmdT > 0 && dmdMsg && /ג׳קפוט|מולטיבול/.test(dmdMsg.a)) { ctx.fillStyle = `rgba(255,212,59,${0.15 + 0.15 * Math.sin(time * 20)})`; ctx.fillRect(0, DMD_H, W, H); }
    }

    // ---------- Controls: tap the left or right side, hold launch ----------
    function flip(side, on) {
      const f = flippers[side < 0 ? 0 : 1];
      if (on && !f.on) sfx.flipper();
      f.on = on;
      // flipper buttons also move the lit top-lane letters (lane change)
      if (on && state === 'play') { const lit = LANES.map(l => l.lit); if (side < 0) lit.push(lit.shift()); else lit.unshift(lit.pop()); LANES.forEach((l, i) => l.lit = lit[i]); refreshLamps(); }
    }
    function plungeStart() { if (state !== 'play') return; plungeHeld = true; }
    function plungeEnd() {
      if (!plungeHeld) return; plungeHeld = false;
      const b = balls.find(x => x.inLane && x.y > 560);
      if (b) { b.vy = -(950 + plunge * 1150); sfx.plunger(plunge); if (saveT === 0 && !b.saveGiven) { saveT = 10; b.saveGiven = true; refreshLamps(); } }
      plunge = 0;
    }
    const press = (id, down, up) => { const el = $(id); el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('down'); try { el.setPointerCapture(e.pointerId); } catch {} down(); }); ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => el.addEventListener(t, () => { if (el.classList.contains('down')) { el.classList.remove('down'); up && up(); } })); };
    press('leftBtn', () => flip(-1, true), () => flip(-1, false));
    press('rightBtn', () => flip(1, true), () => flip(1, false));
    press('launchBtn', plungeStart, plungeEnd);
    // touching the table: left half / right half; dragging down on the plunger pulls it
    const touches = new Map();
    canvas.addEventListener('pointerdown', e => {
      e.preventDefault(); if (state !== 'play') return;
      const r = canvas.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W;
      try { canvas.setPointerCapture(e.pointerId); } catch {}
      if (x > 318 && balls.some(b => b.inLane)) { touches.set(e.pointerId, 0); plungeStart(); return; }
      const side = x < W / 2 ? -1 : 1; touches.set(e.pointerId, side); flip(side, true);
    });
    const tEnd = e => { if (!touches.has(e.pointerId)) return; const side = touches.get(e.pointerId); touches.delete(e.pointerId); if (side === 0) plungeEnd(); else if (![...touches.values()].includes(side)) flip(side, false); };
    canvas.addEventListener('pointerup', tEnd); canvas.addEventListener('pointercancel', tEnd);
    const keys = { ArrowLeft: -1, z: -1, Z: -1, Shift: -1, ArrowRight: 1, '/': 1, m: 1, M: 1 };
    addEventListener('keydown', e => { if (e.repeat) return; if (keys[e.key]) flip(keys[e.key], true); if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowDown') { e.preventDefault(); plungeStart(); } });
    addEventListener('keyup', e => { if (keys[e.key]) flip(keys[e.key], false); if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowDown') plungeEnd(); });
    $('playBtn').addEventListener('click', startGame); $('againBtn').addEventListener('click', startGame);
    function updateSoundBtn() { $('soundBtn').innerHTML = `<b>${soundOn ? '🔊' : '🔇'}</b>`; }
    $('soundBtn').addEventListener('click', () => { soundOn = !soundOn; save('pinball-sound', soundOn); updateSoundBtn(); });
    $('best').textContent = best ? `🏆 שיא: ${best.toLocaleString()}` : '';

    // ---------- Main loop ----------
    let lastT = performance.now();
    function frame(now) { const dt = Math.min(1 / 30, (now - lastT) / 1000); lastT = now; update(Math.round(dt / DT) * DT || DT); render(); requestAnimationFrame(frame); }
    paintArt(); fit(); updateSoundBtn(); refreshLamps();
    // attract mode: lamps run in a pattern until someone presses start
    requestAnimationFrame(frame);
    window.__pin = { get s() { return { state, score, ballNo, balls: balls.map(b => ({ x: Math.round(b.x), y: Math.round(b.y), vx: Math.round(b.vx), vy: Math.round(b.vy), lane: b.inLane, ramp: !!b.ramp, held: b.held > 0 })), caught: caught.slice(), lockLit, locked, multiball, bonusX, drops: DROPS.map(d => d.down) }; },
      startGame, flip, plungeStart, plungeEnd, update, get balls() { return balls; }, newBall };
  </script>
  <script>
    (function () {
      let lastTouch = 0;
      document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastTouch < 350 && !e.target.closest('button, a')) e.preventDefault(); lastTouch = now; }, { passive: false });
      ['gesturestart', 'gesturechange', 'gestureend', 'dblclick'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
      document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
    })();
  </script>
</body>
