<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>בעיטות לשער</title>
  <style>
    html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
    button { touch-action: manipulation; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --ink: #1b2a3a; --soft: #5c6b7a; --btn: #2f9e44; --btn-dark: #1e6e2e; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      position: fixed; inset: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', Tahoma, Arial, sans-serif;
      background: linear-gradient(160deg, #1b4332 0%, #0b2618 100%);
      color: var(--ink);
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    .app {
      position: absolute; top: 44px; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 8px 4px 8px; overflow: hidden;
    }
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.25);
      display: flex; gap: 5px; padding: 6px 10px; z-index: 50;
    }
    nav a.home-link { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; font-size: 0.9rem; font-weight: 800;
      padding: 4px 16px; border-radius: 999px; background: #fff; color: #5a3fd1;
      box-shadow: 0 3px 0 rgba(0,0,0,0.18); text-decoration: none; white-space: nowrap; }
    .board-wrap {
      position: relative; flex: 1 1 auto; min-height: 260px;
      width: min(calc(100vw - 8px), 760px);
      display: flex; align-items: center; justify-content: center;
    }
    canvas#game {
      display: block; border-radius: 16px; touch-action: none;
      box-shadow: 0 0 0 4px #fff, 0 10px 0 4px rgba(0,0,0,0.25), 0 18px 30px rgba(0,0,0,0.4);
    }
    .overlay {
      position: absolute; inset: 0; margin: auto; border-radius: 16px;
      background: radial-gradient(circle at 50% 30%, #2b8a3e 0%, #0f3d22 80%); color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: safe center;
      text-align: center; padding: 10px; gap: 9px; overflow-y: auto; z-index: 5;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: clamp(1.2rem, 5.4vw, 1.8rem); text-shadow: 0 2px 0 rgba(0,0,0,0.3); }
    .overlay p { color: rgba(255,255,255,0.85); font-size: clamp(0.8rem, 3.4vw, 1rem); max-width: 340px; }
    .big { font-size: clamp(2.4rem, 11vw, 3.8rem); animation: hop 1.2s infinite; }
    @keyframes hop { 50% { transform: translateY(-6px) rotate(-8deg); } }
    .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
    .play-btn {
      border: none; background: #ffd43b; color: #5c3c00; font: inherit; font-size: 1.15rem; font-weight: bold;
      padding: 8px 26px; border-radius: 999px; cursor: pointer; box-shadow: 0 5px 0 #c99a00;
    }
    .play-btn.alt { background: #fff; color: var(--ink); box-shadow: 0 5px 0 #adb5bd; }
    .play-btn:active { transform: translateY(3px); }
    .bank { font-weight: bold; background: rgba(255,212,59,0.2); color: #ffe066; border-radius: 999px; padding: 3px 14px; }
    .tabs { display: flex; gap: 6px; }
    .tabs button { border: none; background: rgba(255,255,255,0.15); color: #fff; border-radius: 999px; padding: 5px 14px; font: inherit; font-weight: bold; cursor: pointer; }
    .tabs button.on { background: #fff; color: var(--ink); }
    .pane.hidden { display: none; }
    .stages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; width: 100%; max-width: 340px; }
    .stage {
      border: 3px solid transparent; border-radius: 14px; background: rgba(255,255,255,0.14); color: #fff;
      font: inherit; padding: 6px 2px; cursor: pointer; line-height: 1.15;
    }
    .stage b { display: block; font-size: 1.5rem; }
    .stage span { font-size: 0.7rem; display: block; }
    .stage small { font-size: 0.65rem; letter-spacing: -1px; }
    .stage.on { border-color: #ffd43b; background: rgba(255,255,255,0.25); }
    .stage.locked { opacity: 0.45; }
    .shop { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; width: 100%; max-width: 340px; }
    .item { border: 3px solid transparent; border-radius: 14px; background: rgba(255,255,255,0.14); color: #fff; font: inherit; padding: 6px 2px; cursor: pointer; }
    .item canvas { width: 46px; height: 46px; display: block; margin: 0 auto 2px; }
    .team { grid-template-columns: repeat(4, 1fr); }
    .team .item canvas { width: 54px; height: 72px; }
    .team .item { padding: 4px 1px; }
    .item span { font-size: 0.72rem; display: block; }
    .item.on { border-color: #ffd43b; background: rgba(255,255,255,0.25); }
    .trophies { font-size: 1.4rem; letter-spacing: 2px; min-height: 1.6rem; }
    .stars3 { font-size: clamp(2rem, 9vw, 2.8rem); letter-spacing: 4px; }
    .stars3 .off { filter: grayscale(1); opacity: 0.3; }

    .panel { width: min(calc(100vw - 8px), 560px); display: flex; flex-direction: column; gap: 6px; flex: none; }
    .coach { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 4px; }
    .coach .face { font-size: 1.4rem; }
    .bubble { flex: 1; font-size: clamp(0.76rem, 3.2vw, 0.92rem); line-height: 1.2; overflow: hidden; color: #fff; }
    .bubble span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .buttons button {
      border: none; border-radius: 14px; background: #fff; color: var(--ink); font: inherit; font-size: 0.78rem;
      height: 50px; box-shadow: 0 4px 0 rgba(0,0,0,0.3); cursor: pointer; line-height: 1.1;
    }
    .buttons button b { display: block; font-size: 1.3rem; }
    .buttons button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.3); }
    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
  </style>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="משחקים" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#7c5cff" />
  <script src="app.js" defer></script>
</head>
<body>
  <nav dir="rtl"><a class="home-link" href="index.html">🏠 כל המשחקים</a></nav>

  <div class="app">
    <div class="board-wrap" id="wrap">
      <canvas id="game"></canvas>

      <div dir="rtl" class="overlay" id="menu">
        <h2>⚽ בעיטות לשער</h2>
        <div class="bank">🪙 <span id="coins">0</span></div>
        <div class="tabs"><button id="tabStages" class="on">🏟️ שלבים</button><button id="tabTeam">👕 שחקנים</button><button id="tabShop">⚽ כדורים</button></div>
        <div class="pane" id="stagesPane"><div class="stages" id="stages"></div></div>
        <div class="pane hidden" id="teamPane"><div class="shop team" id="team"></div></div>
        <div class="pane hidden" id="shopPane"><div class="shop" id="shop"></div></div>
        <button class="play-btn" id="playBtn">▶ לבעוט!</button>
        <div class="trophies" id="trophies"></div>
      </div>

      <div dir="rtl" class="overlay hidden" id="result">
        <div class="stars3" id="resStars"></div>
        <h2 id="resTitle"></h2>
        <p id="resText"></p>
        <div class="row">
          <button class="play-btn" id="nextBtn">▶ לשלב הבא</button>
          <button class="play-btn alt" id="retryBtn">🔁 שוב</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="coach" dir="rtl"><div class="face" id="face">⚽</div><div class="bubble" id="bubble"><span>החליקו את האצבע מהכדור אל השער!</span></div></div>
      <div class="buttons" dir="rtl">
        <button id="menuBtn"><b>🏟️</b>שלבים</button>
        <button id="restartBtn"><b>🔄</b>מחדש</button>
        <button id="soundBtn"><b>🔊</b>צליל</button>
      </div>
    </div>
  </div>
  <canvas id="confetti"></canvas>

  <script>
    // ---------- World (meters): x right, y up, z toward the goal ----------
    const W = 360, H = 600, TAU = Math.PI * 2, G = 9.8;
    const GZ = 11, GW2 = 3.66, GH = 2.44, BR = 0.11, KZ = 10.6, HOR = 222;
    const DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    const $ = id => document.getElementById(id);
    const rnd = (a, b) => a + Math.random() * (b - a);
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    // keeper: reaction delay, speed, how often he guesses the right side
    const STAGES = [
      { name: 'אימון', icon: '🥅', ballZ: 0, ballX: 0, rd: 0.4, kv: 3.4, pr: 0.35, tip: 'החליקו את האצבע מהכדור אל השער! בעטו לפינות ⚽' },
      { name: 'שכונה', icon: '🏘️', ballZ: 0, ballX: 0, rd: 0.32, kv: 4.4, pr: 0.5, tip: 'השוער כבר זריז יותר. כוונו רחוק ממנו!' },
      { name: 'ליגה', icon: '🏟️', ballZ: 0, ballX: 0, rd: 0.26, kv: 5.4, pr: 0.6, tip: 'בעיטה מהירה = החלקה מהירה ⚡' },
      { name: 'בעיטה חופשית', icon: '🧱', ballZ: -8, ballX: -2.2, wall: 3, rd: 0.3, kv: 5, pr: 0.5, tip: 'יש חומה! סובבו את הכדור מסביב, או הרימו מעליה 🌀' },
      { name: 'חצי גמר', icon: '🔥', ballZ: 0, ballX: 0, rd: 0.2, kv: 6.4, pr: 0.7, tip: 'שוער אלוף! החלקה מעוקלת מסובבת את הכדור ומבלבלת אותו 🌀' },
      { name: 'הגמר', icon: '🏆', ballZ: -8, ballX: 2.4, wall: 3, rd: 0.22, kv: 6.4, pr: 0.65, tip: 'הגמר הגדול! חומה ושוער אלוף. בהצלחה! 🏆' }
    ];
    // players: national-team colours, number and name on the back (no club badges)
    const PLAYERS = [
      { id: 'messi', name: 'מסי', num: 10, price: 0, shirt: 'stripes', c1: '#74c0fc', c2: '#ffffff', shorts: '#1b1b1b', socks: '#ffffff', skin: '#e8b48a', hair: '#5c3c1e', style: 'short', text: '#1b1b1b' },
      { id: 'ronaldo', name: 'רונאלדו', num: 7, price: 0, shirt: 'solid', c1: '#c92a2a', c2: '#2b8a3e', shorts: '#2b8a3e', socks: '#c92a2a', skin: '#d9a07a', hair: '#1b1b1b', style: 'gel', text: '#ffd43b' },
      { id: 'zahavi', name: 'זהבי', num: 7, price: 0, shirt: 'solid', c1: '#ffffff', c2: '#1c7ed6', shorts: '#ffffff', socks: '#1c7ed6', skin: '#e3b088', hair: '#2b2b2b', style: 'short', text: '#1c7ed6' },
      { id: 'neymar', name: 'נימאר', num: 10, price: 100, shirt: 'solid', c1: '#ffd43b', c2: '#2b8a3e', shorts: '#1c4ed8', socks: '#ffffff', skin: '#c68a5e', hair: '#e9c46a', style: 'mohawk', text: '#2b8a3e' },
      { id: 'mbappe', name: 'אמבפה', num: 10, price: 180, shirt: 'solid', c1: '#1e3a8a', c2: '#ffffff', shorts: '#ffffff', socks: '#c92a2a', skin: '#8d5524', hair: '#1b1b1b', style: 'bald', text: '#ffffff' },
      { id: 'haaland', name: 'הולאנד', num: 9, price: 260, shirt: 'solid', c1: '#d6202f', c2: '#1e3a8a', shorts: '#ffffff', socks: '#1e3a8a', skin: '#f1c9a5', hair: '#f4d35e', style: 'bun', text: '#ffffff' },
      { id: 'salah', name: 'סלאח', num: 11, price: 350, shirt: 'solid', c1: '#c92a2a', c2: '#ffffff', shorts: '#ffffff', socks: '#1b1b1b', skin: '#a8724c', hair: '#1b1b1b', style: 'curly', text: '#ffffff' },
      { id: 'yamal', name: 'ימאל', num: 19, price: 450, shirt: 'solid', c1: '#c1121f', c2: '#ffd43b', shorts: '#1e3a8a', socks: '#1e3a8a', skin: '#a0673f', hair: '#1b1b1b', style: 'curly', text: '#ffd43b' }
    ];
    const BALLS = [
      { id: 'classic', name: 'קלאסי', price: 0 },
      { id: 'gold', name: 'זהב', price: 80 },
      { id: 'fire', name: 'אש', price: 160, trail: 'fire' },
      { id: 'rainbow', name: 'קשת', price: 260, trail: 'rainbow' },
      { id: 'star', name: 'כוכבים', price: 400, trail: 'star' },
      { id: 'earth', name: 'כדור הארץ', price: 600 }
    ];

    // ---------- Saved progress ----------
    function load(key, def) { try { const v = localStorage.getItem(key); return v === null ? def : JSON.parse(v); } catch { return def; } }
    function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch {} }
    let prog = load('soccer-progress', null) || {};
    prog = { unlocked: prog.unlocked || 1, stars: prog.stars || [], coins: prog.coins || 0, owned: prog.owned || ['classic'], ball: prog.ball || 'classic', best: prog.best || 0, team: prog.team || ['messi', 'ronaldo', 'zahavi'], player: prog.player || 'messi' };
    const player = () => PLAYERS.find(p => p.id === prog.player) || PLAYERS[0];
    const saveProg = () => save('soccer-progress', prog);
    let soundOn = load('soccer-sound', true), chosen = Math.min(prog.unlocked, STAGES.length) - 1;

    // ---------- Sound ----------
    let audio = null;
    function ac() { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); return audio; }
    function tone(freq, dur = 0.1, type = 'sine', when = 0, vol = 0.12, slide = 0) {
      if (!soundOn) return;
      try {
        const a = ac(), t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
      } catch {}
    }
    // crowd noise: filtered noise that swells and fades
    function crowd(dur = 1.6, vol = 0.25, freq = 900) {
      if (!soundOn) return;
      try {
        const a = ac(), n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < n; i++) { const t = i / n; d[i] = (Math.random() * 2 - 1) * Math.min(1, t * 6) * (1 - t) ** 1.5; }
        const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
        f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.7; g.gain.value = vol;
        s.buffer = buf; s.connect(f).connect(g).connect(a.destination); s.start();
      } catch {}
    }
    const sfx = {
      kick()    { tone(110, .12, 'sine', 0, .3, .5); crowd(.15, .2, 2500); },
      net()     { crowd(.35, .25, 3000); },
      goal()    { crowd(2.4, .45, 800); [523, 659, 784, 1047].forEach((f, i) => tone(f, .2, 'triangle', .1 + i * .1, .1)); },
      save()    { tone(180, .08, 'square', 0, .1); crowd(1.2, .25, 500); },
      post()    { tone(1200, .5, 'triangle', 0, .12, .9); tone(1800, .4, 'sine', 0, .06, .95); crowd(1, .2, 600); },
      miss()    { crowd(1, .2, 450); tone(330, .3, 'triangle', 0, .08, .7); },
      whistle() { for (let k = 0; k < 2; k++) tone(2600, .18, 'sine', k * .22, .08, 1.05); },
      coin()    { tone(1318, .06, 'square', 0, .05); tone(1760, .1, 'square', .05, .05); }
    };
    function say(text) {
      if (!soundOn || !('speechSynthesis' in window)) return;
      try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'he-IL'; u.pitch = 1.25; u.rate = 1.1; speechSynthesis.speak(u); } catch {}
    }

    // ---------- Camera / projection ----------
    let camX = 0, camZ = -6, F = 461, camH = 2.3;
    function setCamera(ballX, ballZ) {
      const camDist = ballZ < -3 ? 7.5 : 6;
      camH = ballZ < -3 ? 2.2 : 2.3;
      camZ = ballZ - camDist; camX = ballZ < -3 ? ballX * 0.55 : -0.25;     // the whole goal stays in view
      F = 272 * (GZ - camZ) / 7.32;           // the goal always looks the same size
    }
    function P(x, y, z) { const d = Math.max(0.25, z - camZ), s = F / d; return { x: W / 2 + (x - camX) * s, y: HOR - (y - camH) * s, s }; }

    // ---------- Canvas ----------
    const canvas = $('game'), ctx = canvas.getContext('2d');
    function fit() {
      const wrap = $('wrap'), bw = wrap.clientWidth - 10, bh = wrap.clientHeight - 12;
      const scale = Math.min(bw / W, bh / H), cw = Math.floor(W * scale), ch = Math.floor(H * scale);
      canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
      canvas.width = Math.round(cw * DPR); canvas.height = Math.round(ch * DPR);
      document.querySelectorAll('.overlay').forEach(o => { o.style.width = cw + 'px'; o.style.height = ch + 'px'; });
    }
    addEventListener('resize', fit);
    // ---------- The crowd: tiered stands, painted once in two moods (sitting and cheering) ----------
    const CH = 270;                                    // logical height of the stands picture
    function shadeC(col, a) { const n = parseInt(col.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; const t = a < 0 ? 0 : 255, p = Math.abs(a); return `rgb(${Math.round((t - r) * p + r)},${Math.round((t - g) * p + g)},${Math.round((t - b) * p + b)})`; }
    function paintCrowd(cheering) {
      const cv = document.createElement('canvas'); cv.width = W * 2; cv.height = CH * 2;
      const c = cv.getContext('2d'); c.scale(2, 2);
      let seed = 12345; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      // concrete stands
      const bg = c.createLinearGradient(0, 0, 0, CH); bg.addColorStop(0, '#141a26'); bg.addColorStop(0.5, '#2a3446'); bg.addColorStop(1, '#3a465c');
      c.fillStyle = bg; c.fillRect(0, 0, W, CH);
      const shirts = ['#1c7ed6', '#1c7ed6', '#ffffff', '#ffffff', '#e03131', '#fcc419', '#2f9e44', '#f76707', '#ae3ec9', '#212529', '#e64980', '#74c0fc'];
      const skins = ['#f1c27d', '#e0ac69', '#c68642', '#8d5524', '#ffdbac', '#d9a07a'];
      const hairs = ['#1b1b1b', '#3b2412', '#6b4423', '#e9c46a', '#a0522d', '#555'];
      // rows from the back (top, small) to the front (bottom, big)
      let y = 4, row = 0;
      while (y < CH - 4) {
        const t = y / CH, u = 2.0 + t * 2.6, rowH = u * 3.1;
        // seat step
        c.fillStyle = `rgba(255,255,255,${0.04 + t * 0.05})`; c.fillRect(0, y + rowH - 1.2, W, 1.2);
        // a balcony wall with a small ad strip between the two tiers
        if (row === 9) {
          c.fillStyle = '#4a5568'; c.fillRect(0, y, W, 9);
          c.fillStyle = '#1864ab'; c.fillRect(0, y + 2, W, 5);
          c.fillStyle = '#fff'; c.font = 'bold 4.5px Arial'; c.textAlign = 'center'; c.textBaseline = 'middle';
          for (let x = 30; x < W; x += 90) c.fillText('⚽  GOAL  ⚽', x, y + 4.6);
          y += 10; row++; continue;
        }
        const step = u * 2.35;
        for (let x = (row % 2) * step / 2 - 2; x < W + 4; x += step * (0.92 + r() * 0.16)) {
          if (r() < 0.1) { c.fillStyle = '#2b6cb0'; c.fillRect(x - u * 0.9, y + u * 1.6, u * 1.8, u * 1.1); continue; }   // an empty blue seat
          const px = x + (r() - 0.5) * u * 0.4, base = y + rowH - 1.5, sh = shirts[Math.floor(r() * shirts.length)];
          const skin = skins[Math.floor(r() * skins.length)], hair = hairs[Math.floor(r() * hairs.length)];
          const jump = cheering ? u * (0.3 + r() * 0.5) : 0, hy = base - u * 2.55 - jump;
          // arms up when cheering
          if (cheering) {
            c.strokeStyle = skin; c.lineWidth = u * 0.42; c.lineCap = 'round';
            const spread = 0.5 + r() * 0.5;
            c.beginPath(); c.moveTo(px - u * 0.75, hy + u * 1.45); c.lineTo(px - u * (1 + spread), hy - u * 0.5); c.moveTo(px + u * 0.75, hy + u * 1.45); c.lineTo(px + u * (1 + spread), hy - u * 0.5); c.stroke();
          }
          // body with a little shading
          const bgr = c.createLinearGradient(px - u, 0, px + u, 0); bgr.addColorStop(0, shadeC(sh, -0.35)); bgr.addColorStop(0.45, sh); bgr.addColorStop(1, shadeC(sh, -0.4));

    function drawKicker() {

      else if (kicker.phase === 'run') { const ph = t * 16; pose.legL = Math.max(0, Math.sin(ph)) * 0.9; pose.legR = Math.max(0, -Math.sin(ph)) * 0.9; pose.bob = Math.abs(Math.sin(ph)) * 0.05; pose.lean = 0.08; pose.swing = Math.sin(ph) * 0.4; }

      // depth order: goal & keeper (far), then the wall, then the ball when it is in front of them
      const b = ball;

      drawGoal();

        drawTarget();

        else { drawWall(); if (!ballFar && b) drawBall(); }

    $('restartBtn').addEventListener('click', () => { if (S) startStage(stIdx); });
    function updateSoundBtn() { $('soundBtn').innerHTML = `<b>${soundOn ? '🔊' : '🔇'}</b>צליל`; }
    $('soundBtn').addEventListener('click', () => { soundOn = !soundOn; save('soccer-sound', soundOn); updateSoundBtn(); });

    // ---------- Confetti ----------
    const cc = $('confetti'), cctx = cc.getContext('2d');
    let bits = [], confettiRunning = false;
    const COLORS = ['#ff5f6d', '#ff9a3c', '#ffd23f', '#5fd068', '#3fa9f5', '#7c5cff', '#e45bd8'];
    function sizeConfetti() { cc.width = innerWidth; cc.height = innerHeight; }
    addEventListener('resize', sizeConfetti); sizeConfetti();
    function confetti(n) {
      for (let i = 0; i < n; i++) bits.push({ x: Math.random() * cc.width, y: -20 - Math.random() * cc.height * 0.3, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3, s: 6 + Math.random() * 6, c: COLORS[i % COLORS.length] });
      if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(confettiLoop); }
    }
    function confettiLoop() {
      cctx.clearRect(0, 0, cc.width, cc.height);
      bits = bits.filter(b => b.y < cc.height + 20);
      for (const b of bits) { b.x += b.vx; b.y += b.vy; b.r += b.vr; cctx.save(); cctx.translate(b.x, b.y); cctx.rotate(b.r); cctx.fillStyle = b.c; cctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); cctx.restore(); }
      if (bits.length) requestAnimationFrame(confettiLoop); else { confettiRunning = false; cctx.clearRect(0, 0, cc.width, cc.height); }
    }

    // ---------- Main loop ----------
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      update(dt);
      if (net) net.t += dt;
      render();
      requestAnimationFrame(frame);
    }
    fit(); updateSoundBtn(); showMenu();
    requestAnimationFrame(frame);
    window.__soccer = { get s() { return { state, kicks, results: results && results.slice(), score, outcome, keeper: keeper && { x: +keeper.x.toFixed(2), rot: +keeper.rot.toFixed(2) } }; }, startStage, shootAt, update, get kickX() { return kickX; }, get wallN() { return wall ? wall.n : 0; }, get prog() { return prog; }, P, get ball() { return ball; } };
  </script>
  <script>
    (function () {
      let lastTouch = 0;
      document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastTouch < 350 && !e.target.closest('button, a')) e.preventDefault(); lastTouch = now; }, { passive: false });
      ['gesturestart', 'gesturechange', 'gestureend', 'dblclick'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
      document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
    })();
  </script>
</body>
