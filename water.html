<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>מים לדגי</title>
  <style>
    html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
    button { touch-action: manipulation; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --ink: #12355b; --soft: #5c7a99; --btn: #ff8c42; --btn-dark: #d96a22; }

    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      position: fixed; inset: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', Tahoma, Arial, sans-serif;
      background: linear-gradient(160deg, #4dabf7 0%, #1c7ed6 100%);
      color: var(--ink);
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    .app {
      position: absolute; top: 44px; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 8px 4px 8px; overflow: hidden;
    }
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.25);
      display: flex; gap: 5px; padding: 6px 10px; z-index: 50;
      flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100vw;
    }
    nav a {
      color: #fff; text-decoration: none; font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      font-weight: 700; font-size: 0.75rem; padding: 4px 8px; border-radius: 20px;
      background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.25); white-space: nowrap;
    }

    .board-wrap {
      position: relative; flex: 1 1 auto; min-height: 260px;
      width: min(calc(100vw - 8px), 760px);
      display: flex; align-items: center; justify-content: center;
    }
    canvas#game {
      display: block; border-radius: 16px; touch-action: none;
      box-shadow: 0 0 0 5px #fff, 0 10px 0 5px rgba(0,0,0,0.12), 0 18px 30px rgba(0,0,0,0.25);
    }
    .overlay {
      position: absolute; inset: 0; margin: auto;
      border-radius: 16px; background: rgba(255,255,255,0.95);
      display: flex; flex-direction: column; align-items: center; justify-content: safe center;
      text-align: center; padding: 12px; gap: 8px; overflow-y: auto; z-index: 5;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: clamp(1.15rem, 5.2vw, 1.9rem); }
    .overlay p { color: var(--soft); font-size: clamp(0.78rem, 3.3vw, 1rem); max-width: 380px; }
    .overlay .label { font-size: 0.8rem; font-weight: bold; color: var(--soft); }
    .big { font-size: clamp(2rem, 9vw, 4rem); animation: hop 1.2s infinite; }
    @keyframes hop { 50% { transform: translateY(-6px) rotate(-6deg); } }
    .levels { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; width: 100%; max-width: 360px; }
    .lvl {
      border: 3px solid transparent; border-radius: 12px; padding: 3px 0; background: #d0ebff;
      font: inherit; font-weight: bold; font-size: clamp(0.9rem, 3.8vw, 1.15rem); cursor: pointer; color: var(--ink);
    }
    .lvl small { display: block; font-size: 0.6rem; letter-spacing: -1px; font-weight: normal; }
    .lvl.locked { opacity: 0.4; cursor: default; }
    .lvl.active { border-color: var(--btn); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .play-btn {
      border: none; background: var(--btn); color: #fff; font: inherit; font-size: 1.15rem; font-weight: bold;
      padding: 8px 28px; border-radius: 999px; cursor: pointer; box-shadow: 0 5px 0 var(--btn-dark);
    }
    .play-btn.alt { background: #7c5cff; box-shadow: 0 5px 0 #5a3fd1; }
    .play-btn:active { transform: translateY(3px); }
    .stars3 { font-size: clamp(2rem, 9vw, 3rem); letter-spacing: 4px; }
    .stars3 .off { filter: grayscale(1); opacity: 0.3; }

    .panel { width: min(calc(100vw - 8px), 560px); display: flex; flex-direction: column; gap: 6px; flex: none; }
    .coach { display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 4px; }
    .coach .face { font-size: 1.4rem; }
    .coach .face.talk { animation: hop .4s ease; }
    .bubble { flex: 1; font-size: clamp(0.74rem, 3.1vw, 0.9rem); line-height: 1.2; overflow: hidden; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
    .bubble span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .buttons button {
      border: none; border-radius: 14px; background: #fff; color: var(--ink); font: inherit; font-size: 0.78rem;
      height: 52px; padding: 4px 2px; box-shadow: 0 4px 0 rgba(0,0,0,0.13); cursor: pointer; line-height: 1.1;
    }
    .buttons button b { display: block; font-size: 1.35rem; }
    .buttons button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.13); }
    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
  </style>
  <style>
    /* one big button back to the games page */
    nav a.home-link { font-family: 'Segoe UI', Tahoma, Arial, sans-serif !important; font-size: 0.9rem !important; font-weight: 800 !important;
      padding: 4px 16px !important; border-radius: 999px !important; background: #fff !important; color: #5a3fd1 !important;
      border: none !important; box-shadow: 0 3px 0 rgba(0,0,0,0.18) !important; text-decoration: none !important; white-space: nowrap; }
    nav a.home-link:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.18) !important; }
  </style>

<body>
  <nav dir="rtl">
    <a class="home-link" href="index.html">🏠 כל המשחקים</a>
  </nav>

  <div class="app">
    <div class="board-wrap" id="wrap">
      <canvas id="game"></canvas>

      <div dir="rtl" class="overlay" id="startScreen">
        <div class="big">🐠</div>
        <h2>מים לדגי!</h2>
        <p>הדג הקטן צמא למים! 💧 <b>לחצו על הסיכות</b> כדי לשחרר את המים, או <b>סובבו את המבוך</b> עם האצבע, כדי שהמים יזרמו אל הדג. היזהרו מהלבה 🔥!</p>
        <div class="label">בחרו שלב:</div>
        <div class="levels" id="levels"></div>
        <button class="play-btn" id="playBtn">▶ שחקו!</button>
      </div>

      <div dir="rtl" class="overlay hidden" id="doneScreen">
        <div class="stars3" id="doneStars"></div>
        <h2 id="doneTitle">כל הכבוד!</h2>
        <p id="doneText"></p>
        <div class="row">
          <button class="play-btn" id="nextBtn">▶ לשלב הבא</button>
          <button class="play-btn alt" id="retryBtn">🔁 שוב</button>
        </div>
      </div>

      <div dir="rtl" class="overlay hidden" id="failScreen">
        <div class="big">🙈</div>
        <h2 id="failTitle">אוי!</h2>
        <p id="failText">לא נורא! נסו שוב. 💪</p>
        <button class="play-btn" id="againBtn">🔁 נסו שוב</button>
      </div>
    </div>

    <div class="panel">
      <div class="coach" dir="rtl">
        <div class="face" id="coachFace">🐠</div>
        <div class="bubble" id="bubble"><span>היי! אני דגי. אני צריך מים! 💧</span></div>
      </div>
      <div class="buttons" dir="rtl">
        <button id="restartBtn"><b>🔄</b>מחדש</button>
        <button id="hintBtn"><b>💡</b>רמז</button>
        <button id="menuBtn"><b>🏠</b>שלבים</button>
        <button id="soundBtn"><b>🔊</b>צליל</button>
      </div>
    </div>
  </div>

      ctx.textAlign = 'center'; ctx.fillStyle = '#7c5cff'; ctx.fillText(`שלב ${levelIdx + 1}`, W - 44, 21);
      const f = Math.min(1, ...goals.map(g => g.n / g.need));
      ctx.fillStyle = '#d0ebff'; roundRect(ctx, 40, 13, 220, 16, 8); ctx.fill();
      if (f > 0) { ctx.fillStyle = f >= 1 ? '#40c057' : '#228be6'; roundRect(ctx, 40, 13, Math.max(16, 220 * f), 16, 8); ctx.fill(); }
      ctx.textAlign = 'left'; ctx.fillText('💧', 14, 21);
      ctx.fillText('🐠', 266, 21);
    }

    // ---------- Hint ----------
    function makeHint() {
      if (L.type === 'pins') {
        const hp = nextHintPin();
        if (!hp) return;
        if (L.lava && L.hint.indexOf(hp.id) > 0 && countLava() > 0) { coach('💡 חכו שהלבה תהפוך לאבן אפורה... 🪨'); return; }
        if (L.waitFor && L.waitFor.pin === hp.id && goals[L.waitFor.bowl].n < goals[L.waitFor.bowl].need * 1.2) { coach(L.waitFor.text); return; }
        if (L.waitSwitch && L.hint.indexOf(hp.id) > 0 && switches.some(sw => !sw.on)) { coach('💡 חכו שהכפתור יתמלא והשער ייפתח... 🔴'); return; }
        hintOn = 1; coach(L.hint.indexOf(hp.id) === 0 && pins.length > 1 ? '💡 נסו קודם את הסיכה הזוהרת! 👆' : '💡 עכשיו את הסיכה הזוהרת! 👆', 'yay');
      } else {
        if (L.waitText && maze.achieved >= 1 && maze.S.g.includes(LAVA)) { coach(L.waitText); return; }
        if (!hintDir()) { coach('💡 חכו שהמים יזרמו... 💧'); return; }
        hintOn = 1; coach(hintDir() > 0 ? '💡 סובבו עם כיוון השעון ↻' : '💡 סובבו נגד כיוון השעון ↺', 'yay');
      }
    }
    function countLava() { let n = 0; for (let i = 0; i < world.g.length; i++) if (world.g[i] === LAVA) n++; return n; }

    // ---------- Coach ----------
    function coach(text, mood = '') {
      const b = $('bubble'), f = $('coachFace');
      b.innerHTML = `<span>${text}</span>`;
      f.textContent = mood === 'oops' ? '😵' : mood === 'yay' ? '🥳' : '🐠';
      f.classList.remove('talk'); void f.offsetWidth; f.classList.add('talk');
    }

    // ---------- Menus ----------
    function showMenu() {
      state = 'menu';
      ['doneScreen', 'failScreen'].forEach(id => $(id).classList.add('hidden'));
      $('startScreen').classList.remove('hidden');
      chosen = Math.min(chosen, progress.unlocked - 1);
      buildLevels();
      coach('היי! אני דגי. בחרו שלב! 💧');
    }
    function buildLevels() {
      $('levels').innerHTML = LEVELS.map((lv, i) => {
        const locked = i >= progress.unlocked, s = progress.stars[i] || 0;
        return `<button class="lvl ${locked ? 'locked' : ''} ${i === chosen ? 'active' : ''}" data-i="${i}">${locked ? '🔒' : i + 1}<small>${locked ? '' : '⭐'.repeat(s) + '·'.repeat(3 - s)}</small></button>`;
      }).join('');
      document.querySelectorAll('.lvl').forEach(b => b.addEventListener('click', () => {
        const i = +b.dataset.i;
        if (i >= progress.unlocked) { coach('השלב הזה עוד נעול 🔒 סיימו את השלב הקודם!'); return; }
        chosen = i; buildLevels(); tone(600, .06, 'triangle');
      }));
    }
    $('playBtn').addEventListener('click', () => loadLevel(chosen));
    $('nextBtn').addEventListener('click', () => { chosen = Math.min(LEVELS.length - 1, levelIdx + 1); loadLevel(chosen); });
    $('retryBtn').addEventListener('click', () => loadLevel(levelIdx));
    $('againBtn').addEventListener('click', () => loadLevel(levelIdx));
    $('restartBtn').addEventListener('click', () => { if (L && state !== 'menu') loadLevel(levelIdx); });
    $('menuBtn').addEventListener('click', showMenu);
    $('hintBtn').addEventListener('click', () => { if (state === 'play') makeHint(); });
    function updateSoundBtn() { $('soundBtn').innerHTML = `<b>${soundOn ? '🔊' : '🔇'}</b>צליל`; }
    $('soundBtn').addEventListener('click', () => { soundOn = !soundOn; save('water-sound', soundOn); updateSoundBtn(); });

    // ---------- Confetti ----------
    const cc = $('confetti'), cctx = cc.getContext('2d');
    let bits = [], confettiRunning = false;
    const COLORS = ['#ff5f6d', '#ff9a3c', '#ffd23f', '#5fd068', '#3fa9f5', '#7c5cff', '#e45bd8'];
    function sizeConfetti() { cc.width = innerWidth; cc.height = innerHeight; }
    addEventListener('resize', sizeConfetti); sizeConfetti();
    function confetti(n) {
      for (let i = 0; i < n; i++) bits.push({ x: Math.random() * cc.width, y: -20 - Math.random() * cc.height * 0.3, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3, s: 6 + Math.random() * 6, c: COLORS[i % COLORS.length] });
      if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(confettiLoop); }
    }
    function confettiLoop() {
      cctx.clearRect(0, 0, cc.width, cc.height);
      bits = bits.filter(b => b.y < cc.height + 20);
      for (const b of bits) { b.x += b.vx; b.y += b.vy; b.r += b.vr; cctx.save(); cctx.translate(b.x, b.y); cctx.rotate(b.r); cctx.fillStyle = b.c; cctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); cctx.restore(); }
      if (bits.length) requestAnimationFrame(confettiLoop); else { confettiRunning = false; cctx.clearRect(0, 0, cc.width, cc.height); }
    }

    // ---------- Main loop ----------
    const TICK = 1 / 90;
    let last = performance.now(), acc = 0;
    function advance(dt) {
      acc += dt;
      while (acc >= TICK) { if (L && (state === 'play' || state === 'win')) simTick(); update(TICK); acc -= TICK; }
    }
    function frame(now) {
      advance(Math.min(0.1, (now - last) / 1000)); last = now;
      render();
      requestAnimationFrame(frame);
    }
    fit(); updateSoundBtn();
    showMenu();
    requestAnimationFrame(frame);
    window.__water = {
      get s() { return { state, inBowl, goals: goals.map(g => g.n), sw: switches.map(w => w.on), need: L && L.need, totalWater, startWater, moves, theta: maze && Math.round(maze.theta / STEP), lava: L ? countLava() : 0 }; },
      loadLevel, pull: id => pullPin(pins[id]), rotate: rotateBy, run(sec) { for (let t = 0; t < sec; t += TICK) advance(TICK); }, LEVELS
    };
  </script>
  <script>
    // stop accidental zooming when little fingers tap fast (iPhone double-tap zoom and pinch zoom)
    (function () {
      let lastTouch = 0;
      document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastTouch < 350 && !e.target.closest('button, a')) e.preventDefault(); lastTouch = now; }, { passive: false });
      ['gesturestart', 'gesturechange', 'gestureend', 'dblclick'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
      document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
    })();
  </script>
</body>
</html>
