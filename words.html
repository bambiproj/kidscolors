<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מילים בעברית</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .tab-btn {
      padding: 10px 28px;
      border-radius: 50px;
      border: 2px solid rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
      white-space: nowrap;
    }

    .tab-btn.active, .tab-btn:hover {
      background: rgba(255,255,255,0.35);
      border-color: #fff;
    }

    @media (max-width: 440px) {
      .tabs { gap: 6px; }
      .tab-btn { padding: 8px 10px; font-size: 0.82rem; }
    }

    h1 {
      color: #fff;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      margin-bottom: 30px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
      letter-spacing: 2px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 32px 28px 28px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .score {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 18px;
    }

    .pokemon-word {
      font-size: clamp(2.4rem, 10vw, 3.8rem);
      font-weight: 900;
      color: #333;
      margin: 10px 0 16px;
      letter-spacing: 3px;
      line-height: 1.2;
    }

    .pokemon-word span {
      display: inline-block;
      transition: color 0.15s, transform 0.15s;
    }

    .pokemon-word span.active-letter {
      color: #11998e;
      transform: scale(1.35);
    }

    .play-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #11998e, #38ef7d);
      border: none;
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(17,153,142,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      margin: 0 auto 20px;
      display: block;
      line-height: 1;
    }

    .play-btn:hover:not(:disabled) { transform: scale(1.1); box-shadow: 0 6px 18px rgba(17,153,142,0.5); }
    .play-btn:disabled { opacity: 0.45; cursor: default; transform: none; }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .option-btn {
      border: 3px solid #e0e0e0;
      border-radius: 18px;
      background: #fafafa;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.2s, background 0.2s;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .option-btn img {
      width: 90px;
      height: 90px;
      image-rendering: pixelated;
      pointer-events: none;
    }

    .option-btn:hover:not(:disabled) {
      transform: translateY(-3px);
      border-color: #11998e;
      background: #f0fdf9;
    }

    .option-btn:disabled { cursor: default; }

    .option-btn.correct {
      background: #d4f8d4;
      border-color: #4caf50;
      animation: bounce 0.4s ease;
    }

    .option-btn.wrong {
      background: #fde8e8;
      border-color: #f44336;
      animation: shake 0.4s ease;
    }

    @keyframes bounce {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.1); }
      70%  { transform: scale(0.96); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%   { transform: translateX(0); }
      25%  { transform: translateX(-8px); }
      50%  { transform: translateX(8px); }
      75%  { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }

    .feedback {
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: 700;
      min-height: 2rem;
    }

    .feedback.wrong  { color: #f44336; }
    .feedback.hidden { opacity: 0; }

    .success-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.97);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .success-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .success-img {
      width: 128px;
      height: 128px;
      image-rendering: pixelated;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .success-emoji {
      font-size: 5rem;
      line-height: 1;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: none;
    }

    @keyframes popIn {
      0%   { transform: scale(0) rotate(-10deg); }
      70%  { transform: scale(1.2) rotate(3deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .success-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #444;
    }

    .success-en {
      font-size: 0.85rem;
      font-weight: 500;
      color: #aaa;
      margin-top: -6px;
    }

    .success-msg {
      font-size: 1.6rem;
      font-weight: 900;
      color: #4caf50;
    }

    .next-btn {
      margin-top: 10px;
      padding: 14px 40px;
      background: linear-gradient(135deg, #11998e, #38ef7d);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 16px rgba(17,153,142,0.4);
    }

    .next-btn:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <nav class="tabs">
    <a class="tab-btn" href="index.html">🎨 צבעים</a>
    <a class="tab-btn" href="math.html">➕ חשבון</a>
    <a class="tab-btn active" href="words.html">📖 מילים</a>
    <a class="tab-btn" href="alef-bet.html">א-ב</a>
  </nav>
  <h1>📖 ללמוד מילים!</h1>

  <div class="card">
    <div class="score" id="score">שאלה 1</div>
    <div class="pokemon-word" id="pokemonWord"></div>
    <button class="play-btn" id="playBtn" title="השמע אות">▶</button>
    <div class="options" id="options"></div>
    <div class="feedback hidden" id="feedback"></div>

    <div class="success-overlay" id="successOverlay">
      <img class="success-img" id="successImg" src="" alt="" />
      <div class="success-emoji" id="successEmoji"></div>
      <div class="success-name" id="successName"></div>
      <div class="success-en" id="successEn"></div>
      <div class="success-msg" id="successMsg"></div>
      <button class="next-btn" onclick="nextRound()">הבא ←</button>
    </div>
  </div>

  <script>
    const BASE = 'https://resource.pokemon-home.com/battledata/img/pokei128/icon';
    const CREATURES = [
      { num: '0001', name: 'בולבסאור',   en: 'Bulbasaur'  },
      { num: '0004', name: 'שרמנדר',     en: 'Charmander' },
      { num: '0007', name: 'סקווירטל',   en: 'Squirtle'   },
      { num: '0025', name: 'פיקאצ׳ו',    en: 'Pikachu'    },
      { num: '0035', name: 'קלפיירי',    en: 'Clefairy'   },
      { num: '0039', name: 'ג׳יגלי פאף', en: 'Jigglypuff' },
      { num: '0052', name: 'מיאות׳',     en: 'Meowth'     },
      { num: '0054', name: 'סייידאק',    en: 'Psyduck'    },
      { num: '0094', name: 'גנגאר',      en: 'Gengar'     },
      { num: '0129', name: 'מאגיקרפ',    en: 'Magikarp'   },
      { num: '0131', name: 'לפראס',      en: 'Lapras'     },
      { num: '0133', name: 'איווי',      en: 'Eevee'      },
      { num: '0143', name: 'סנורלקס',    en: 'Snorlax'    },
      { num: '0149', name: 'דרגוניט',    en: 'Dragonite'  },
      { num: '0150', name: 'מיוטו',      en: 'Mewtwo'     },
      { num: '0151', name: 'מיו',        en: 'Mew'        },
      { num: '0155', name: 'סינדאקוויל', en: 'Cyndaquil'  },
      { num: '0175', name: 'טוגפי',      en: 'Togepi'     },
      { num: '0196', name: 'אספאון',     en: 'Espeon'     },
      { num: '0197', name: 'אמברון',     en: 'Umbreon'    },
      { num: '0249', name: 'לוג׳יה',     en: 'Lugia'      },
      { num: '0250', name: 'הו-אוה',     en: 'Ho-Oh'      },
      { num: '0255', name: 'טורצ׳יק',    en: 'Torchic'    },
      { num: '0258', name: 'מאדקיפ',     en: 'Mudkip'     },
      { num: '0385', name: 'ג׳יראצ׳י',   en: 'Jirachi'    },
      { num: '0448', name: 'לוקריו',     en: 'Lucario'    },
      { num: '0658', name: 'גרנינג׳ה',   en: 'Greninja'   },
      { num: '0700', name: 'סילווייאון', en: 'Sylveon'    },
      { num: '0813', name: 'סקורבאני',   en: 'Scorbunny'  },
      { num: '0909', name: 'פואקוקו',    en: 'Fuecoco'    },
    ];
    const SUCCESS_MSGS = ['!כל הכבוד','!מדהים','!מצוין','!וואו','!נהדר','!אלוף'];

    let score = 0;
    let total = 0;
    let correct = null;
    let answered = false;
    let firstTry = true;
    let letterIndex = -1;
    let wordLetters = [];

    let audioCtx = null;
    function getCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function playSuccess() {
      const ctx = getCtx();
      [523, 659, 784].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = freq;
        const t = ctx.currentTime + i * 0.13;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.18, t + 0.04);
        gain.gain.linearRampToValueAtTime(0, t + 0.28);
        osc.start(t); osc.stop(t + 0.3);
      });
    }

    function playError() {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(280, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(180, ctx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.32);
    }

    function splitToLetters(word) {
      const groups = [];
      for (const ch of word) {
        if ((ch === '׳' || ch === '׳') && groups.length > 0) {
          groups[groups.length - 1] += ch;
        } else {
          groups.push(ch);
        }
      }
      return groups;
    }

    function speak(text, onEnd) {
      if (!window.speechSynthesis) { if (onEnd) onEnd(); return; }
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'he-IL';
      utt.rate = 0.8;
      if (onEnd) utt.onend = onEnd;
      window.speechSynthesis.speak(utt);
    }

    function playNextLetter() {
      const btn = document.getElementById('playBtn');
      btn.disabled = true;

      document.querySelectorAll('#pokemonWord span').forEach(s => s.classList.remove('active-letter'));

      letterIndex++;

      if (letterIndex < wordLetters.length) {
        const span = document.querySelector(`#pokemonWord span[data-idx="${letterIndex}"]`);
        if (span) span.classList.add('active-letter');
        const letter = wordLetters[letterIndex];
        const speakable = letter.replace(/[\s\-׳]/g, '');
        if (speakable) {
          speak(speakable, () => { btn.disabled = false; });
        } else {
          btn.disabled = false;
        }
      } else {
        letterIndex = -1;
        btn.textContent = '🔁';
        speak(correct.name, () => {
          btn.textContent = '▶';
          btn.disabled = false;
        });
      }
    }

    function shuffle(arr) {
      return [...arr].sort(() => Math.random() - 0.5);
    }

    function nextRound() {
      document.getElementById('successOverlay').classList.remove('show');
      window.speechSynthesis && window.speechSynthesis.cancel();
      answered = false;
      firstTry = true;
      letterIndex = -1;
      document.getElementById('feedback').className = 'feedback hidden';
      document.getElementById('feedback').textContent = '';

      const btn = document.getElementById('playBtn');
      btn.textContent = '▶';
      btn.disabled = false;

      const shuffled = shuffle(CREATURES);
      correct = shuffled[0];
      const options = shuffled.slice(0, 4);

      total++;
      document.getElementById('score').textContent = `שאלה ${total}  |  ✅ ${score}`;

      wordLetters = splitToLetters(correct.name);
      document.getElementById('pokemonWord').innerHTML = wordLetters
        .map((ch, i) => `<span data-idx="${i}">${ch}</span>`)
        .join('');

      const container = document.getElementById('options');
      container.innerHTML = '';

      shuffle(options).forEach(creature => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.dataset.num = creature.num;
        btn.innerHTML = `<img src="${BASE}${creature.num}_f00_s0.png" alt="${creature.en}" />`;
        btn.onclick = () => pick(btn, creature);
        container.appendChild(btn);
      });
    }

    function pick(btn, creature) {
      if (answered || btn.disabled) return;

      const feedback = document.getElementById('feedback');

      if (creature.num === correct.num) {
        answered = true;
        window.speechSynthesis && window.speechSynthesis.cancel();
        document.getElementById('playBtn').disabled = true;
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
        document.querySelectorAll('#pokemonWord span').forEach(s => s.classList.remove('active-letter'));
        btn.classList.add('correct');
        score++;
        document.getElementById('score').textContent = `שאלה ${total}  |  ✅ ${score}`;
        feedback.className = 'feedback hidden';

        setTimeout(() => {
          if (firstTry) {
            document.getElementById('successImg').src = BASE + correct.num + '_f00_s0.png';
            document.getElementById('successImg').alt = correct.en;
            document.getElementById('successImg').style.display = '';
            document.getElementById('successEmoji').style.display = 'none';
            document.getElementById('successName').textContent = correct.name;
            document.getElementById('successEn').textContent = correct.en;
            document.getElementById('successMsg').textContent = SUCCESS_MSGS[Math.floor(Math.random() * SUCCESS_MSGS.length)];
          } else {
            document.getElementById('successImg').style.display = 'none';
            document.getElementById('successEmoji').style.display = 'block';
            document.getElementById('successEmoji').textContent = '👍';
            document.getElementById('successName').textContent = correct.name;
            document.getElementById('successEn').textContent = correct.en;
            document.getElementById('successMsg').textContent = 'נכון!';
          }
          document.getElementById('successOverlay').classList.add('show');
          playSuccess();
        }, 350);
      } else {
        firstTry = false;
        btn.classList.add('wrong');
        btn.disabled = true;
        playError();
        feedback.textContent = '!נסה שוב 💪';
        feedback.className = 'feedback wrong';
      }
    }

    document.getElementById('playBtn').onclick = playNextLetter;
    nextRound();
  </script>
</body>
</html>
